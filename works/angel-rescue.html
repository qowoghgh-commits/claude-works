<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>천사 구출 대작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: one arcade cabinet column — header strip, 16:9 game screen, then touch pad or key guide. Single dark look by choice. */
:root{
  --bg:#141a33; --panel:#1f2850; --ink:#f4f1ff; --muted:#aab2d8;
  --gold:#ffd447; --btn:#2c3770; --btn-hi:#4250a0; --line:#3a4688;
  --display:"Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--display);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  -webkit-user-select:none; user-select:none;
}
.wrap{width:100%; max-width:max(340px, min(1100px, calc((100vh - 190px) * 16 / 9))); min-width:0; display:flex; flex-direction:column; gap:10px}
header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
header h1{margin:0; font-size:22px; font-weight:400; letter-spacing:.02em; color:var(--gold)}
.tools{display:flex; gap:8px; flex-wrap:wrap}
.tools button{
  font:inherit; font-size:15px; color:var(--ink); background:var(--btn); border:2px solid var(--line);
  border-radius:10px; padding:6px 12px; cursor:pointer;
}
.tools button:hover{background:var(--btn-hi)}
.tools button:focus-visible, .pad button:focus-visible, canvas:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
canvas{display:block; width:100%; max-width:100%; aspect-ratio:16/9; image-rendering:pixelated; border-radius:8px; background:#000; touch-action:none; outline:none}
.hint{margin:0; text-align:center; color:var(--muted); font-size:15px; line-height:1.6}
.hint b{color:var(--ink); font-weight:400; background:var(--btn); border:1px solid var(--line); border-radius:6px; padding:0 7px; margin:0 2px}
.pad{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.screen{position:relative; width:100%}
.profile{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,26,51,0.96); border-radius:8px; overflow:auto; padding:clamp(6px, 2vw, 18px); box-sizing:border-box}
.pbox{width:100%; max-width:560px; display:flex; flex-direction:column; gap:clamp(6px, 1.4vw, 12px); min-width:0}
.pbox h2{margin:0; text-align:center; font-weight:400; color:var(--gold); font-size:clamp(18px, 3.4vw, 32px); text-wrap:balance}
.plist{display:flex; flex-direction:column; gap:8px; max-height:clamp(70px, 22vw, 220px); overflow:auto}
.plist .empty{margin:0; text-align:center; color:var(--muted); font-size:clamp(13px, 1.8vw, 16px)}
.prow{display:flex; gap:8px; align-items:stretch}
.pbtn{flex:1; min-width:0; display:grid; grid-template-columns:auto auto 1fr; align-items:center; gap:10px; text-align:left;
  font:inherit; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:8px 12px; cursor:pointer}
.pbtn:hover, .pbtn:focus-visible{border-color:var(--gold); outline:none}
.pbtn b{font-weight:400; font-size:clamp(16px, 2.4vw, 22px)}
.pbtn span{color:var(--gold); letter-spacing:.08em}
.pbtn small{color:var(--muted); font-size:clamp(11px, 1.5vw, 14px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right}
.pdel{font:inherit; font-size:13px; color:var(--muted); background:transparent; border:2px solid var(--line); border-radius:12px; padding:0 10px; cursor:pointer}
.pdel.arm{color:#ff9ab0; border-color:#ff9ab0}
.pnew{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pnew label{color:var(--muted); font-size:15px}
.pnew input{flex:1; min-width:120px; font:inherit; font-size:clamp(16px, 2.4vw, 22px); color:var(--ink); background:#0c1024; border:2px solid var(--line); border-radius:12px; padding:8px 12px}
.pnew input:focus{outline:none; border-color:var(--gold)}
.pnew .go{font:inherit; font-size:clamp(16px, 2.2vw, 20px); color:#2a1f00; background:var(--gold); border:2px solid #fff3b0; border-radius:12px; padding:8px 18px; cursor:pointer}
.pmsg{margin:0; text-align:center; color:var(--muted); font-size:clamp(12px, 1.6vw, 15px)}
.pmsg.warn{color:#ff9ab0}
.back{align-self:center; font:inherit; font-size:14px; color:var(--muted); background:transparent; border:none; cursor:pointer; padding:4px 8px}
.pad .grp{display:flex; gap:10px}
.pad button{
  font:inherit; color:var(--ink); background:var(--btn); border:3px solid var(--line);
  width:64px; height:64px; border-radius:50%; font-size:24px; touch-action:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; padding:0;
}
.pad button span{font-size:11px; color:var(--muted); margin-top:3px}
.pad button.on{background:var(--btn-hi); border-color:var(--gold)}
.pad button.sp b{color:var(--gold)}
.pad b{font-weight:400}
@media (max-width:480px){ .pad button{width:54px; height:54px; font-size:20px} .pad .grp{gap:6px} }

/* ---- touch mode: the game fills a landscape screen, controls float on top ---- */
body.touch{padding:0; height:100vh; height:100dvh; overflow:hidden; overscroll-behavior:none; justify-content:center; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
body.touch header, body.touch .hint, body.touch .pad{display:none!important}
body.touch .wrap{max-width:none; width:100vw; height:100%; justify-content:center; align-items:center; gap:0}
body.touch .screen{width:min(100vw, calc(100dvh * 16 / 9))}
body.touch canvas{border-radius:0}
.touchui{position:fixed; inset:0; z-index:20; pointer-events:none; touch-action:none}
.joyzone{position:absolute; left:0; bottom:0; width:46vw; height:72%; pointer-events:auto; touch-action:none}
.joy{position:absolute; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%; background:rgba(20,26,51,0.38); border:3px solid rgba(255,255,255,0.55)}
.knob{position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:rgba(255,212,71,0.85); border:3px solid #fff3b0; box-shadow:0 2px 8px rgba(0,0,0,0.35)}
.joyhint{position:absolute; left:max(28px, env(safe-area-inset-left, 0px)); bottom:max(28px, env(safe-area-inset-bottom, 0px)); width:120px; height:120px; border-radius:50%; border:3px dashed rgba(255,255,255,0.6); color:#fff; font-size:14px; line-height:1.35; display:flex; align-items:center; justify-content:center; text-align:center; background:rgba(20,26,51,0.3); text-shadow:0 1px 2px #000}
.tbtns{position:absolute; right:max(16px, env(safe-area-inset-right, 0px)); bottom:max(14px, env(safe-area-inset-bottom, 0px)); width:270px; height:230px; pointer-events:none}
.tbtn{position:absolute; pointer-events:auto; touch-action:none; font:inherit; color:#fff; border-radius:50%; border:3px solid rgba(255,255,255,0.6); background:rgba(20,26,51,0.45);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; line-height:1; overflow:hidden; cursor:pointer; -webkit-user-select:none; user-select:none}
.tbtn i{font-style:normal; font-size:30px}
.tbtn span{font-size:12px; margin-top:4px; text-shadow:0 1px 2px #000}
.tbtn em{position:absolute; inset:0; border-radius:50%; pointer-events:none}
.tbtn.on{background:rgba(255,212,71,0.55); border-color:#fff3b0; transform:scale(0.94)}
.tbtn.jump{right:0; bottom:0; width:100px; height:100px; background:rgba(66,211,107,0.45)}
.tbtn.jump i{font-size:38px}
.tbtn.act{width:74px; height:74px}
#tA{right:112px; bottom:4px}
#tS{right:100px; bottom:98px}
#tD{right:8px; bottom:116px}
.tbtn.star{right:196px; bottom:92px; width:70px; height:70px; background:rgba(122,63,176,0.7); border-color:#ffd447; animation:glow .8s ease-in-out infinite alternate}
.tbtn.star i{color:#ffd447}
@keyframes glow{from{box-shadow:0 0 6px #ffd447} to{box-shadow:0 0 22px #ffd447}}
.tpause{top:max(10px, env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); width:52px; height:52px; font-size:18px; letter-spacing:-2px}
.rotate{position:fixed; inset:0; z-index:40; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px}
.rotate p{margin:0; font-size:22px}
.rotate b{color:var(--gold); font-weight:400}
.rotate .phone{width:64px; height:110px; border:5px solid var(--gold); border-radius:14px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; box-sizing:border-box; animation:turn 1.6s ease-in-out infinite}
.rotate .phone div{width:16px; height:4px; border-radius:2px; background:var(--gold)}
@keyframes turn{0%,20%{transform:rotate(0)} 60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion: reduce){ .rotate .phone, .tbtn.star{animation:none} }
/* ---- full screen: the game fills the whole monitor or tablet ---- */
body.fs{padding:0; height:100vh; height:100dvh; overflow:hidden; justify-content:center; background:#000}
body.fs header, body.fs .hint{display:none!important}
body.fs .wrap{max-width:none; width:100vw; height:100%; justify-content:center; align-items:center; gap:0}
body.fs .screen{width:min(100vw, calc(100dvh * 16 / 9))}
body.fs canvas{border-radius:0}
body.fs:not(.touch) .pad{position:fixed; left:12px; right:12px; bottom:10px; z-index:15; pointer-events:none}
body.fs:not(.touch) .pad button{pointer-events:auto; opacity:.85}
.fsbtn{position:fixed; z-index:30; top:max(10px, env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); width:52px; height:52px; border-radius:50%;
  font:inherit; font-size:24px; line-height:1; color:#fff; background:rgba(20,26,51,0.55); border:3px solid rgba(255,255,255,0.6); cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.fsbtn:hover{background:rgba(42,53,106,0.8)}
.fsbtn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.fsbtn.beside{right:calc(max(12px, env(safe-area-inset-right, 0px)) + 64px)}
.fsbtn svg{width:24px; height:24px}
.fstip{position:fixed; z-index:45; left:50%; top:74px; transform:translateX(-50%); max-width:min(420px, calc(100vw - 32px)); background:#1f2850; color:#fff; border:2px solid var(--gold); border-radius:14px; padding:12px 16px; font-size:16px; line-height:1.5; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fstip b{color:var(--gold); font-weight:400}
</style>

<div class="wrap">
  <header>
    <h1>천사 구출 대작전</h1>
    <div class="tools">
      <button id="btnPad" type="button">화면 버튼</button>
      <button id="btnPause" type="button">멈춤</button>
      <button id="btnMute" type="button">소리 켜짐</button>
      <button id="btnFs" type="button" title="F 키">전체화면</button>
    </div>
  </header>
  <div class="screen">
    <canvas id="game" tabindex="0" aria-label="천사 구출 대작전 게임 화면"></canvas>
    <div class="profile" id="profile" hidden>
      <div class="pbox">
        <h2>누가 모험을 떠날까요?</h2>
        <div class="plist" id="plist"></div>
        <form class="pnew" id="pform" autocomplete="off">
          <label for="pname">새 이름</label>
          <input id="pname" maxlength="8" placeholder="이름을 써요">
          <button type="submit" class="go">시작!</button>
        </form>
        <p class="pmsg" id="pmsg">이름마다 깬 스테이지, 레벨, 아이템이 따로 저장돼요</p>
        <button type="button" class="back" id="pback">← 처음 화면</button>
      </div>
    </div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="pad" id="pad" hidden>
    <div class="grp">
      <button type="button" data-k="Left" aria-label="왼쪽">◀</button>
      <button type="button" data-k="Up" aria-label="점프">▲</button>
      <button type="button" data-k="Down" aria-label="앉기">▼</button>
      <button type="button" data-k="Right" aria-label="오른쪽">▶</button>
    </div>
    <div class="grp">
      <button type="button" data-k="A"><b>A</b><span id="lblA">총</span></button>
      <button type="button" data-k="S"><b>S</b><span id="lblS">칼</span></button>
      <button type="button" data-k="D"><b>D</b><span id="lblD">방패</span></button>
      <button type="button" data-k="Space" class="sp"><b>★</b><span>합체</span></button>
    </div>
  </div>
</div>
<!-- touch controls laid over the game (tablets and phones, landscape) -->
<button type="button" class="fsbtn" id="fsFloat" aria-label="전체화면" hidden></button>
<div class="fstip" id="fsTip" hidden></div>
<div class="touchui" id="touchui" hidden>
  <div class="joyzone" id="joyzone">
    <div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
    <div class="joyhint" id="joyhint">여기를 누르고<br>밀어서 이동</div>
  </div>
  <button type="button" class="tbtn tpause" id="tPause" aria-label="멈춤">❚❚</button>
  <div class="tbtns">
    <button type="button" class="tbtn act" data-k="A" id="tA"><i></i><span></span><em></em></button>
    <button type="button" class="tbtn act" data-k="S" id="tS"><i></i><span></span><em></em></button>
    <button type="button" class="tbtn act" data-k="D" id="tD"><i></i><span></span><em></em></button>
    <button type="button" class="tbtn jump" data-k="Up" id="tUp"><i>⬆</i><span>점프</span></button>
    <button type="button" class="tbtn star" data-k="Space" id="tSp" hidden><i>★</i><span>합체!</span></button>
  </div>
</div>
<div class="rotate" id="rotate" hidden>
  <div class="phone"><div></div></div>
  <p>휴대폰을 <b>가로로</b> 돌려 주세요</p>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540, T = 40;
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;
const FONT = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif';

/* ---------------- storage (per-viewer convenience only) ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('angel_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('angel_' + k, JSON.stringify(v)); }catch(e){} }
};

/* ---------------- sound ---------------- */
let actx = null, muted = store.get('muted', false);
function ensureAudio(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function beep(f, d, type, vol, slide){
  if(muted || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, vol){
  if(muted || !actx) return;
  const len = Math.floor(actx.sampleRate * d), b = actx.createBuffer(1, len, actx.sampleRate), data = b.getChannelData(0);
  for(let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource(), g = actx.createGain(); s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(actx.destination); s.start();
}
const SFX = {
  jump: () => beep(520, 0.12, 'square', 0.05, 300),
  shoot: () => beep(900, 0.06, 'square', 0.04, -450),
  throw: () => beep(500, 0.1, 'triangle', 0.07, 250),
  slash: () => { noise(0.08, 0.07); beep(320, 0.08, 'sawtooth', 0.035, 300); },
  hit: () => beep(220, 0.08, 'square', 0.06, -120),
  hurt: () => beep(170, 0.22, 'sawtooth', 0.07, -90),
  brick: () => noise(0.18, 0.12),
  coin: () => { beep(988, 0.07, 'square', 0.05); setTimeout(() => beep(1319, 0.12, 'square', 0.05), 70); },
  block: () => beep(1250, 0.06, 'triangle', 0.08),
  heal: () => { beep(660, 0.1, 'triangle', 0.07, 200); setTimeout(() => beep(880, 0.15, 'triangle', 0.07, 200), 90); },
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'square', 0.05), i * 150)),
  select: () => beep(720, 0.05, 'square', 0.04),
  boom: () => { noise(0.35, 0.13); beep(120, 0.3, 'sawtooth', 0.05, -60); },
  arrow: () => beep(420, 0.07, 'triangle', 0.045, -200),
  alarm: () => [440, 330, 440, 330].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'square', 0.05), i * 170)),
};

/* ---------------- pixel sprites (drawn from the child's picture) ---------------- */
// shared body of the three heroes, from the child's close-up drawing of 파랑
const BODY = [
  "..BBKKBBKKBB..",
  "..BBKWBBKWBB..",
  ".BBBKKBBKKBBB.",
  ".BBBBBKKBBBBB.",
  ".BBBBKBBKBBBB.",
  "KKKKKKKKKKKKKK",
  "KKKKKKKKKKKKKK",
  "..BBBBBBBBBB..",
  ".bbbbb..bbbbb.",
  ".bbbbb..bbbbb.",
];
function mk(rows, pal, s, outline){
  s = s || 4;
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const filled = (x, y) => y >= 0 && y < h && x >= 0 && x < (rows[y] || '').length && rows[y][x] !== '.';
  const make = (white) => {
    const c = document.createElement('canvas'); c.width = w * s; c.height = h * s;
    const g = c.getContext('2d');
    rows.forEach((r, y) => { for(let x = 0; x < r.length; x++){ const ch = r[x]; if(ch === '.') continue; g.fillStyle = white ? '#ffffff' : pal[ch]; g.fillRect(x * s, y * s, s, s); } });
    if(outline && !white){
      g.fillStyle = outline; const t = Math.max(1, s / 4);
      rows.forEach((r, y) => { for(let x = 0; x < r.length; x++){
        if(!filled(x, y)) continue;
        if(!filled(x, y - 1)) g.fillRect(x * s, y * s, s, t);
        if(!filled(x, y + 1)) g.fillRect(x * s, y * s + s - t, s, t);
        if(!filled(x - 1, y)) g.fillRect(x * s, y * s, t, s);
        if(!filled(x + 1, y)) g.fillRect(x * s + s - t, y * s, t, s);
      } });
    }
    return c;
  };
  return { img: make(false), wht: make(true), W: w * s, H: h * s };
}
const SPR = {
  blue: mk([
    "..........k...",
    ".........PkP..",
    "........PWPPP.",
    "....BBBBPPPPP.",
    "..BBBBBBBPPP..",
    ...BODY,
  ], {b:'#2a55c8', B:'#3366e0', W:'#ffffff', K:'#111522', P:'#3d3a9e', k:'#1e1b5a'}),
  green: mk([
    "...pp.CCC.pp..",
    "...ppCCWCCpp..",
    "...pp.CCC.pp..",
    "....BBBBBB....",
    "..BBBBBBBBBB..",
    ...BODY,
  ], {b:'#3fae4a', B:'#7be07b', W:'#ffffff', K:'#111522', C:'#e0408a', p:'#ff9ec8'}),
  white: mk([
    "....BBBBBB....",
    "..BBBBBBBBBB..",
    ...BODY,
  ], {b:'#c9d0de', B:'#f4f6fb', W:'#ffffff', K:'#111522'}, 4, '#7c879e'),
  villain: mk([
    "..DDDDDDDD..",
    ".DggdggdggD.",
    ".DKKggggKKD.",
    ".DgRKggKRgD.",
    ".DggggggggD.",
    ".DgWDWWDWgD.",
    ".DDDDDDDDDD.",
    "..DggggggD..",
    "..DgdggdgD..",
    "..DggggggD..",
    "..DDD..DDD..",
  ], {D:'#3d4252', g:'#9aa1b2', d:'#7d8496', K:'#111111', R:'#ff3b3b', W:'#ffffff'}),
  bossV: null,

  const all = Object.assign({}, loadLocalProfiles());
  for(const p of cloudList){ if(p && p.name && (!all[p.name] || (p.updated || 0) > (all[p.name].updated || 0))) all[p.name] = p; }
  return all;
}
const saveProfiles = all => store.set('profiles', all);

async function useProfile(name){
  const api = cloudApi();
  if(api){
    pmsgEl.textContent = '온라인 저장을 불러오는 중...';
    try{
      const remote = await api.load(name);
      const local = loadLocalProfiles()[name];
      if(remote && (!local || (remote.updated || 0) >= (local.updated || 0))){ const all = loadLocalProfiles(); all[name] = remote; saveProfiles(all); }
    }catch(e){ /* offline: keep the local save */ }
  }
  const all = loadProfiles();
  if(!all[name]) all[name] = blankProfile(name);
  profile = all[name]; profile.updated = Date.now();
  const local = loadLocalProfiles(); local[name] = profile; saveProfiles(local); store.set('current', name);
  pushCloud(true);
  selIdx = Math.max(0, ORDER.indexOf(profile.sel));
  SFX.coin(); state = 'select';
}
function pushCloud(now){
  const api = cloudApi(); if(!api || !profile || profile.guest) return;
  clearTimeout(cloudTimer);
  const send = () => { api.save(JSON.parse(JSON.stringify(profile))).catch(() => {}); };
  if(now) send(); else cloudTimer = setTimeout(send, 1500);
}
function saveProfile(){
  if(!profile || profile.guest) return;
  if(chosenId && run){ profile.sel = chosenId; profile.runs[chosenId] = JSON.parse(JSON.stringify(run)); }
  profile.updated = Date.now();
  const all = loadLocalProfiles(); all[profile.name] = profile; saveProfiles(all);
  pushCloud(false);
}

/* ---------------- tiles & physics ---------------- */
function tileAt(tx, ty){
  if(tx < 0 || tx >= stage.cols) return 'S';
  if(ty < 0 || ty >= stage.rows) return '.';
  return stage.map[ty][tx];
}
const isSolid = ch => ch === '#' || ch === 'C' || ch === 'S' || ch === 'B' || ch === '?' || ch === 'U' || ch === 'W' || ch === 'K' || ch === 'R';
// 독(P)과 용암(L): 밟을 수 없고, 빠지면 체력이 많이 줄어요
const isLiquid = ch => ch === 'P' || ch === 'L';
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function moveX(e){
  e.x += e.vx;
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  if(e.vx > 0){
    const tx = Math.floor((e.x + e.w) / T);
    for(let ty = y0; ty <= y1; ty++) if(isSolid(tileAt(tx, ty))){ e.x = tx * T - e.w - 0.01; e.vx = 0; return true; }
  } else if(e.vx < 0){
    const tx = Math.floor(e.x / T);
    for(let ty = y0; ty <= y1; ty++) if(isSolid(tileAt(tx, ty))){ e.x = (tx + 1) * T + 0.01; e.vx = 0; return true; }
  }
  return false;
}
function moveY(e){
  e.y += e.vy; e.onGround = false;
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  if(e.vy > 0){
    const ty = Math.floor((e.y + e.h) / T);
    for(let tx = x0; tx <= x1; tx++) if(isSolid(tileAt(tx, ty))){ e.y = ty * T - e.h; e.vy = 0; e.onGround = true; return null; }
  } else if(e.vy < 0){
    const ty = Math.floor(e.y / T);
    let best = null, bd = 1e9;
    for(let tx = x0; tx <= x1; tx++) if(isSolid(tileAt(tx, ty))){
      const d = Math.abs((tx + 0.5) * T - (e.x + e.w / 2)); if(d < bd){ bd = d; best = {tx, ty}; }
    }
    if(best){ e.y = (ty + 1) * T; e.vy = 0; return best; }
  }
  return null;
}

/* ---------------- effects ---------------- */
function burst(x, y, colors, n, spd, size){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * (spd || 4);
    parts.push({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 1.5, life:30 + Math.random() * 25, color:colors[i % colors.length], size:size || (3 + Math.random() * 4), grav:0.18});
  }
}
function floatText(x, y, text, color, size){ texts.push({x, y, text, color, size:size || 20, life:50}); }

function damageBrick(tx, ty, d){
  if(tileAt(tx, ty) !== 'B') return;
  const key = tx + ',' + ty;
  const hp = (brickHp[key] == null ? 3 : brickHp[key]) - d;
  if(hp <= 0){
    stage.map[ty][tx] = '.'; delete brickHp[key];
    burst(tx * T + 20, ty * T + 20, ['#c8553d', '#e7836a', '#7a2e22'], 10, 4, 6);
    SFX.brick(); shake = Math.max(shake, 4);
  } else { brickHp[key] = hp; burst(tx * T + 20, ty * T + 20, ['#e7836a'], 3, 2, 4); }
}
function hurtPlayer(dmg, dir){
  const p = player;
  if(state !== 'play' || p.inv > 0 || p.roll > 0 || p.special || (p.id === 'white' && p.dash > 0)) return false;
  p.hp = Math.max(0, p.hp - dmg); p.inv = 60;
  p.vx = (dir || -p.face) * 4; p.vy = -4;
  floatText(p.x + p.w / 2, p.y - 10, '-' + dmg, '#ff6b6b', 22);
  SFX.hurt(); shake = Math.max(shake, 8);
  return true;
}
function damageEnemy(e, dmg, dir, knock){
  if(e.dead) return;
  if(e.boss && !e.active) return;
  if(e.mode === 'fall') return;
  if(e.bdef && e.bdef.pattern === 'skull' && e.phase === 1){
    // 체력 ?? 단계: 숨은 체력이 다 닳으면 진짜 체력 1000이 보여요
    dmg = Math.round(dmg * atkMul());
    e.hidden -= dmg; e.flash = 6;
    floatText(e.x + e.w / 2 + (Math.random() * 16 - 8), e.y - 6, String(dmg), '#ffe066', 20);
    SFX.hit();
    if(e.hidden <= 0) revealSkull(e);
    return;
  }
  dmg = Math.round(dmg * atkMul());
  e.hp -= dmg; e.flash = 6;
  const k = e.boss ? (knock || 2) * 0.35 : (knock || 2);
  e.vx = dir * k; e.stun = k > 4 ? 18 : 6;
  floatText(e.x + e.w / 2 + (Math.random() * 16 - 8), e.y - 6, String(dmg), '#ffe066', 20);
  SFX.hit();
  if(e.hp <= 0){ e.hp = 0; killEnemy(e); }
}
function killEnemy(e){
  e.dead = true; kills++;
  burst(e.x + e.w / 2, e.y + e.h / 2, ['#9aa1b2', '#3d4252', '#ffffff', '#ff3b3b'], e.boss ? 60 : 18, e.boss ? 7 : 4, e.boss ? 8 : 5);
  SFX.boom(); shake = Math.max(shake, e.boss ? 18 : 6);
  if(e.boss){
    rescueFrom = {x:e.x + e.w / 2 - 36, y:Math.min(e.y + 100, 11 * T - 60)};
    state = 'clearing'; clearT = 150; arrows = [];
    for(const m of enemies) if(!m.dead && !m.boss){ m.dead = true; burst(m.x + m.w / 2, m.y + m.h / 2, ['#b26bff', '#ffffff'], 10, 3, 4); }
    run.frames += playFrames; run.kills += kills;
    ensureProfile().cleared[stage.num] = true; saveProfile();
    setTimeout(SFX.win, 400);
  } else if(Math.random() < 0.35){
    dropItem(e.x + 8, e.y, Math.random() < 0.8 ? 'heart' : randomBlockItem());
  }
  gainExp(Math.round((KILL_EXP[e.type] || 10) * (player.id === 'white' ? 1.5 : 1)));
}
function explode(s){
  const r = 72;
  burst(s.x, s.y, ['#ff7eb6', '#ffd1e6', '#e0408a'], 22, 5, 6);
  SFX.boom();
  enemies.forEach(e => {
    if(e.dead) return;
    const dx = e.x + e.w / 2 - s.x, dy = e.y + e.h / 2 - s.y;
    if(Math.hypot(dx, dy) < r + e.w / 2) damageEnemy(e, s.dmg, Math.sign(dx) || 1, 5);
  });
  const tx0 = Math.floor((s.x - r) / T), tx1 = Math.floor((s.x + r) / T), ty0 = Math.floor((s.y - r) / T), ty1 = Math.floor((s.y + r) / T);
  for(let ty = ty0; ty <= ty1; ty++) for(let tx = tx0; tx <= tx1; tx++){
    if(Math.hypot((tx + 0.5) * T - s.x, (ty + 0.5) * T - s.y) < r) damageBrick(tx, ty, s.brick);
  }
}

function useSkills(p){
  const id = p.id, cx = p.x + p.w / 2;

function updatePlayer(){
  const p = player, c = p.c;
  for(const k in p.cd) if(p.cd[k] > 0) p.cd[k]--;
  if(p.inv > 0) p.inv--;
  if(p.recoil > 0) p.recoil--;
  if(p.slashT > 0) p.slashT--;
  if(p.wings > 0) p.wings--;
  const move = (held.Left ? -1 : 0) + (held.Right ? 1 : 0);
  const wingDash = p.special && p.id === 'white' && p.special.t < 45;
  // crouch (↓): low hitbox so straight arrows fly over the head
  const fullH = SPR[p.id].H;
  const wantCrouch = !!held.Down && p.onGround && p.dash <= 0 && p.roll <= 0 && !pressed.Up;
  if(wantCrouch && !p.crouch){ p.crouch = true; p.y += fullH - CROUCH_H; p.h = CROUCH_H; }
  else if(!wantCrouch && p.crouch){
    const ny = p.y - (fullH - CROUCH_H);
    const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - 0.01) / T), ty0 = Math.floor(ny / T), ty1 = Math.floor((p.y - 0.01) / T);
    let blocked = false;
    for(let ty = ty0; ty <= ty1; ty++) for(let tx = x0; tx <= x1; tx++) if(isSolid(tileAt(tx, ty))) blocked = true;
    if(!blocked){ p.crouch = false; p.y = ny; p.h = fullH; }
  }
  if(wingDash){
    p.vx = p.face * 14; p.vy = 0;
  } else if(p.dash > 0){
    p.vx = p.face * p.dashSpeed; p.dash--;
    if(p.id === 'white') p.vy = 0;
    if(frameN % 2 === 0) parts.push({x:p.x + p.w / 2 - p.face * 20, y:p.y + p.h / 2 + (Math.random() * 20 - 10), vx:-p.face * 2, vy:0, life:12, color:'#ffffff', size:4, grav:0});
  } else if(p.roll > 0){
    p.vx = p.face * 7.5; p.roll--;
  } else {
    const spd = c.speed * (p.shield ? 0.4 : 1) * (p.crouch ? 0.35 : 1);
    p.vx += (move * spd - p.vx) * 0.35;
    if(move && !p.shield) p.face = move;
    else if(move && p.shield && Math.abs(p.vx) < 0.2) p.face = move;
  }
  if(pressed.Up && !p.crouch){
    if(p.onGround){ p.vy = -c.jump; p.jumps = 1; SFX.jump(); }
    else {
      if(p.jumps === 0) p.jumps = 1;
      if(p.jumps < c.maxJumps + (p.bonusJumps || 0)){
        p.vy = -c.jump * 0.92; p.jumps++;
        beep(640 + p.jumps * 120, 0.12, 'square', 0.05, 300);
        burst(p.x + p.w / 2, p.y + p.h, ['#ffffff', '#dfe6f5', '#ffd447'], 10, 2, 4);
      }
    }
  }
  if(!(p.id === 'white' && (p.dash > 0 || wingDash))){
    p.vy += 0.6;
    if(!held.Up && p.vy < -4) p.vy += 0.5;
    p.vy = Math.min(p.vy, 14);
  }
  if(stage.winds && stage.winds.length){
    const col = (p.x + p.w / 2) / T;
    for(const w of stage.winds){
      if(col >= w.x0 && col <= w.x1 + 1 && p.y + p.h > 4 * T){
        p.vy = Math.max(p.vy - 1.3, -7.5);
        if(p.jumps > 1) p.jumps = 1;
        if(frameN % 4 === 0) parts.push({x:p.x + Math.random() * p.w, y:p.y + p.h, vx:0, vy:-2, life:16, color:'#ffffff', size:4, grav:0});
      }
    }
  }
  moveX(p);
  const prevBottom = p.y + p.h;
  const head = moveY(p);
  // standing on a skateboard
  p.board = null;
  if(p.vy >= 0){
    for(const b of stage.boards || []){
      if(p.x + p.w > b.x + 6 && p.x < b.x + b.w - 6 && prevBottom <= b.y + 2 && p.y + p.h >= b.y){
        p.y = b.y - p.h; p.vy = 0; p.onGround = true; p.board = b; break;
      }
    }
  }
  if(p.onGround) p.jumps = 0;
  if(head){
    const ch = tileAt(head.tx, head.ty);
    if(ch === '?'){
      stage.map[head.ty][head.tx] = 'U'; bumps[head.tx + ',' + head.ty] = 10;
      dropItem(head.tx * T + 8, head.ty * T - 26, randomBlockItem());
      SFX.coin();
    } else if(ch === 'B'){ damageBrick(head.tx, head.ty, 1); bumps[head.tx + ',' + head.ty] = 8; }
    else SFX.hit();
  }
  if(p.x < 0) p.x = 0;
  if(p.x > stage.cols * T - p.w) p.x = stage.cols * T - p.w;
  useSkills(p);
  if(p.swing){
    const r = p.swing.rect();
    enemies.forEach(e => { if(!e.dead && !p.swing.hit.has(e) && overlap(r, e)){
      damageEnemy(e, p.swing.dmg, p.face, p.swing.knock); p.swing.hit.add(e);
      if(e.type === 'spiky' && p.dash > 0 && p.inv <= 0){ p.hp = Math.max(0, p.hp - 40); p.inv = 30; floatText(p.x + p.w / 2, p.y - 10, '따끔! -40', '#ff6b6b', 20); SFX.hurt(); }
    } });
    const tx0 = Math.floor(r.x / T), tx1 = Math.floor((r.x + r.w) / T), ty0 = Math.floor(r.y / T), ty1 = Math.floor((r.y + r.h) / T);
    for(let ty = ty0; ty <= ty1; ty++) for(let tx = tx0; tx <= tx1; tx++){
      const key = tx + ',' + ty;
      if(tileAt(tx, ty) === 'B' && !p.swing.bricks.has(key)){ p.swing.bricks.add(key); damageBrick(tx, ty, p.swing.brick); }
    }
    if(--p.swing.t <= 0) p.swing = null;
  }
}

function throwBomb(e){

function teleportMage(e){

function enemyMelee(e, dmg){

const AI = {
  spiky(e, dx){
    e.face = dx > 0 ? 1 : -1;

    e.vx *= 0.7;
    if(--e.cool <= 0){
      // hop toward the hero, but never into poison or lava
      const lx = e.x + e.w / 2 + e.face * 80;
      const safe = isSolid(tileAt(Math.floor(lx / T), Math.floor((e.y + e.h + 2) / T)));
      e.vy = -9.5; e.vx = safe ? e.face * e.def.speed : 0; e.cool = 45 + Math.random() * 40;
      beep(260, 0.08, 'square', 0.03, 120);
    }
  },
  chomper(e, dx){
    e.face = dx > 0 ? 1 : -1;
    if(e.wind > 0){ e.vx *= 0.7; if(--e.wind === 0){ throwHammer(e, 0); e.cool = 100 + Math.random() * 60; } return; }
    const dist = Math.abs(dx);
    if(dist > 280) e.vx = e.face * e.def.speed; else if(dist < 150) e.vx = -e.face * e.def.speed * 0.8; else e.vx *= 0.8;

  },
  archer(e, dx){

    else if(--e.cool <= 0) e.wind = 30;
  },
  spear(e, dx){
    if(e.atk > 0){ meleeAttack(e, 26, 10, 5, () => ({x:e.face > 0 ? e.x + e.w : e.x - 46, y:e.y + 10, w:46, h:22}), 50); return; }
    e.face = dx > 0 ? 1 : -1; if(e.cool > 0) e.cool--;
    if(Math.abs(dx) < 74 && e.cool <= 0){ e.atk = 26; e.atkHit = false; e.cool = 60; SFX.slash(); }
    else if(Math.abs(dx) > 44) e.vx = e.face * e.def.speed; else e.vx *= 0.7;
  },
  bomber(e, dx){

    if(e.wind > 0){ if(--e.wind === 0){ throwBomb(e); e.cool = 130 + Math.random() * 40; } }
    else if(--e.cool <= 0) e.wind = 28;
  },
  knight(e, dx){

    else if(Math.abs(dx) > 52) e.vx = e.face * e.def.speed; else e.vx *= 0.7;
  },
  mage(e, dx, dy){
    e.face = dx > 0 ? 1 : -1; e.vx *= 0.8;

function updateFlyer(e, dx, dy, near){
  e.t++;
  const p = player, pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  if(e.stun > 0){ e.vx *= 0.9; e.vy *= 0.9; }
  else if(!near){
    e.mode = 'hover';
    const tx = e.home + Math.sin(e.t * 0.02) * 60, ty = e.homeY + Math.sin(e.t * 0.05) * 12;
    e.vx += ((tx - e.x) * 0.03 - e.vx) * 0.1; e.vy += ((ty - e.y) * 0.03 - e.vy) * 0.1;
  } else if(e.mode === 'wind'){
    e.vx *= 0.8; e.vy *= 0.8;
    if(--e.dt <= 0){ const a = Math.atan2(pcy - (e.y + e.h / 2), pcx - (e.x + e.w / 2)); e.vx = Math.cos(a) * 7; e.vy = Math.sin(a) * 7; e.mode = 'dive'; e.dt = 50; beep(300, 0.25, 'sawtooth', 0.04, 500); }
  } else if(e.mode === 'dive'){
    if(--e.dt <= 0 || e.y > pcy + 30) { e.mode = 'rise'; e.dt = 50; }
  } else if(e.mode === 'rise'){
    e.vx *= 0.95; e.vy += (-3 - e.vy) * 0.1;
    if(--e.dt <= 0){ e.mode = 'hover'; e.cool = 90 + Math.random() * 70; }
  } else {
    e.face = dx > 0 ? 1 : -1;
    const tx = pcx + Math.sin(e.t * 0.03) * 140 - e.w / 2, ty = p.y - 150 + Math.sin(e.t * 0.08) * 14;
    e.vx += ((tx - e.x) * 0.03 - e.vx) * 0.08; e.vy += ((ty - e.y) * 0.04 - e.vy) * 0.1;
    const sp = Math.hypot(e.vx, e.vy); if(sp > 3.5){ e.vx *= 3.5 / sp; e.vy *= 3.5 / sp; }
    if(--e.cool <= 0){ e.mode = 'wind'; e.dt = 22; }
  }
  e.x += e.vx; e.y += e.vy;
  if(e.y < 30){ e.y = 30; e.vy = Math.abs(e.vy); }
  const fty = Math.floor((e.y + e.h) / T);
  if(isSolid(tileAt(Math.floor((e.x + e.w / 2) / T), fty))){
    e.y = fty * T - e.h; e.vy = Math.min(e.vy, 0);
    if(e.mode === 'dive'){ e.mode = 'rise'; e.dt = 50; }
  }
  const maxX = arena.active ? arena.right * T - e.w : arena.left * T - e.w - 4;
  e.x = Math.max(0, Math.min(maxX, e.x));
}
function showTip(d){
  toast = {text:'새 악당! ' + d.name + ' ' + '★'.repeat(d.lvl) + '  :  ' + d.tip, t:230};
}
function updateEnemy(e){
  if(e.dead) return;
  if(e.flash > 0) e.flash--;
  if(e.stun > 0) e.stun--;
  const p = player;
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2);
  if(e.boss){ updateBoss(e, dx, dy); }
  else {
    const near = Math.abs(dx) < 540 && Math.abs(dy) < 300 && Math.abs(e.x - e.home) < 700;
    if(near && !seen.has(e.type) && Math.abs(dx) < 460){ seen.add(e.type); showTip(e.def); }
    if(e.def.fly) updateFlyer(e, dx, dy, near);
    else {
      if(e.stun > 0) e.vx *= 0.85;
      else if(near) AI[e.type](e, dx, dy);
      else {
        e.atk = 0; e.wind = 0;
        e.vx = e.face * 0.8;
        if(Math.abs(e.x - e.home) > 60) e.face = e.x > e.home ? -1 : 1;
      }
      e.vy = Math.min(e.vy + 0.6, 14);
      const oldX = e.x;
      if(moveX(e) && !near) e.face *= -1;
      moveY(e);
      if(e.onGround && e.stun <= 0 && Math.abs(e.vx) > 0.05){
        const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
        if(!isSolid(tileAt(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T)))){
          e.x = oldX; e.vx = 0;
          if(!near) e.face *= -1;
        }
      }
      if(e.y > stage.rows * T + 100){ e.dead = true; }
      if(!e.dead && isLiquid(tileAt(Math.floor((e.x + e.w / 2) / T), Math.floor((e.y + e.h - 16) / T)))){
        floatText(e.x + e.w / 2, e.y - 10, '퐁당!', '#e0b0ff', 20);
        killEnemy(e); return;
      }
    }
  }
  if(!e.dead && e.active && e.mode !== 'fall' && overlap(e, p)) hurtPlayer(e.def.touch, Math.sign(dx) || 1);
}
function updateTwin(e, dx){
  const rage = e.hp < e.maxhp / 2;
  if(e.mode === 'charge'){
    e.vx = e.dir * (rage ? 7.5 : 6.5);
    if(frameN % 3 === 0) burst(e.x + e.w / 2 - e.dir * 60, e.y + e.h, ['#9aa1b2', '#ffffff'], 2, 2, 4);
    if(--e.dt <= 0 || moveX(e)){ e.mode = 'walk'; e.cool = 60; e.vx = 0; shake = Math.max(shake, 8); }
  } else {
    e.face = dx > 0 ? 1 : -1;
    const dist = Math.abs(dx); let want = 0;
    if(dist < 200) want = -e.face; else if(dist > 400) want = e.face;
    if(e.stun > 0) e.vx *= 0.85; else e.vx += (want * (rage ? 2 : 1.4) - e.vx) * 0.1;
    if(e.wind > 0){ if(--e.wind === 0) twinAttack(e, rage); }
    else if(--e.cool <= 0) e.wind = rage ? 20 : 28;
    moveX(e);
  }
  const wasAir = !e.onGround;
  e.vy = Math.min(e.vy + 0.6, 14); moveY(e);
  if(wasAir && e.onGround && e.jumped){ e.jumped = false; shake = Math.max(shake, 12); groundWave(e, 80); }
  e.x = Math.max(T + 2, Math.min((arena.right) * T - e.w - 2, e.x));
}
function twinAttack(e, rage){
  e.shots++;

function updateBoss(e, dx, dy){

  if(e.wind > 0){ if(--e.wind === 0) bossAttack(e, dx, dy, rage); }

function bossAttack(e, dx, dy, rage){
  const d = e.bdef, ang = Math.atan2(dy, dx), sp = rage ? 8 : 7;

  } else if(d.pattern === 'double'){

    else if(k === 2) arrowRain(rage ? 10 : 7);
    else if(k === 3){ if(rage){ summon(e, 'flyer'); summon(e, 'knight'); } else summon(e, 'spear'); }

function bossFly(e, dx, dy, rage){

  const lv = mathLevelFor(n), plus = Math.random() < 0.5;

  if(lv === 1){
    // 1학년 1학기: 합이 10까지인 더하기, 10까지의 수에서 빼기
    if(plus){ a = r(1, 8); b = r(1, 10 - a); } else { a = r(3, 10); b = r(1, a - 1); }
  } else if(lv === 2){
    // 10 모으기·가르기: 7+3, 10-4, 10+5, 15-5
    const k = r(0, 3);
    if(k === 0){ a = r(1, 9); b = 10 - a; }
    else if(k === 1){ a = 10; b = r(1, 9); }
    else if(k === 2){ a = 10; b = r(1, 9); }
    else { a = 10 + r(1, 9); b = a - 10; }
    if(k === 1 || k === 3){ return {a, b, op:'-', lv, ans:a - b}; }
    return {a, b, op:'+', lv, ans:a + b};
  } else if(lv === 3){
    // 1학년 2학기: 받아올림·받아내림 없는 두 자리 수 (23+4, 36-5, 30+20, 70-40)
    if(Math.random() < 0.3){
      kind = 'tens';
      if(plus){ a = r(1, 8) * 10; b = r(1, 9 - a / 10) * 10; } else { a = r(2, 9) * 10; b = r(1, a / 10 - 1) * 10; }
    } else {
      const o = r(0, 8);
      if(plus){ a = r(1, 8) * 10 + o; b = r(1, 9 - o); }
      else { a = r(1, 9) * 10 + r(1, 9); b = r(1, a % 10); }
    }
  } else {
    // 1학년 2학기: 10을 넘는 덧셈(받아올림), 십몇에서 빼는 뺄셈(받아내림)
    if(plus){ a = r(2, 9); b = r(Math.max(2, 11 - a), 9); } else { a = r(11, 18); b = r(a - 9, 9); }
  }
  const op = plus ? '+' : '-';
  return {a, b, op, lv, kind, ans:plus ? a + b : a - b};
}
// 숫자 뒤에 붙는 말: 3을, 7을, 2를, 9는 …
const hasBatchim = n => { const d = n % 10; return d === 0 ? true : [1, 3, 6, 7, 8].includes(d); };
const josa = (n, withB, without) => n + (hasBatchim(n) ? withB : without);
// 두 번 틀리면 보여 주는 도움말
function mathHint(q){
  if(q.lv === 3){
    if(q.kind === 'tens') return ['10이 몇 개인지 세어 봐요: ' + q.a / 10 + ' ' + (q.op === '+' ? '+' : '−') + ' ' + q.b / 10 + ' = ?', '답에 0을 하나 붙이면 돼요!'];
    const oa = q.a % 10, ob = q.b % 10, ta = Math.floor(q.a / 10);
    return ['일의 자리끼리: ' + oa + ' ' + (q.op === '+' ? '+' : '−') + ' ' + ob + ' = ?', '십의 자리 ' + josa(ta, '은', '는') + ' 그대로예요!'];
  }
  // 숲: 10을 먼저 만들어요
  if(q.op === '+'){ const need = 10 - q.a; return [q.a + '에 ' + josa(need, '을', '를') + ' 더하면 10!  남은 ' + josa(q.b - need, '을', '를') + ' 더 더해요']; }
  const first = q.a - 10; return [q.a + '에서 ' + josa(first, '을', '를') + ' 먼저 빼면 10!  남은 ' + josa(q.b - first, '을', '를') + ' 더 빼요'];
}
function openMath(ctxInfo){
  mathQ = Object.assign(makeProblem(stage.num), {ctx:ctxInfo, input:'', wrong:0, msg:'', okT:0, shakeT:0});
  state = 'math'; held.Left = held.Right = false; player.vx = 0;
  beep(660, 0.1, 'triangle', 0.06, 200);
}
function mathType(d){ if(!mathQ || mathQ.okT > 0) return; if(mathQ.input.length < 2) mathQ.input += d; SFX.select(); }
function mathErase(){ if(mathQ) mathQ.input = mathQ.input.slice(0, -1); }
function mathCheck(){
  const q = mathQ; if(!q || !q.input || q.okT > 0) return;
  if(+q.input === q.ans){ q.msg = '정답! 최고예요!'; q.okT = 55; SFX.coin(); setTimeout(SFX.heal, 120); }
  else {
    q.wrong++; q.input = ''; q.shakeT = 16;
    q.msg = q.wrong < 2 ? '아까워요! 다시 해 볼까?' : q.lv <= 2 ? '점을 하나씩 세어 볼까요?' : q.lv === 4 ? '10을 먼저 만들어 봐요!' : '아래 도움말을 보고 차근차근!';
    beep(200, 0.2, 'square', 0.05, -60);
  }
}
function mathClose(){
  const q = mathQ; state = 'play';
  if(q.ctx.type === 'chest') q.ctx.chest.cool = 120; else gateCool = 120;
  mathQ = null;
}
function finishMath(){
  const q = mathQ, p = player; state = 'play'; mathQ = null;
  if(q.ctx.type === 'chest'){
    const c = q.ctx.chest; c.opened = true;
    dropItem(c.x + 4, c.y - 16, c.item, -7);
    const heal = p.id === 'green' ? 300 : 150, before = p.hp;
    p.hp = Math.min(p.maxhp, p.hp + heal);
    floatText(p.x + p.w / 2, p.y - 14, '+' + (p.hp - before), '#7be07b', 22);
    burst(c.x + 16, c.y, ['#ffd447', '#ffffff'], 20, 4, 5);
    gainExp(20 + q.lv * 10);
  } else {
    gateSolved = true; gainExp(10 + q.lv * 10);
    toast = {text:'성문 자물쇠가 열렸어요! 성 안으로 들어가요', t:180};
    noise(0.4, 0.08);
  }
}

/* ---------------- hazards: skateboards, 쿵쿵 돌, 가시 공, 독/용암 폭포, 뼈 로켓 대포, 여우 버튼 ---------------- */
function setupHazards(){
  stage.boards = (stage.boardPools || []).map(([a, b]) => ({x:a * T + 4, x0:a * T + 4, x1:(b + 1) * T - 84, y:11 * T, w:80, h:12, idle:0, dir:0}));
  stage.crushers = (stage.crusherCols || []).map(col => {
    const c = {x:col * T + 4, w:72, h:64, y:30, top:30, state:'wait', t:0, vy:0};
    c.floor = groundYAt(c.x + c.w / 2, c.h); return c;
  });
  stage.spikes = (stage.spikeList || []).map(k => Object.assign({x:k.col * T, y:k.y0, r:18, ph:k.col}, k));
  stage.falls = (stage.fallList || []).map(f => Object.assign({x:(f.col + 0.5) * T, kind:stage.liquid || 'P'}, f));
  stage.cannons = (stage.cannonList || []).map(c => Object.assign({cool:90 + c.tx % 60, flash:0}, c));
  stage.button = null; stage.collapse = null;
}
const fallOn = f => (frameN + f.off) % 260 < 140;
function updateHazards(){
  const p = player, pcx = p.x + p.w / 2;
  for(const b of stage.boards || []){
    const riding = p.board === b;
    let v = 0;
    if(riding){
      b.idle = 0;
      if(!b.dir) b.dir = b.x <= (b.x0 + b.x1) / 2 ? 1 : -1;
      v = b.dir * 3;
      if(frameN % 4 === 0) parts.push({x:b.x + (b.dir > 0 ? 0 : b.w), y:b.y + 14, vx:-b.dir, vy:-0.5, life:14, color:stage.liquid === 'L' ? '#ffd447' : '#e0b0ff', size:4, grav:0});
    } else {
      b.dir = 0; b.idle++;
      if(b.idle > 180 && Math.abs(b.x - b.x0) > 1) v = Math.sign(b.x0 - b.x) * 2.5;
    }
    const nx = Math.max(b.x0, Math.min(b.x1, b.x + v)), d = nx - b.x;
    b.x = nx;
    if(riding) p.x += d;
  }
  for(const c of stage.crushers || []){
    if(c.state === 'wait'){
      if(pcx > c.x - 30 && pcx < c.x + c.w + 30 && p.y > c.y) { c.state = 'shake'; c.t = 16; }
    } else if(c.state === 'shake'){
      if(--c.t <= 0){ c.state = 'fall'; c.vy = 2; }
    } else if(c.state === 'fall'){
      c.vy = Math.min(c.vy + 0.9, 16); c.y += c.vy;
      if(overlap(c, p)) hurtPlayer(180, Math.sign(pcx - (c.x + c.w / 2)) || 1);
      if(c.y >= c.floor){
        c.y = c.floor; c.state = 'rest'; c.t = 60;
        shake = Math.max(shake, 10); noise(0.25, 0.08);
        burst(c.x + c.w / 2, c.y + c.h, ['#9aa1b2', '#c4cad6', '#5b6070'], 14, 4, 5);
      }
    } else if(c.state === 'rest'){
      if(--c.t <= 0) c.state = 'rise';
    } else if(c.state === 'rise'){
      c.y -= 2; if(c.y <= c.top){ c.y = c.top; c.state = 'wait'; }
    }
    if(c.state !== 'fall' && overlap(c, p)){
      const left = pcx < c.x + c.w / 2;
      p.x = left ? c.x - p.w - 0.1 : c.x + c.w + 0.1; p.vx = 0;
    }
  }
  for(const k of stage.spikes || []){
    k.y = k.y0 + Math.sin(frameN * k.sp + k.ph) * k.amp;
    const nx = Math.max(p.x, Math.min(k.x, p.x + p.w)), ny = Math.max(p.y, Math.min(k.y, p.y + p.h));
    if(Math.hypot(k.x - nx, k.y - ny) < k.r) hurtPlayer(110, Math.sign(pcx - k.x) || 1);
  }
  for(const f of stage.falls || []){
    if(fallOn(f) && p.x + p.w > f.x - 18 && p.x < f.x + 18 && p.y + p.h > f.y0 && p.y < f.y1){
      if(hurtPlayer(150, Math.sign(pcx - f.x) || 1)) floatText(pcx, p.y - 30, f.kind === 'L' ? '앗 뜨거워!' : '으엑, 독!', '#ffffff', 18);
    }
    if(fallOn(f) && frameN % 5 === 0) burst(f.x, f.y1 - 4, f.kind === 'L' ? ['#ff7a1a', '#ffd447'] : ['#b26bff', '#e0b0ff'], 3, 3, 4);
  }
  for(const k of stage.cannons || []){
    if(k.flash > 0) k.flash--;
    const cx = (k.tx + 0.5) * T;
    if(--k.cool <= 0 && Math.abs(pcx - cx) < 760 && (pcx - cx) * k.face > 0){
      fireRocket(k.face > 0 ? (k.tx + 1) * T + 6 : k.tx * T - 6, k.ty * T + 18, k.face, 100);
      k.cool = 170; k.flash = 12;
    } else if(k.cool < -1) k.cool = 30;
  }
  const btn = stage.button;
  if(btn){
    if(btn.nag > 0) btn.nag--;
    if(!btn.pressed && overlap(btn, p)){
      if(btn.open){
        btn.pressed = true; stage.collapse = 0;
        toast = {text:'철컥! 다리가 무너져요!', t:160};
        SFX.alarm(); beep(140, 0.6, 'sawtooth', 0.06, -60);
      } else if(btn.nag <= 0){
        btn.nag = 120; toast = {text:'아직 잠겨 있어요! 해골왕을 더 공격해서 진짜 체력을 보여 줘요', t:150}; SFX.block();
      }
    }
  }
  if(stage.collapse != null && stage.collapse < 64){
    if(stage.collapse % 4 === 0){
      const col = 20 - stage.collapse / 4;
      if(col >= 5 && stage.map[11][col] === 'R'){
        stage.map[11][col] = '.';
        burst((col + 0.5) * T, 11 * T + 10, ['#8a5530', '#5a3a20', '#ff7a1a'], 8, 3, 5);
        noise(0.12, 0.05); shake = Math.max(shake, 6);
      }
    }
    stage.collapse++;
  }
}
function liquidHit(ch){
  const p = player, lava = ch === 'L', dmg = lava ? 300 : 250;
  p.hp = Math.max(0, p.hp - dmg);
  floatText(p.x + p.w / 2, p.y - 10, '-' + dmg, '#ff6b6b', 24); SFX.hurt(); shake = Math.max(shake, 10);
  burst(p.x + p.w / 2, p.y + p.h, lava ? ['#ff7a1a', '#ffd447', '#ff3b1a'] : ['#b26bff', '#7a3fb0', '#e0b0ff'], 26, 5, 6);
  toast = {text:lava ? '앗 뜨거워! 용암에 빠지면 체력이 많이 줄어요' : '으악! 독에 빠지면 체력이 많이 줄어요', t:140};
  if(p.hp > 0){
    p.x = lastSafeX; p.y = groundYAt(p.x + p.w / 2, p.h); p.vx = 0; p.vy = 0;
    p.inv = 90; p.dash = 0; p.roll = 0; p.swing = null; p.board = null;
  }
}

/* ---------------- world update ---------------- */
function respawn(full){
  const p = player;
  const x = arena.active ? (arena.left + 2) * T : respawnX;
  p.x = x; p.y = groundYAt(x + p.w / 2, p.h); p.vx = 0; p.vy = 0;
  p.inv = 90; p.dash = 0; p.roll = 0; p.swing = null; lastSafeX = x;
  if(p.crouch){ p.crouch = false; p.h = SPR[p.id].H; p.y = groundYAt(x + p.w / 2, p.h); }
  if(full) p.hp = p.maxhp;
  state = 'play';
}
function updateCamera(){
  const p = player;
  const target = p.x + p.w / 2 - W / 2 + p.face * 70;
  cam.x += (target - cam.x) * 0.12;
  let minX = 0, maxX = stage.cols * T - W;
  if(arena.active){ minX = arena.left * T; maxX = (arena.right + 1) * T - W; }
  cam.x = Math.max(minX, Math.min(maxX, cam.x));
}
function updateWorld(){
  playFrames++;
  if(playFrames % 600 === 0) saveProfile();
  updatePlayer();
  updateSpecial(); updatePet();
  enemies.forEach(updateEnemy);
  updateHazards();
  updateShots(); updateArrows(); updatePickups(); updateParts();
  const p = player;
  {
    // remember the last firm ground so a splash in poison or lava puts you back there
    const pcx = p.x + p.w / 2, under = tileAt(Math.floor(pcx / T), Math.floor((p.y + p.h + 2) / T));
    if(p.onGround && !p.board && isSolid(under) && under !== 'R') lastSafeX = p.x;
    const lt = tileAt(Math.floor(pcx / T), Math.floor((p.y + p.h - 16) / T));
    if(isLiquid(lt) && state === 'play') liquidHit(lt);
  }
  for(const c of chests){
    if(c.cool > 0) c.cool--;
    if(!c.opened && c.cool <= 0 && overlap(c, p) && state === 'play'){ openMath({type:'chest', chest:c}); return; }
  }
  for(const c of stage.checkpoints){
    if(!c.on && p.x > c.col * T){ c.on = true; respawnX = c.col * T; floatText(c.col * T + 20, (stage.rows - 6) * T, '저장!', '#7be07b', 22); SFX.coin(); }
  }
  if(stage.gate){
    const door = (stage.gate.col + 0.5) * T, pc = p.x + p.w / 2;
    if(gateCool > 0) gateCool--;
    if(!gateSolved){
      if(pc > door - 70){ p.x = door - 70 - p.w / 2; p.vx = 0; }
      if(Math.abs(pc - door) < 3.2 * T && gateCool <= 0 && p.onGround){ openMath({type:'gate'}); return; }
    }
    doorOpen += ((gateSolved && Math.abs(pc - door) < 4 * T ? 1 : 0) - doorOpen) * 0.08;
    if(gateSolved && pc > door - 12 && p.onGround && doorOpen > 0.6){
      state = 'gate'; gateT = 100; held.Left = held.Right = false;
      noise(0.5, 0.08); beep(110, 0.6, 'sawtooth', 0.05, -40);
    }
  }
  if(bannerT > 0) bannerT--;
  updateCamera();
  if(p.y > stage.rows * T + 40){
    p.hp = Math.max(0, p.hp - 100);
    floatText(p.x + p.w / 2, (stage.rows - 4) * T, '-100', '#ff6b6b', 22); SFX.hurt();
    if(p.hp > 0) respawn(false);
  }
  if(p.hp <= 0 && state === 'play'){
    state = 'down'; downT = 90;
    burst(p.x + p.w / 2, p.y + p.h / 2, ['#ffffff', '#ffd447'], 20, 4, 5);
  }
}

/* ---------------- main update ---------------- */
function update(){
  frameN++;
  if(pressed.M){ muted = !muted; store.set('muted', muted); applyMute(); }
  if(pressed.F){ pressed.F = false; toggleFs(); }
  if(flashT > 0) flashT--;
  if(levelBanner > 0) levelBanner--;
  if(specialBanner && --specialBanner.t <= 0) specialBanner = null;
  if(state === 'math'){
    const q = mathQ;
    if(q.shakeT > 0) q.shakeT--;
    if(q.okT > 0){ if(--q.okT <= 0) finishMath(); }
    else {
      for(let d = 0; d <= 9; d++) if(pressed['N' + d]) mathType(d);
      if(pressed.Back) mathErase();
      if(pressed.Enter || pressed.Space) mathCheck();
      else if(pressed.Esc) mathClose();
    }
    updateParts();
    for(const k in pressed) pressed[k] = false;
    return;
  }
  if(state === 'continue'){
    if(pressed.Enter || pressed.Y || pressed.Space) useChance();
    else if(pressed.Esc || pressed.N) quitToTitle();
    for(const k in pressed) pressed[k] = false;
    return;
  }
  if(state === 'gameover'){
    updateParts();
    if(pressed.Enter || pressed.Space) startStage(player.id);
    else if(pressed.C) goSelect();
    else if(pressed.Esc) quitToTitle();
    for(const k in pressed) pressed[k] = false;
    return;
  }
  if(state === 'confirm'){
    if(pressed.Enter || pressed.Y) quitToTitle();
    else if(pressed.Esc || pressed.N) { state = confirmFrom; SFX.select(); }
    for(const k in pressed) pressed[k] = false;
    return;
  }
  if(pressed.Esc && state === 'ending'){ quitToTitle(); for(const k in pressed) pressed[k] = false; return; }
  if(pressed.Esc && state !== 'title' && state !== 'select' && state !== 'stages' && state !== 'profile'){
    askQuit();
    for(const k in pressed) pressed[k] = false;
    return;
  }
  if(state === 'title'){
    if(pressed.Space || pressed.Enter) goProfile();
  } else if(state === 'select'){
    if(pressed.Left){ selIdx = (selIdx + 2) % 3; SFX.select(); }
    if(pressed.Right){ selIdx = (selIdx + 1) % 3; SFX.select(); }
    if(pressed.Space || pressed.Enter) pickChar();
    if(pressed.Esc) goProfile();
  } else if(state === 'profile'){
    if(pressed.Esc) state = 'title';
  } else if(state === 'stages'){
    if(pressed.Left) moveStage(-1);
    if(pressed.Right) moveStage(1);
    if(pressed.Space || pressed.Enter) pickStage(stageIdx);
    if(pressed.Esc) state = 'select';
  } else if(state === 'rescue'){
    updateParts(); rescueT++;
    if(rescueT > 150 && rescueT % 12 === 0) burst(princessPos().x + 36, princessPos().y + 20, ['#ff7eb6', '#ffd1e6', '#ffffff'], 6, 2, 5);
    if(rescueT >= 300 || (rescueT > 160 && (pressed.Space || pressed.Enter))){ state = 'ending'; endingT = 0; rescued = true; SFX.win(); saveProfile(); }
  } else if(state === 'kidnap'){
    updateParts(); kidT++;
    if(kidT === 40) beep(110, 0.8, 'sawtooth', 0.06, -30);
    if(kidT === 90){ [330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'square', 0.05, -40), i * 160)); }
    if(kidT >= 340 || (kidT > 110 && (pressed.Space || pressed.Enter))){ state = 'clear'; kidnapped = true; }
  } else if(state === 'ending'){
    endingT++; updateParts();
    if(endingT % 22 === 0) burst(120 + Math.random() * (W - 240), 60 + Math.random() * 180, [['#ffd447', '#ff7eb6'], ['#7fc8ff', '#ffffff'], ['#7be07b', '#ffd447'], ['#ff6b6b', '#ffd1e6']][Math.floor(Math.random() * 4)], 26, 5, 5);
    if(endingT > 60 && (pressed.Space || pressed.Enter)) quitToTitle();
    else if(endingT > 60 && pressed.C) goSelect();
  } else if(state === 'intro'){
    updateCamera(); updateParts();
    if(--introT <= 0 || pressed.Space || pressed.Enter) state = 'play';
  } else if(state === 'play'){
    if(pressed.P) state = 'pause';
    else updateWorld();
  } else if(state === 'pause'){
    if(pressed.P || pressed.Enter) state = 'play';
  } else if(state === 'gate'){
    updateParts();
    if(gateT > 50){ player.x += 1.2; player.vx = 0; }
    if(--gateT === 50) enterBossRoom();
    if(gateT <= 0){ state = 'play'; bannerT = 150; SFX.alarm(); }
  } else if(state === 'down'){
    updateParts();
    if(--downT <= 0){ state = lives > 0 ? 'continue' : 'gameover'; if(state === 'gameover') SFX.hurt(); }
  } else if(state === 'clearing'){
    updateParts(); updateCamera();
    if(frameN % 8 === 0) burst(cam.x + 200 + Math.random() * 560, 80 + Math.random() * 200, ['#ffd447', '#ff7eb6', '#7be07b', '#7fc8ff'], 12, 4, 5);
    if(--clearT <= 0){
      if(stage.num === 6){ state = 'rescue'; rescueT = 0; beep(880, 0.3, 'triangle', 0.07, 400); }
      else if(stage.num === 4){ state = 'kidnap'; kidT = 0; }
      else state = 'clear';
    }
  } else if(state === 'clear'){
    updateParts();
    if(pressed.Space) startStage(player.id, stage.num + 1);
    else if(pressed.Enter) startStage(player.id, stage.num);
    else if(pressed.C) goSelect();
  }
  for(const k in pressed) pressed[k] = false;
}

/* ---------------- drawing helpers ---------------- */
function text(str, x, y, size, color, align, stroke, lw){
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if(stroke !== null){ ctx.lineJoin = 'round'; ctx.strokeStyle = stroke || '#141a33'; ctx.lineWidth = lw || Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color || '#ffffff'; ctx.fillText(str, x, y);
}
function rrect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function button(label, x, y, w, h, act, primary){

      spike(x, y + o, x - 10, y + o + 5, x, y + o + 10);
      spike(x + S, y + o, x + S + 10, y + o + 5, x + S, y + o + 10);
    }
    drawSpr(sp, x, y, opts);
  } else if(e.type === 'chomper'){
    const bob = Math.abs(e.vx) > 0.3 ? (Math.floor(frameN / 7) % 2) * 2 : 0;
    const nx = f > 0 ? e.x + e.w + 2 : e.x - 2, ny = e.y + 14 - bob;
    ctx.fillStyle = '#5b6070'; ctx.beginPath(); ctx.moveTo(nx, ny - 8); ctx.lineTo(nx + f * 18, ny); ctx.lineTo(nx, ny + 8); ctx.closePath(); ctx.fill();
    drawSpr(sp, e.x - e.ox, e.y - bob, opts);
    if(e.wind > 0){ drawHammer(cx - f * 10, e.y - 16, -f * (1 - e.wind / 26) * 1.2, 0.9); text('!', cx, e.y - 46, 22, '#ff4d4d'); }
  } else if(e.type === 'mage'){
    const fl = Math.sin(frameN * 0.06 + e.home) * 2;
    drawSpr(sp, e.x - e.ox, e.y + fl, opts);
    const sx = cx + f * 26, top = e.y - 6 + fl;
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(sx - 2, top, 4, e.h + 6);
    const glow = e.wind > 0 ? (1 - e.wind / 40) * 10 : 0;
    ctx.fillStyle = 'rgba(125,255,122,0.35)'; ctx.beginPath(); ctx.arc(sx, top, 9 + glow, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7dff7a'; ctx.beginPath(); ctx.arc(sx, top, 6, 0, Math.PI * 2); ctx.fill();
    if(e.wind > 0) text('!', cx, e.y - 46, 22, '#ff4d4d');
  }
  drawLabel(e, e.y - 14);
}
function drawArrow(a){
  ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(Math.atan2(a.vy, a.vx));
  ctx.fillStyle = '#7a5230'; ctx.fillRect(-20, -1.5, 32, 3);
  ctx.fillStyle = '#d8dde8'; ctx.beginPath(); ctx.moveTo(10, -5); ctx.lineTo(20, 0); ctx.lineTo(10, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e0303a'; ctx.fillRect(-22, -5, 6, 3); ctx.fillRect(-22, 2, 6, 3);
  ctx.restore();
}
function drawShot(s){
  if(s.kind === 'bullet'){
    ctx.fillStyle = 'rgba(255,224,102,0.35)'; ctx.fillRect(s.x - 10, s.y - 5, 20, 10);
    ctx.fillStyle = '#ffe066'; ctx.fillRect(s.x - 7, s.y - 2, 14, 4);
  } else if(s.kind === 'heart'){
    drawHeart(s.x, s.y, 1.1, '#ff7eb6');
  } else if(s.kind === 'spear'){
    const f = Math.sign(s.vx) || 1;
    ctx.fillStyle = '#8b6b3e'; ctx.fillRect(f > 0 ? s.x - 46 : s.x + 6, s.y - 2, 40, 5);
    ctx.fillStyle = '#d8dde8'; ctx.beginPath(); ctx.moveTo(s.x + f * 6, s.y - 7); ctx.lineTo(s.x + f * 24, s.y + 0.5); ctx.lineTo(s.x + f * 6, s.y + 8); ctx.closePath(); ctx.fill();
  } else if(s.kind === 'rorb'){
    drawOrb(s.x, s.y, 'blue');
  } else if(s.kind === 'reflect'){
    if(s.look === 'rocket') drawRocket(s.x, s.y, Math.sign(s.vx) || 1);
    else if(s.look === 'hammer') drawHammer(s.x, s.y, frameN * 0.35, 1);
    else if(s.look === 'fist') drawFist(s.x, s.y);
    else drawArrow(s);
    ctx.fillStyle = 'rgba(160,200,255,0.5)'; ctx.fillRect(s.x - 12, s.y - 6, 24, 12);
  }
}

    button('처음 화면으로 (스페이스)', W / 2 - 250, 486, 240, 44, quitToTitle, true);

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  while(acc >= 1000 / 60){ update(); acc -= 1000 / 60; }
  syncProfileOverlay();
  syncTouch(); syncFs();
  draw();
  requestAnimationFrame(frame);
}
updateLabels(ORDER[selIdx]);
requestAnimationFrame(frame);
