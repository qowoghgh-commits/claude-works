<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>최강 영단어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered column on ruled notebook paper. Blue ink = actions and sound, wooden letter tiles = spelling, red pen = mistakes, amber stars = wins */
:root{
  --paper:#fbf7ec; --paper2:#f3ecdc; --card:#ffffff; --card2:#f7f2e6;
  --rule:#d5e1f2; --margin:#f0a6a6; --line:#ddd4c2;
  --ink:#1e2a48; --muted:#6c6a72;
  --blue:#2e6bd6; --blue-deep:#1d4aa0; --blue-soft:#e6eefc;
  --tile:#f3d79c; --tile-deep:#c49550; --tile-ink:#3b2a10;
  --star:#f5a524; --red:#e04848; --red-soft:#fdeaea; --green:#1f9d60; --green-soft:#e3f6ec;
  --team-a:#e04848; --team-b:#2e6bd6; --on-color:#ffffff;
  --f-display:'Fredoka','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-en:'Andika','Trebuchet MS','Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%;
  background-image:linear-gradient(90deg,transparent 0,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
    repeating-linear-gradient(180deg,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.wide,.top-in.wide{max-width:1100px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.note{color:var(--muted);font-size:15px;margin:0}
.center{text-align:center}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.en{font-family:var(--f-en)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 0 var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:14px;border:2px solid transparent;font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1;transition:transform .08s;white-space:nowrap}
.btn svg{width:22px;height:22px}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.gold{background:var(--blue);color:var(--on-color);box-shadow:0 4px 0 var(--blue-deep)}
.btn.pink{background:var(--red);color:var(--on-color);box-shadow:0 4px 0 #a92f2f}
.btn.cyan{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:17px;padding:0 14px}
.btn.big{min-height:64px;font-size:23px;width:100%}
.btn.danger{color:var(--red)}
.icon-btn{width:48px;height:48px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);font-size:18px}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.3}
.link{background:none;border:none;color:var(--blue);text-decoration:underline;font-size:16px;padding:12px;align-self:center}
.foot-links{display:flex;justify-content:center;gap:8px}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px 4px;text-align:center}
.mark{display:flex;align-items:center;gap:10px}
.mark h1{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,12vw,74px);margin:0;line-height:1;color:var(--ink)}
.mark .gold{color:var(--blue)}
.bolt svg{width:clamp(38px,9vw,56px);height:auto;display:block}
.hero-tiles{display:flex;gap:6px}
.hero-tiles span{position:relative;width:46px;height:50px;border-radius:8px;background:var(--tile);color:var(--tile-ink);font-family:var(--f-en);font-weight:700;font-size:28px;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 3px 0 var(--tile-deep)}
.hero-tiles span sub{position:absolute;right:5px;bottom:3px;font-size:11px;line-height:1}
.hero-tiles span:nth-child(odd){transform:rotate(3deg)}
.hero-tiles span:nth-child(even){transform:rotate(-3deg)}
.tag{color:var(--muted);margin:0;font-size:17px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--green)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:46vh;overflow-y:auto;padding:4px}
.name{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:19px;font-weight:700}
.name.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}

/* student home */
.live-card{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--blue)}
.live-card>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.tree{flex-direction:row;align-items:flex-start;gap:18px}
.tree-pic{font-size:68px;line-height:1;width:100px;height:100px;display:grid;place-items:center;background:var(--green-soft);border-radius:18px;flex:none}
.tree-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.tree-name{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1}
.bar{height:14px;border-radius:99px;background:var(--paper2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.bar.thin{height:10px;flex:1}
.tree-sub{font-size:15px;color:var(--muted)}
.tree-sub b{color:var(--ink)}
.stages summary{cursor:pointer;color:var(--blue);font-size:15px}
.stages ol{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.stages li{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);padding:6px 8px;border-radius:10px;background:var(--card2);opacity:.6}
.stages li.got{color:var(--ink);opacity:1}
.stages li span{font-size:20px}
.stages li em{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.basket{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--margin)}
.basket>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.basket-n{font-family:var(--f-display);font-weight:600;font-size:22px}
.basket-n b{color:var(--red)}
.units{display:flex;flex-direction:column;gap:12px}
.unit-card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;width:100%;box-shadow:0 3px 0 var(--line)}
.unit-card:hover{border-color:var(--blue)}
.uc-emo{font-size:28px;letter-spacing:2px;flex:none}
.uc-main{flex:1;min-width:0}
.uc-no{font-size:13px;color:var(--red);letter-spacing:.08em;font-weight:700}
.uc-title{font-family:var(--f-en);font-weight:700;font-size:21px;line-height:1.25}
.uc-meta{font-size:14px;color:var(--muted)}
.stars{font-size:22px;letter-spacing:2px;color:var(--line);flex:none;white-space:nowrap}
.stars .on{color:var(--star)}
.stars.big{font-size:36px}
.empty{color:var(--muted);text-align:center;padding:24px;background:var(--card);border-radius:14px;border:2px dashed var(--line);margin:0}

/* unit */
.unit-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:4px}
.unit-title{font-family:var(--f-en);font-size:clamp(28px,7vw,40px);margin:0;line-height:1.15;text-wrap:balance;color:var(--blue-deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-family:var(--f-en);font-size:17px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;flex-wrap:wrap}
.step-n{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--blue);flex:none;border:2px solid var(--blue)}
.step.done .step-n{background:var(--blue);color:var(--on-color)}
.step-main{flex:1;min-width:180px}
.step-title{font-family:var(--f-display);font-weight:600;font-size:22px;display:flex;align-items:center;gap:8px}
.chk{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:1px 8px;transform:rotate(-4deg)}
.step-desc{font-size:15px;color:var(--muted)}
.step-btns{display:flex;gap:8px;flex-wrap:wrap}

/* learn + quiz: word card like a flash card */
.qtop{display:flex;align-items:center;gap:12px}
.count{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lcard,.qcard{background:var(--card);border:2px solid var(--line);border-top:10px solid var(--blue);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;box-shadow:0 4px 0 var(--line)}
.l-emo{font-size:96px;line-height:1}
.l-word{font-size:clamp(40px,10vw,62px);font-weight:700;line-height:1.1;color:var(--blue-deep);overflow-wrap:anywhere}
.l-mean{font-size:22px}
.l-sent{font-size:clamp(26px,6vw,36px);font-weight:700;line-height:1.5;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px}
.tok{background:none;border:none;border-bottom:3px dotted var(--blue);padding:0 2px;color:var(--blue-deep);font:inherit}
.say-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.speak-box{display:flex;flex-direction:column;align-items:center;gap:6px}
.sr-out{min-height:24px;font-size:16px;color:var(--muted)}
.sr-out.ok{color:var(--green)}
.sr-out.no{color:var(--red)}
.nav2{display:flex;gap:12px}
.nav2 .btn{flex:1}
.ask{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--blue)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:8px}
.p-emo{font-size:80px;line-height:1}
.p-mean{font-size:24px;font-weight:700}
.p-sent{font-size:clamp(24px,6vw,32px);font-weight:700;line-height:1.6}
.speaker{width:132px;height:132px;border-radius:50%;border:3px solid var(--blue);background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:16px;box-shadow:0 4px 0 var(--blue-deep)}
.speaker:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-deep)}
.speaker svg{width:48px;height:48px}
.hint{background:none;border:2px dashed var(--line);border-radius:99px;color:var(--muted);font-size:15px;min-height:44px;padding:0 18px}
.hint:hover{color:var(--ink);border-color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 24px}
.wgroup{display:flex;gap:6px}
.slot{width:46px;height:56px;border-radius:6px;border:none;border-bottom:4px solid var(--ink);background:transparent;font-family:var(--f-en);font-size:32px;font-weight:700;color:var(--blue-deep);padding:0}
.slot.full{border-bottom-color:var(--blue)}
.slots.ok .slot{border-bottom-color:var(--green);color:var(--green)}
.slots.no .slot{border-bottom-color:var(--red);color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:60px}
.tile{position:relative;width:56px;height:60px;border-radius:8px;border:none;background:var(--tile);color:var(--tile-ink);font-family:var(--f-en);font-size:30px;font-weight:700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 4px 0 var(--tile-deep);padding:0}
.tile sub{position:absolute;right:6px;bottom:4px;font-size:12px;line-height:1;font-weight:700}
.tile:active,.wtile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--tile-deep)}
.line{min-height:76px;width:100%;border-radius:12px;border:2px dashed var(--line);background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;justify-content:center}
.line .ph{color:var(--muted);font-size:15px}
.line.ok{border-color:var(--green);border-style:solid}
.line.no{border-color:var(--red);border-style:solid}
.wtile{min-height:54px;padding:0 16px;border-radius:8px;border:none;background:var(--tile);color:var(--tile-ink);font-family:var(--f-en);font-size:24px;font-weight:700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 4px 0 var(--tile-deep)}
.wtile.placed{background:var(--card);color:var(--blue-deep);border:2px solid var(--blue);box-shadow:none}
.reset{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:15px;min-height:40px}
.pattern{font-size:38px;font-weight:700;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;color:var(--blue-deep)}
.pblank{color:var(--red)}
.pgap{width:20px}
.typeform{display:flex;gap:10px;width:100%;max-width:500px}
.typeform input{flex:1;min-width:0;min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-size:28px;padding:0 16px;font-weight:700;text-align:center;color:var(--blue-deep)}
.typeform input:focus{border-color:var(--blue);outline:none}
.typeform input:disabled{opacity:.6}
.typeform input::placeholder{font-family:var(--f-body);font-size:19px;font-weight:400;color:var(--muted)}
.codeform input{letter-spacing:.3em;font-variant-numeric:tabular-nums}
.near{color:var(--red);font-weight:700;margin:0}
.sblank{display:inline-block;border-bottom:4px solid var(--red);margin:0 4px;height:1.05em;vertical-align:-.1em}
#fb{width:100%}
#fb:empty{display:none}
.fb{width:100%;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;animation:pop .25s ease-out}
.fb.ok{background:var(--green-soft);border:2px solid var(--green)}
.fb.no{background:var(--red-soft);border:2px solid var(--red)}
.fb-head{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1}
.fb.ok .fb-head{color:var(--green)}
.fb.no .fb-head{color:var(--red)}
.fb-ans{font-size:26px;font-weight:700}
.fb-ans .lab{font-size:14px;color:var(--muted);font-family:var(--f-body);margin-right:8px;font-weight:400}
.fb-msg{font-size:15px;color:var(--muted)}
.fb-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

/* result */
.result{align-items:center;text-align:center}
.r-big{font-family:var(--f-display);font-weight:700;font-size:58px;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.r-sub{font-size:19px}
.r-star{font-size:22px;color:var(--star);font-weight:700}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wlist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--card2);flex-wrap:wrap}
.wlist .en{font-weight:700;font-size:20px;color:var(--blue-deep)}
.wlist .m{color:var(--muted);flex:1;min-width:120px}

/* teacher */
.tabs{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.tab{flex:1;min-height:48px;border-radius:10px;border:none;background:none;font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--muted);white-space:nowrap;padding:0 12px}
.tab.on{background:var(--blue);color:var(--on-color)}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.t-ord{display:flex;flex-direction:column;gap:4px}
.t-ord .icon-btn{width:40px;height:34px;font-size:16px;border-radius:8px}
.t-main{flex:1;min-width:160px}
.t-title{font-family:var(--f-en);font-weight:700;font-size:19px}
.t-meta{font-size:14px;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 6px;border-radius:99px;border:2px solid var(--line);background:var(--card2);font-size:15px;font-weight:700;color:var(--muted)}
.switch span{width:38px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch span::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:left .15s}
.switch.on{border-color:var(--green);color:var(--green)}
.switch.on span{background:var(--green)}
.switch.on span::after{left:18px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700}
.fld em{font-style:normal;font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.fld select{appearance:auto;border-radius:10px;border:2px solid var(--line);background:var(--card);padding:0 12px;font-size:18px;min-height:52px;font-weight:700}
.fld input,.fld textarea{border-radius:10px;border:2px solid var(--line);background:var(--card);padding:12px;font-size:17px;min-height:52px;font-weight:400}
.fld textarea{font-family:var(--f-en);line-height:1.6;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);outline:none}
.rs-sum{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;color:var(--muted)}
.rs-sum b{color:var(--ink)}
.rs-btns{display:flex;flex-wrap:wrap;gap:8px}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg{min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px}
.seg.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.err{color:var(--red);font-weight:700;margin:0}
.okmsg{color:var(--green);font-weight:700;margin:0}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--card2);font-weight:700;color:var(--muted)}
td .stars{font-size:16px}
.rank{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}

let MODE = 'local';          // local | loading | online | error
let F = null, UID = null, ERRMSG = '', CLASS_EXISTS = false;
const KEY = 'choigang-v1';
function blankStu(){ return {units:{},basket:{},mastered:{},wrongs:{},last:0,rev:0}; }
function fresh(){ return {v:1, pin:'1234', roster:EXAMPLE_ROSTER.slice(), rosterExample:true, units:[JSON.parse(JSON.stringify(SAMPLE))], students:{}}; }
function loadLocal(){ try{ const t=localStorage.getItem(KEY); if(t){ const d=JSON.parse(t); if(d&&d.units) return d; } }catch(e){} return null; }
function saveLocal(){ if(MODE!=='local') return; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
let DB = loadLocal() || fresh();
let PREF = {sound:true};
try{ const p=JSON.parse(localStorage.getItem('choigang-pref')||'null'); if(p) PREF=Object.assign(PREF,p); if(DB.sound===false) PREF.sound=false; }catch(e){}
function savePref(){ try{ localStorage.setItem('choigang-pref', JSON.stringify(PREF)); }catch(e){} }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }

const pendingStu = {};
function saveStudent(name){
  if(MODE!=='online'){ saveLocal(); return; }
  const s=DB.students[name]; if(!s) return;
  s.rev=(s.rev||0)+1;
  clearTimeout(pendingStu[name]); pendingStu[name]=setTimeout(()=>pushStudent(name),1200);
}
function pushStudent(name){
  clearTimeout(pendingStu[name]); delete pendingStu[name];
  const s=DB.students[name]; if(!s||MODE!=='online') return Promise.resolve();
  return F.setDoc(F.doc(F.db,'cgStudents',name), s).catch(netErr);
}
function flushStudents(){ Object.keys(pendingStu).forEach(pushStudent); }
window.addEventListener('pagehide', flushStudents);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushStudents(); });
function saveClass(){
  if(MODE!=='online'){ saveLocal(); return Promise.resolve(true); }
  return F.setDoc(F.doc(F.db,'cgClass','main'), {roster:DB.roster, units:DB.units, updated:Date.now()}).then(()=>{ CLASS_EXISTS=true; return true; }).catch(e=>{ netErr(e); return false; });
}
function netErr(e){
  console.warn(e);
  if(e&&e.code==='permission-denied'&&(VIEW==='teacher'||VIEW==='host')){
    lsSet('cg-teacher',null); toast('선생님 확인이 풀렸어요. 비밀번호를 다시 써 주세요.'); T.pinErr=''; go('pin'); return;

async function initOnline(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey){ MODE='local'; return; }
  MODE='loading'; render();
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [appM, fsM, auM] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js'), import(base+'firebase-auth.js')]);
    const app=appM.initializeApp(cfg);
    const db=fsM.getFirestore(app), auth=auM.getAuth(app);
    F=Object.assign({db}, fsM);
    await auM.signInAnonymously(auth); UID=auth.currentUser.uid;
    DB={roster:[], units:[], rosterExample:false, students:{}};
    await new Promise(res=>{
      let first=true;
      F.onSnapshot(F.doc(db,'cgClass','main'), snap=>{
        if(snap.exists()){ const d=snap.data(); DB.roster=d.roster||[]; DB.units=d.units||[]; DB.rosterExample=false; CLASS_EXISTS=true; }
        else if(first){ DB.roster=EXAMPLE_ROSTER.slice(); DB.units=[JSON.parse(JSON.stringify(SAMPLE))]; DB.rosterExample=true; CLASS_EXISTS=false; }
        if(first){ first=false; MODE='online'; res(); } else onClassChange();
      }, err=>{ if(first){ first=false; ERRMSG=String(err.message||err); MODE='error'; res(); } });
    });
  }catch(e){ console.warn(e); ERRMSG=String(e&&e.message||e); MODE='error'; }
}
function onClassChange(){
  if(['home','me','unit','join'].includes(VIEW)) render();
  else if(VIEW==='teacher'&&!T.edit&&T.tab!=='roster'&&T.tab!=='live') render();
}

let UNSUB_ME=null, UNSUB_ALL=null;
function enterStudent(name){
  ME=name;
  if(MODE!=='online'){ stu(name); saveLocal(); go('me'); return; }
  if(UNSUB_ME) UNSUB_ME();
  let first=true; ENTERING=true; render();
  UNSUB_ME=F.onSnapshot(F.doc(F.db,'cgStudents',name), snap=>{
    if(pendingStu[name]) return;
    const remote=snap.exists()?snap.data():null, local=DB.students[name];
    if(!remote){ if(first||!local||local.rev) DB.students[name]=blankStu(); }
    else if(!local||(remote.rev||0)>=(local.rev||0)) DB.students[name]=Object.assign(blankStu(),remote);
    if(first){ first=false; ENTERING=false; if(ME===name) go('me'); }
    else if(ME===name&&(VIEW==='me'||VIEW==='unit')) render();
  }, err=>{ ENTERING=false; netErr(err); render(); });
}
function leaveStudent(){ flushStudents(); if(UNSUB_ME){ UNSUB_ME(); UNSUB_ME=null; } ME=null; }
function watchStudents(){
  if(MODE!=='online'||UNSUB_ALL) return;
  UNSUB_ALL=F.onSnapshot(F.collection(F.db,'cgStudents'), qs=>{
    const m={}; qs.forEach(d=>m[d.id]=Object.assign(blankStu(),d.data())); DB.students=m;
    if(VIEW==='teacher'&&!T.edit&&(T.tab==='records'||T.tab==='settings')) render();
  }, netErr);
}
function unwatchStudents(){ if(UNSUB_ALL){ UNSUB_ALL(); UNSUB_ALL=null; } }

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function tokens(s){ return s.split(/\s+/).filter(Boolean); }
function stripP(t){ return t.replace(/[.,!?]/g,''); }
function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim(); }
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function unitById(id){ return DB.units.find(u=>u.id===id); }
function stu(name){ if(!DB.students[name]) DB.students[name]=blankStu(); return DB.students[name]; }
function uprog(name,uid){ const s=stu(name); return s.units[uid]||(s.units[uid]={learn:false,prac:false,wblank:false,wfull:false,best:-1,tries:0,last:0}); }
function stars(p){ return (p.learn?1:0)+((p.prac&&(p.wblank||p.wfull))?1:0)+(p.best>=8?1:0); }
function starStr(k){ let h=''; for(let i=0;i<3;i++) h+=`<span class="${i<k?'on':''}">★</span>`; return h; }
function starText(k){ return '★'.repeat(k)+'☆'.repeat(3-k); }
function itemsOf(u){ return [...u.words.map(d=>({kind:'w',uid:u.id,d,key:u.id+'|w|'+d.w})), ...u.sents.map(d=>({kind:'s',uid:u.id,d,key:u.id+'|s|'+d.s}))]; }
function findItem(key){ const p=key.split('|'); const u=unitById(p[0]); if(!u) return null; return itemsOf(u).find(it=>it.key===key)||null; }
function textOf(it){ return it.kind==='w'?it.d.w:it.d.s; }
function masteredN(name){ return Object.keys(stu(name).mastered).length; }
function stageOf(n){ return Math.min(TREE.length-1, Math.floor(n/STEP)); }
function basketItems(name){ const s=DB.students[name]; if(!s) return []; const out=[]; for(const k of Object.keys(s.basket)){ const it=findItem(k); if(it) out.push(it); } return out; }
function blankCand(s){ return tokens(s).map((t,i)=>({t,i})).filter(x=>/^[A-Za-z]{2,}$/.test(stripP(x.t))).map(x=>x.i); }
function autoEmoji(w){ return EMO[w.toLowerCase()] || EMO[w.toLowerCase().split(' ').pop()] || '🔤'; }
function fmtDate(t){ if(!t) return '-'; const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate(); }
function num(n){ return Number(n||0).toLocaleString('ko-KR'); }

let VOICE=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices();
  VOICE = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Microsoft|Aria|Jenny/i.test(v.name)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
if(TTS){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(text,slow){ if(!TTS||!text) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=slow?0.6:0.9; speechSynthesis.speak(u); }catch(e){} }
let AC=null;
function ensureAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } }
function tone(f,t0,d,type,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; const t=AC.currentTime+t0;
  g.gain.setValueAtTime(v||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.05); }
function fx(k){ if(!PREF.sound||!AC) return; try{
  if(k==='good'){ tone(660,0,.12); tone(990,.1,.2); }
  else if(k==='bad'){ tone(240,0,.28,'triangle',.12); }
  else if(k==='near'||k==='sent'){ tone(520,0,.1,'triangle',.1); }
  else if(k==='star'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.22)); }
 }catch(e){} }

let REC=null;
function speakTry(target){
  const out=document.getElementById('srOut'); if(!SR||!out) return;
  try{ speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
  try{ if(REC) REC.abort(); }catch(e){}
  try{
    const r=new SR(); REC=r; r.lang='en-US'; r.interimResults=false; r.maxAlternatives=4;
    out.className='sr-out'; out.textContent='듣고 있어요. 말해 보세요!';
    r.onresult=e=>{ const alts=[...e.results[0]].map(a=>a.transcript), t=norm(target);
      const best=alts.map(norm).sort((a,b)=>lev(a,t)-lev(b,t))[0]||'';
      const ok=best===t||lev(best,t)<=Math.max(1,Math.floor(t.length*0.2));
      out.className='sr-out '+(ok?'ok':'no');
      out.innerHTML=ok?`잘했어요! <b>${esc(alts[0])}</b>(이)라고 들렸어요.`:`<b>${esc(alts[0])}</b>(이)라고 들렸어요. 한 번 더 해 봐요.`;
      fx(ok?'good':'near'); };
    r.onerror=e=>{ out.className='sr-out';
      out.textContent = (e.error==='not-allowed'||e.error==='service-not-allowed') ? '마이크를 쓸 수 없어요. 브라우저에서 마이크를 허용해 주세요.'
        : e.error==='no-speech' ? '소리가 들리지 않았어요. 다시 눌러서 말해 봐요.' : '다시 눌러서 말해 봐요.'; };
    r.start();
  }catch(e){ out.textContent='이 기기에서는 따라 말하기를 쓸 수 없어요.'; }
}

const TYPES = {
  prac:{w:['spell'], s:['order']},
  wblank:{w:['blank'], s:['sblank']},
  wfull:{w:['type'], s:['kor']},
  chal:{w:['spell','blank','type'], s:['order','sblank','kor']},
  basket:{w:['spell','blank','type'], s:['order','sblank','kor']}
};
const MODE_NAME = {prac:'연습', wblank:'쓰기 · 빈칸', wfull:'쓰기 · 통째로', chal:'도전', basket:'오답 바구니', live:'다 같이 하기'};
const ASK = {
  spell:'잘 듣고 철자 블록을 찾아 단어를 완성해요 (필요 없는 글자도 섞여 있어요)',
  blank:'잘 듣고 빈칸을 채워 단어 전체를 써요',
  type:'잘 듣고 단어를 써요',
  order:'잘 듣고 낱말 블록을 순서대로 놓아요',
  kor:'잘 듣고 문장을 만들어요 (필요 없는 블록도 섞여 있어요)',
  sblank:'잘 듣고 빈칸에 들어갈 낱말을 써요'
};
function pickType(mode,it,n,avoid){
  let list=TYPES[mode][it.kind].slice();
  if(it.kind==='s'){ if(!blankCand(it.d.s).length) list=list.filter(t=>t!=='sblank'); if(tokens(it.d.s).length<2) list=list.filter(t=>t!=='order'&&t!=='kor'); }
  if(!list.length) list=[it.kind==='w'?'type':(blankCand(it.d.s).length?'sblank':'order')];
  if(avoid&&list.length>1) list=list.filter(t=>t!==avoid);
  if(mode==='prac'&&n!=null) return list[n%list.length];
  return list[Math.floor(Math.random()*list.length)];
}
function startQuiz(mode,uid){
  let items;
  if(mode==='basket'){ items=sample(basketItems(ME),10); if(!items.length){ go('me'); return; } }
  else{
    items=itemsOf(unitById(uid));
    if(mode==='chal'){ const w=items.filter(i=>i.kind==='w'), s=items.filter(i=>i.kind==='s'); const ns=Math.min(3,s.length); items=shuffle([...sample(w,Math.min(10-ns,w.length)),...sample(s,ns)]); }
    else items=shuffle(items);
  }
  let wn=0, sn=0;
  const queue=items.map(it=>({it, type:pickType(mode,it,it.kind==='w'?wn++:sn++), tries:0}));
  Q={mode,uid,queue,total:queue.length,done:0,right:0,wrong:[],cur:null};
  nextQ();
}
/* 글자 타일 점수 (스크래블) */
const PTS={a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,k:5,l:1,m:3,n:1,o:1,p:3,q:10,r:1,s:1,t:1,u:1,v:4,w:4,x:8,y:4,z:10};
/* 철자 블록에 섞을 가짜 글자: 헷갈리기 쉬운 글자 위주 (짧은 단어 2개, 보통 3개, 긴 단어 4개) */
const LOOKALIKE={a:'eo',e:'ai',i:'ey',o:'au',u:'oa',b:'dp',d:'bt',p:'bq',q:'pg',m:'nw',n:'mh',c:'ks',k:'cg',s:'cz',t:'df',f:'vt',v:'fw',w:'vm',g:'jq',j:'g',l:'ri',r:'ln',h:'nk',y:'ij',x:'zs',z:'sx'};
function decoys(letters){
  const w=letters.toLowerCase(), n=w.length<=4?2:w.length<=8?3:4, cand=[];
  for(const ch of w) for(const s of (LOOKALIKE[ch]||'')) cand.push(s);
  const out=sample(cand,n);
  while(out.length<n) out.push('abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)]);
  return out;
}
function korExtras(it){
  const u=unitById(it.uid); if(!u) return [];
  const have=new Set(tokens(it.d.s).map(norm)), extra=[];
  u.sents.filter(x=>x.s!==it.d.s).forEach(x=>tokens(x.s).forEach(t=>{ if(!have.has(norm(t))&&!extra.some(e=>norm(e)===norm(t))) extra.push(t); }));
  return sample(extra,2);
}
function buildState(c){
  const it=c.it, d=it.d, st={};
  if(c.type==='spell'){
    st.chars=[...d.w]; st.letters=d.w.replace(/\s+/g,'');
    st.tiles=[...st.letters].map((ch,i)=>({ch,id:i}));
    (c.dec||decoys(st.letters)).forEach(ch=>st.tiles.push({ch,id:st.tiles.length}));
    st.order=shuffle(st.tiles.map(t=>t.id)); st.slots=new Array(st.letters.length).fill(null);
  } else if(c.type==='blank'){
    const w=d.w, idx=[]; for(let i=1;i<w.length;i++) if(/[a-z]/i.test(w[i])&&w[i-1]!==' ') idx.push(i);
    const hide=new Set(sample(idx,Math.max(1,Math.ceil(idx.length*0.5))));
    st.pattern=[...w].map((ch,i)=>ch===' '?'<span class="pgap"></span>':hide.has(i)?'<span class="pblank">_</span>':`<span>${esc(ch)}</span>`).join('');
  } else if(c.type==='order'||c.type==='kor'){
    st.target=tokens(d.s); st.need=st.target.length;
    const pool=st.target.concat(c.type==='kor'?(c.extra||korExtras(it)):[]);
    st.pool=pool; let ord;
    for(let k=0;k<6;k++){ ord=shuffle(pool.map((_,i)=>i)); if(pool.length<2||ord.slice(0,st.need).map(i=>pool[i]).join(' ')!==st.target.join(' ')) break; }
    st.order=ord; st.placed=[];
  } else if(c.type==='sblank'){
    const toks=tokens(d.s), cand=blankCand(d.s), pick=cand[Math.floor(Math.random()*cand.length)];
    st.word=stripP(toks[pick]);
    st.shown=toks.map((t,i)=>i===pick?`<span class="sblank" style="width:${Math.max(2.2,st.word.length*0.62)}em"></span>${esc(t.slice(st.word.length))}`:esc(t)).join(' ');
  }
  return st;
}
function nextQ(){
  if(!Q.queue.length){ finishQuiz(); return; }
  const c=Q.queue.shift(); c.state=buildState(c);
  Q.cur=c; Q.answered=false; Q.near=false; Q.typed=''; Q.msg=''; Q.spoke=false; Q.hint=false;
  go('quiz');
}
function bigSpeaker(t){ return `<div class="say-row" style="align-items:center"><button class="speaker" data-act="say" data-arg="${esc(t)}">${ICON.spk}<span>다시 듣기</span></button><button class="btn ghost sm" data-act="sayslow" data-arg="${esc(t)}">천천히</button></div>`; }
function listenPrompt(c){ const d=c.it.d, t=textOf(c.it), show=Q.hint||!TTS||Q.answered;
  const hint = show ? `<div class="prompt">${c.it.kind==='w'&&d.e?`<div class="p-emo" aria-hidden="true">${d.e}</div>`:''}<div class="p-mean">${esc(d.m)}</div></div>`
                    : `<button class="hint" data-act="hint">힌트: 뜻 보기</button>`;
  return (TTS?bigSpeaker(t):'<p class="note">이 기기에서는 소리를 낼 수 없어서 뜻을 보고 풀어요.</p>')+hint; }
function spellHtml(st){
  let k=0; const groups=[]; let cur=[];
  st.chars.forEach(ch=>{ if(ch===' '){ groups.push(cur); cur=[]; return; } const id=st.slots[k];
    cur.push(`<button class="slot ${id!==null?'full':''}" data-act="unslot" data-arg="${k}" ${Q.answered?'disabled':''} aria-label="${k+1}번째 칸">${id!==null?esc(st.tiles[id].ch):''}</button>`); k++; });
  groups.push(cur);
  const cls=Q.answered?(Q.lastOk?' ok':' no'):'';
  const tiles=Q.answered?'':st.order.filter(id=>!st.slots.includes(id)).map(id=>`<button class="tile" data-act="tile" data-arg="${id}">${esc(st.tiles[id].ch)}<sub>${PTS[st.tiles[id].ch.toLowerCase()]||''}</sub></button>`).join('');
  return `<div class="slots${cls}">${groups.map(g=>`<div class="wgroup">${g.join('')}</div>`).join('')}</div><div class="tiles">${tiles}</div>${Q.answered?'':'<button class="reset" data-act="resetBlocks">처음부터 다시 놓기</button>'}`;
}
function orderHtml(st){

  const pool=Q.answered?'':st.order.filter(id=>!st.placed.includes(id)).map(id=>`<button class="wtile" data-act="place" data-arg="${id}">${esc(st.pool[id])}</button>`).join('');
  return `<div class="line${cls}">${placed||'<span class="ph">블록을 누르면 여기에 놓여요</span>'}</div><div class="tiles">${pool}</div>${Q.answered?'':'<button class="reset" data-act="resetBlocks">처음부터 다시 놓기</button>'}`;
}
function typeHtml(){

function answerUI(c){

function fbHtml(){

function viewQuiz(){

function focusAfter(){
  if(Q.answered){ const nb=document.getElementById('nextBtn'); if(nb){ nb.focus({preventScroll:true}); nb.scrollIntoView({block:'nearest',behavior:'smooth'}); } }
  else { const inp=document.getElementById('ans'); if(inp){ inp.focus({preventScroll:true}); const v=inp.value; inp.value=''; inp.value=v; } }
}
function submitType(val){
  const c=Q.cur, target=c.type==='sblank'?c.state.word:c.it.d.w; Q.typed=val;
  if(!norm(val)) return;
  if(norm(val)===norm(target)) return answer(true,val);
  if(!Q.near&&lev(norm(val),norm(target))===1){ Q.near=true; fx('near'); render(); return; }
  answer(false,val);
}
function answer(ok,given){
  if(Q.answered) return;
  if(Q.mode==='live') return playAnswer(ok,given);
  const c=Q.cur, it=c.it, s=stu(ME), before=stageOf(masteredN(ME));
  Q.answered=true; Q.lastOk=ok; Q.msg='';
  if(ok){
    fx('good'); Q.praise=PRAISE[Math.floor(Math.random()*PRAISE.length)]; Q.done++; if(c.tries===0) Q.right++;
    if(['wblank','wfull','chal'].includes(Q.mode)) s.mastered[it.key]=1;
    if(Q.mode==='basket'){ const b=s.basket[it.key]; if(b){ b.streak=(b.streak||0)+1;
      if(b.streak>=3){ delete s.basket[it.key]; s.mastered[it.key]=1; Q.msg='세 번 연속 정답! 바구니에서 빠졌어요.'; }
      else Q.msg=`연속 ${b.streak}번 맞혔어요. ${3-b.streak}번 더 맞히면 바구니에서 빠져요.`; } }
  } else {
    fx('bad'); s.wrongs[it.key]=(s.wrongs[it.key]||0)+1; s.basket[it.key]={streak:0,at:Date.now()};
    if(!Q.wrong.some(w=>w.key===it.key)) Q.wrong.push(it);
    if(['prac','wblank','wfull'].includes(Q.mode)){
      Q.queue.splice(Math.min(2,Q.queue.length),0,{it,type:pickType(Q.mode,it,null,c.type),tries:c.tries+1});
      Q.msg='오답 바구니에 담았어요. 조금 뒤에 다시 나와요.';
    } else { Q.done++; Q.msg = Q.mode==='basket' ? '괜찮아요. 다음에 다시 도전해요.' : '오답 바구니에 담았어요.'; }
  }
  s.last=Date.now(); saveStudent(ME);
  const after=stageOf(masteredN(ME));
  if(after>before) setTimeout(()=>{ fx('star'); toast(`${TREE[after][1]} 내 나무가 「${TREE[after][0]}」(으)로 자랐어요!`); },500);
  setTimeout(()=>say(textOf(it)),150);
  render();
}
function finishQuiz(){
  let starMsg='';
  if(Q.mode!=='basket'){
    const p=uprog(ME,Q.uid), b=stars(p);
    if(Q.mode==='prac') p.prac=true;
    if(Q.mode==='wblank') p.wblank=true;
    if(Q.mode==='wfull') p.wfull=true;
    if(Q.mode==='chal'){ p.best=Math.max(p.best,Q.right); p.tries++; }
    p.last=Date.now(); const a=stars(p); if(a>b) starMsg='별을 받았어요! '+starText(a);
  }
  saveStudent(ME); if(MODE==='online') pushStudent(ME);
  Q.starMsg=starMsg; go('result'); if(starMsg) fx('star');
}

async function liveCreate(setIn){
  const Lv=setIn||T.live, u=unitById(Lv.uid);
  if(!u){ T.err='단원을 골라 주세요.'; render(); return; }
  const items=itemsOf(u), w=items.filter(i=>i.kind==='w'), s=items.filter(i=>i.kind==='s');
  let pick;
  if(Lv.kinds==='w') pick=sample(w,Lv.n);
  else if(Lv.kinds==='s') pick=sample(s,Lv.n);
  else { const ns=Math.min(s.length,Math.round(Lv.n*0.3)); pick=shuffle([...sample(w,Math.min(w.length,Lv.n-ns)),...sample(s,ns)]); }
  if(!pick.length){ T.err='이 단원에는 그 종류의 문제가 없어요.'; render(); return; }
  const qs=pick.map(it=>{
    const q={key:it.key,kind:it.kind,text:textOf(it),m:it.d.m,e:it.d.e||''};
    if(it.kind==='w'){ q.type=Lv.how==='type'?'type':'spell'; if(q.type==='spell') q.dec=decoys(q.text.replace(/\s+/g,'')); }
    else { const many=tokens(q.text).length>=2; q.type=Lv.how==='type'&&many?'kor':'order'; if(q.type==='kor') q.extra=korExtras(it); }
    return q;
  });
  const set=Object.assign({},Lv,{title:u.title});
  T.busy=true; T.err=''; render();
  try{
    let code=null;
    for(let i=0;i<25;i++){ const c=String(Math.floor(1000+Math.random()*9000)); const snap=await F.getDoc(gameRef(c)); if(!snap.exists()){ code=c; break; } }
    if(!code) throw new Error('code');
    const g={status:'lobby',qi:-1,qs,set,board:[],teamScore:{A:0,B:0},created:Date.now(),updated:Date.now()};
    await F.setDoc(gameRef(code),g);
    hostUnwatch();
    HOST={code,g,players:{},answers:{},qAt:0,spoke:-1,hint:false,unsubs:[]};
    hostWatch(); T.busy=false; go('host');
  }catch(e){ T.busy=false; if(e&&e.code==='permission-denied') return netErr(e); T.err='게임을 만들지 못했어요. 인터넷 연결을 확인해 주세요.'; render(); }
}

function answeredCount(){ const qi=HOST.g.qi; return Object.values(HOST.answers).filter(a=>a.qi===qi).length; }
function hostUpdate(patch){ Object.assign(HOST.g,patch); render(); return F.updateDoc(gameRef(HOST.code),Object.assign({updated:Date.now()},patch)).catch(netErr); }
function scoreBoard(){
  const pts={};
  Object.values(HOST.players).forEach(p=>pts[p.name]={name:p.name,team:p.team||null,score:0,right:0});
  Object.values(HOST.answers).forEach(a=>{ const q=HOST.g.qs[a.qi]; if(!q) return;
    if(!pts[a.name]) pts[a.name]={name:a.name,team:a.team||null,score:0,right:0};
    if(a.ok){ pts[a.name].score+=calcPts(q,a.ms,HOST.g.set); pts[a.name].right++; } });
  const board=Object.values(pts).sort((x,y)=>y.score-x.score||x.name.localeCompare(y.name,'ko'));
  const ts={A:0,B:0}; board.forEach(b=>{ if(b.team) ts[b.team]+=b.score; });
  return {board,ts};
}
function hostStart(){ HOST.qAt=Date.now(); hostUpdate({status:'q',qi:0}); }
function hostReveal(){
  if(HOST.g.status!=='q') return; clearTimeout(HOST.spk2);
  const {board,ts}=scoreBoard(), qi=HOST.g.qi, as=Object.values(HOST.answers).filter(a=>a.qi===qi);
  fx('star'); hostUpdate({status:'r',board,teamScore:ts,stat:{qi,right:as.filter(a=>a.ok).length,total:as.length}});
}
function hostNext(){ const qi=HOST.g.qi+1; if(qi>=HOST.g.qs.length) return hostEnd(); HOST.qAt=Date.now(); HOST.hint=false; hostUpdate({status:'q',qi}); }
function hostEnd(){
  clearTimeout(HOST.spk2);
  const {board,ts}=scoreBoard();
  const missed=HOST.g.qs.map((q,i)=>{ const as=Object.values(HOST.answers).filter(a=>a.qi===i); return {i,right:as.filter(a=>a.ok).length,total:as.length}; })
    .filter(x=>x.total&&x.right<x.total).sort((a,b)=>a.right/a.total-b.right/b.total).slice(0,3);
  fx('star'); hostUpdate({status:'end',board,teamScore:ts,missed});
}
function hostTimeLeft(){ const q=HOST.g.qs[HOST.g.qi]; return limitOf(q,HOST.g.set)-(Date.now()-HOST.qAt); }

      <div class="tv-meta">${esc(set.title)} · ${g.qs.length}문제 · ${set.team?'팀 대결':'개인전'} · ${set.how==='type'?'직접 쓰기':'블록 찾기'} · 소리 ${set.sound==='all'?'TV와 태블릿':'TV에서만'}</div></section>

  } else if(g.status==='q'){
    const q=g.qs[g.qi], done=new Set(Object.values(HOST.answers).filter(a=>a.qi===g.qi).map(a=>a.name)), left=Math.max(0,Math.ceil(hostTimeLeft()/1000));
    body=`<div class="tv-top"><div class="tv-qn">문제 ${g.qi+1} / ${g.qs.length} · ${q.kind==='w'?'단어':'문장'}</div><div class="tv-timer ${left<=5?'low':''}" id="htime">${left}</div></div>

      ${HOST.hint?`<div class="prompt">${q.kind==='w'&&q.e?`<div class="p-emo" aria-hidden="true">${q.e}</div>`:''}<div class="p-mean">${esc(q.m)}</div></div>`:`<button class="hint" data-act="hostHint">뜻 보여 주기</button>`}
      <div class="tv-count"><b>${done.size}</b> / ${ps.length}명 답했어요</div><div class="pchips">${ps.map(p=>chip(p,done.has(p.name))).join('')}</div></section>
      <div class="nav2"><button class="btn ghost" data-act="hostEnd">${T.arm==='hostEnd'?'한 번 더 누르면 끝나요':'끝내기'}</button><button class="btn gold" data-act="hostReveal">정답 공개</button></div>`;
  } else if(g.status==='r'){
    const q=g.qs[g.qi], st=g.stat||{right:0,total:0};
    const fast=Object.values(HOST.answers).filter(a=>a.qi===g.qi&&a.ok).sort((a,b)=>a.ms-b.ms).slice(0,5);
    body=`<div class="tv-top"><div class="tv-qn">문제 ${g.qi+1} / ${g.qs.length} 정답</div></div>

      <div class="tv-rate">정답률 <b>${st.total?Math.round(st.right/st.total*100):0}%</b> (${st.right} / ${st.total}명)</div>

  if(g.status==='q'&&HOST.spoke!==g.qi){ HOST.spoke=g.qi; const t=g.qs[g.qi].text; setTimeout(()=>say(t),400); clearTimeout(HOST.spk2); HOST.spk2=setTimeout(()=>{ if(HOST&&HOST.g.status==='q'&&HOST.g.qi===g.qi) say(t); },4000); }

async function joinGame(code){
  CUR.jcode=code; CUR.jerr='';
  if(!/^\d{4}$/.test(code)){ CUR.jerr='숫자 4개를 써 주세요.'; render(); return; }
  CUR.joining=true; render();
  try{
    const snap=await F.getDoc(gameRef(code));
    if(!snap.exists()){ CUR.joining=false; CUR.jerr='그런 게임이 없어요. 숫자를 다시 확인해요.'; render(); return; }
    const g=snap.data();
    if(g.status==='end'){ CUR.joining=false; CUR.jerr='이미 끝난 게임이에요.'; render(); return; }
    let team=null;
    if(g.set.team){
      const ps=await F.getDocs(F.collection(F.db,'cgGames',code,'players')); let a=0,b=0,mine=null;
      ps.forEach(d=>{ const t=d.data().team; if(d.id===ME) mine=t; else if(t==='A') a++; else if(t==='B') b++; });
      team=mine||(a<=b?'A':'B');
    }
    await F.setDoc(F.doc(F.db,'cgGames',code,'players',ME),{name:ME,team,joined:Date.now()});
    if(PLAY&&PLAY.unsub) PLAY.unsub();
    PLAY={code,team,g,qi:-1,sent:-1,my:{},recvAt:0,fxQi:-1,unsub:null};
    PLAY.unsub=F.onSnapshot(gameRef(code), s=>{ if(!s.exists()) return; const ng=s.data(); PLAY.g=ng;
      if(ng.status==='q'&&PLAY.qi!==ng.qi){ PLAY.qi=ng.qi; setupLiveQ(); }
      if(ng.status==='r'&&PLAY.fxQi!==ng.qi){ PLAY.fxQi=ng.qi; const my=PLAY.my[ng.qi]; fx(my&&my.ok?'good':'bad'); }
      if(ng.status==='end'&&PLAY.fxQi!=='end'){ PLAY.fxQi='end'; fx('star'); }
      if(VIEW==='play') render(); }, netErr);
    CUR.joining=false; go('play');
  }catch(e){ console.warn(e); CUR.joining=false; CUR.jerr='들어가지 못했어요. 인터넷 연결을 확인해요.'; render(); }
}
function setupLiveQ(){
  const q=PLAY.g.qs[PLAY.qi];
  const it={kind:q.kind,key:q.key,d:q.kind==='w'?{w:q.text,m:q.m,e:q.e}:{s:q.text,m:q.m}};
  const c={it,type:q.type,dec:q.dec,extra:q.extra}; c.state=buildState(c);
  Q={mode:'live',cur:c,answered:false,near:false,typed:'',hint:false,queue:[]};
  PLAY.recvAt=Date.now();
  if(PLAY.g.set.sound==='all') setTimeout(()=>say(q.text),400);
}
function playAnswer(ok,given){
  if(!PLAY||PLAY.sent===PLAY.qi) return;
  const qi=PLAY.qi, q=PLAY.g.qs[qi], L=limitOf(q,PLAY.g.set), ms=Math.min(Date.now()-PLAY.recvAt,L);
  PLAY.sent=qi; Q.answered=true;
  PLAY.my[qi]={ok,pts:ok?calcPts(q,ms,PLAY.g.set):0};
  F.setDoc(F.doc(F.db,'cgGames',PLAY.code,'answers',qi+'__'+ME),{qi,name:ME,team:PLAY.team,ok,ms,given:String(given||'').slice(0,80),at:Date.now()}).catch(netErr);
  if(findItem(q.key)){ const s=stu(ME); if(ok) s.mastered[q.key]=1; else { s.wrongs[q.key]=(s.wrongs[q.key]||0)+1; s.basket[q.key]={streak:0,at:Date.now()}; } s.last=Date.now(); saveStudent(ME); }
  fx('sent'); render();
}
function playTimeLeft(){ const q=PLAY.g.qs[PLAY.qi]; return limitOf(q,PLAY.g.set)-(Date.now()-PLAY.recvAt); }
function viewPlay(){
  const g=PLAY.g, badge=PLAY.team?`<span class="tbadge t${PLAY.team}">${TEAM[PLAY.team]}</span>`:'';
  let body='';
  if(g.status==='lobby') body=`<section class="panel center-col">${badge}<div class="big-msg">${esc(ME)}, 들어왔어요!</div><p class="note">선생님이 시작하면 문제가 나와요. TV를 봐요.</p></section>`;
  else if(g.status==='q'){
    if(PLAY.qi!==g.qi){ PLAY.qi=g.qi; setupLiveQ(); }
    const q=g.qs[g.qi];
    if(PLAY.sent===g.qi) body=`<section class="panel center-col">${badge}<div class="big-msg">답을 보냈어요!</div><p class="note">정답 공개를 기다려요.</p></section>`;
    else { const left=Math.max(0,playTimeLeft());
      body=`<div class="qtop"><div class="bar thin timebar"><span id="ptbar" style="width:${left/limitOf(q,g.set)*100}%"></span></div><div class="count" id="ptime">${Math.ceil(left/1000)}초</div></div>
      <section class="qcard"><div class="ask">문제 ${g.qi+1} / ${g.qs.length} · ${ASK[Q.cur.type]}</div>
      ${g.set.sound==='all'&&TTS?bigSpeaker(q.text):'<p class="note">TV 소리를 잘 들어요</p>'}${answerUI(Q.cur)}</section>`; }
  } else if(g.status==='r'){
    const q=g.qs[g.qi], my=PLAY.my[g.qi], i=(g.board||[]).findIndex(b=>b.name===ME);
    body=`<section class="panel center-col">${badge}<div class="fb ${my&&my.ok?'ok':'no'}"><div class="fb-head">${my?(my.ok?'정답! +'+num(my.pts)+'점':'아쉬워요!'):'이번 문제는 못 풀었어요'}</div>
      <div class="fb-ans"><span class="lab">정답</span><span class="en">${esc(q.text)}</span></div><div>${esc(q.m)}</div></div>
      ${i>=0?`<div class="big-msg">지금 ${i+1}등 · ${num(g.board[i].score)}점</div>`:''}<p class="note">다음 문제를 기다려요.</p></section>${g.set.team?tugHtml(g.teamScore):''}`;
  } else body=finalHtml(g,false);
  shell('다 같이 하기','playLeave',body);
  if(g.status==='q'&&PLAY.sent!==g.qi) focusAfter();
}
setInterval(()=>{
  if(VIEW==='host'&&HOST&&HOST.g.status==='q'){
    const left=hostTimeLeft(), el=document.getElementById('htime');
    if(el){ const s=Math.max(0,Math.ceil(left/1000)); el.textContent=s; el.classList.toggle('low',s<=5); }
    if(left<=0) hostReveal();
  }
  if(VIEW==='play'&&PLAY&&PLAY.g.status==='q'&&PLAY.sent!==PLAY.qi&&PLAY.qi===PLAY.g.qi){
    const q=PLAY.g.qs[PLAY.qi], left=playTimeLeft();
    const t=document.getElementById('ptime'), b=document.getElementById('ptbar');
    if(t) t.textContent=Math.max(0,Math.ceil(left/1000))+'초';
    if(b) b.style.width=Math.max(0,left/limitOf(q,PLAY.g.set)*100)+'%';
    if(left<=0){ toast('시간이 끝났어요!'); playAnswer(false,''); }
  }
},250);

function exportCsv(){
  const units=DB.units;
  const head=['이름',...units.flatMap((u,i)=>[`${i+1}단원 별`,`${i+1}단원 도전 최고`]),'외운 단어·문장','오답 바구니','마지막 연습'];
  const rows=DB.roster.map(n=>{ const s=DB.students[n];
    return [n,...units.flatMap(u=>{ const p=s&&s.units[u.id]; return [p?stars(p):0, p&&p.best>=0?p.best:'']; }), s?Object.keys(s.mastered).length:0, s?basketItems(n).length:0, s&&s.last?new Date(s.last).toLocaleDateString('ko-KR'):'']; });
  const top=topWrong();
  const all=[head,...rows,[],['많이 틀린 단어·문장','뜻','틀린 횟수'],...top.map(x=>[textOf(x.it),x.it.d.m,x.c])];
  const cell=c=>{ c=String(c??''); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; };
  const csv='﻿'+all.map(r=>r.map(cell).join(',')).join('\r\n');
  try{
    const d=new Date(), ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`최강영단어_기록_${ymd}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast('기록 파일을 내려받았어요.');
  }catch(e){ toast('이 화면에서는 내려받을 수 없어요.'); }
}

function splitLine(l){ return l.split(/[|｜\t]/).map(x=>x.trim()); }
async function edSave(){
  const title=document.getElementById('edTitle').value.trim();
  const wt=document.getElementById('edWords').value, stx=document.getElementById('edSents').value;
  Object.assign(T.edit,{title,wordsText:wt,sentsText:stx});
  const err=m=>{ T.err=m; render(); };
  if(!title) return err('단원 이름을 써 주세요.');
  const words=[], seen=new Set(); const wl=wt.split('\n').map(l=>l.trim()).filter(Boolean);
  for(let i=0;i<wl.length;i++){ const [w,m,e]=splitLine(wl[i]); if(!w||!/[a-z]/i.test(w)) return err(`단어 ${i+1}번째 줄의 영어를 확인해 주세요.`);
    if(!m) return err(`단어 ${i+1}번째 줄 "${w}"에 뜻이 없어요. "영어 | 뜻" 모양으로 써 주세요.`);
    const ww=w.replace(/\s+/g,' '); if(seen.has(ww.toLowerCase())) continue; seen.add(ww.toLowerCase()); words.push({w:ww,m,e:e||autoEmoji(ww)}); }
  if(words.length<2) return err('단어를 2개 이상 넣어 주세요.');
  const sents=[]; const sl=stx.split('\n').map(l=>l.trim()).filter(Boolean);
  for(let i=0;i<sl.length;i++){ const [s,m]=splitLine(sl[i]); if(!s) continue; if(!m) return err(`문장 ${i+1}번째 줄에 뜻이 없어요.`); sents.push({s:s.replace(/\s+/g,' '),m}); }
  const before=JSON.stringify(DB.units);
  if(T.edit.isNew) DB.units.push({id:'u'+Date.now().toString(36),title,open:false,words,sents});
  else Object.assign(unitById(T.edit.id),{title,words,sents});
  const ok=await saveClass();
  if(!ok){ DB.units=JSON.parse(before); return; }
  T.edit=null; T.err=''; T.ok='저장했어요.'; render();
}

    else if(a!==b) T.err='두 번 쓴 비밀번호가 달라요.';
    else if(MODE!=='online'){ DB.pin=a; saveLocal(); T.ok='비밀번호를 바꿨어요.'; }
    else { try{ await F.setDoc(F.doc(F.db,'cgPrivate','teacher'),{pw:a,at:Date.now()}); await F.setDoc(F.doc(F.db,'cgTeacher',UID),{pw:a,at:Date.now()}); T.ok='비밀번호를 바꿨어요. 다른 기기는 새 비밀번호로 다시 들어와야 해요.'; }
      catch(err){ T.err='바꾸지 못했어요. 인터넷 연결을 확인해 주세요.'; } }
    render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='rsSel'){ T.rs=e.target.value; T.arm=null; T.rsMsg=''; T.allMsg=''; render(); }
  if(e.target.id==='lvUnit'){ T.live.uid=e.target.value; }
});

(async function boot(){ render(); await initOnline(); render(); })();

</script>
