<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>청장 메이커</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 화면 육성 대시보드. 왼쪽 = 캐릭터와 AI 멘토, 오른쪽 = 인사기록카드, 아래 = 결재 서류 6장 */
:root{
  --paper:#EEF2F4;      /* 공문서 용지빛 바탕 */
  --card:#FFFFFF;
  --ink:#1E2A3A;        /* 결재 잉크 남색 */
  --ink-soft:#5B6878;
  --line:#D5DDE3;
  --seal:#C8372D;       /* 인주 빨강: 결재 도장 */
  --joy:#2F7D7A;        /* AI 멘토 조이 청록 */
  --joy-tint:#E1F0EE;
  --gold:#B8862B;
  --warn:#D9822B;
  --bar-bg:#E4E9ED;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141B24;--card:#1D2733;--ink:#E6ECF1;--ink-soft:#9AA8B6;--line:#2E3B4A;
  --seal:#E2574B;--joy:#5BC0B8;--joy-tint:#1C3634;--gold:#D9AA52;--warn:#E89A4C;--bar-bg:#2A3644;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141B24;--card:#1D2733;--ink:#E6ECF1;--ink-soft:#9AA8B6;--line:#2E3B4A;
  --seal:#E2574B;--joy:#5BC0B8;--joy-tint:#1C3634;--gold:#D9AA52;--warn:#E89A4C;--bar-bg:#2A3644;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--joy);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:28px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.logo .stamp{font-size:13px;color:var(--seal);border:2px solid var(--seal);border-radius:6px;padding:0 6px;transform:rotate(-8deg);display:inline-block}
.when{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
.chip b{font-family:var(--f-display);font-weight:400}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.ghost:hover{border-color:var(--ink-soft)}

/* 메인 */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.hero{display:flex;flex-direction:column;gap:12px}
.portrait{display:flex;gap:14px;align-items:flex-end}
.portrait svg{width:150px;height:auto;flex:none}
.idcard{display:flex;flex-direction:column;gap:2px;min-width:0}
.idcard .name{font-family:var(--f-display);font-size:24px}
.idcard .rank{color:var(--seal);font-family:var(--f-display);font-size:17px}
.idcard .sub{color:var(--ink-soft);font-size:13px}
.joy{background:var(--joy-tint);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.joy .face{flex:none;width:38px;height:38px;border-radius:10px;background:var(--joy);display:grid;place-items:center}
.joy .face svg{width:26px;height:26px}
.joy .who{font-family:var(--f-display);color:var(--joy);font-size:15px}
.joy p{margin:2px 0 6px}
.joy .basis{font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.joy .basis.err{color:var(--seal)}
.linkbtn{background:none;border:0;padding:0;color:var(--joy);text-decoration:underline;font-size:13px}
.trust{font-family:var(--f-num);font-size:12px;color:var(--ink-soft)}

/* 인사기록카드 */
.record h2,.desk h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.record h2 small,.desk h2 small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft)}
.stats{display:grid;gap:9px}
.stat{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:10px;align-items:center}
.stat .lbl{font-size:14px}
.stat .num{font-family:var(--f-num);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bar-bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink);transition:width .5s ease}
.stat.stress .bar i{background:var(--warn)}
.stat.stress.hot .bar i{background:var(--seal)}
.stat .delta{font-family:var(--f-num);font-size:11px;color:var(--joy);margin-left:4px}
.divider{height:1px;background:var(--line);margin:4px 0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-soft)}
.badges span{border:1px solid var(--line);border-radius:6px;padding:2px 8px}

/* 결재 서류 */
.desk .docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.desk .docs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.doc{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;min-height:112px;transition:transform .12s ease,border-color .12s ease}
.doc:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ink-soft)}
.doc:disabled{cursor:default;opacity:.55}
.doc .kind{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.doc .t{font-family:var(--f-display);font-size:17px;line-height:1.25}
.doc .eff{font-size:12.5px;color:var(--ink-soft)}
.doc.rec{border-color:var(--joy);box-shadow:0 0 0 1px var(--joy) inset}
.doc .rectag{position:absolute;top:8px;right:8px;font-size:11px;color:var(--joy);font-family:var(--f-display)}
.doc .seal{position:absolute;right:10px;bottom:8px;width:54px;height:54px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);font-family:var(--f-display);display:grid;place-items:center;font-size:15px;transform:rotate(-14deg) scale(1.6);opacity:0;pointer-events:none}
.doc.stamped .seal{animation:stamp .35s ease-out forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.9}}

.log{font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.log div:first-child{color:var(--ink)}
.foot{font-size:12px;color:var(--ink-soft);text-align:center}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;overflow-y:auto}
.modal{background:var(--card);color:var(--ink);border-radius:16px;max-width:520px;width:100%;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 16px);overflow-y:auto}
.modal .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--seal)}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.modal p{margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.choice:hover{border-color:var(--ink)}
.choice small{display:block;color:var(--ink-soft);font-size:12.5px}
.primary{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:12px 18px;font-family:var(--f-display);font-size:18px}
.primary:hover{opacity:.9}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.title-art{display:flex;justify-content:center}
.title-art svg{width:150px}
.big{font-family:var(--f-display);font-size:38px;line-height:1.1;text-align:center;margin:0}
.center{text-align:center}
.muted{color:var(--ink-soft);font-size:13px}

/* 발령장 */
.cert{border:2px double var(--ink-soft);border-radius:8px;padding:18px;position:relative;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.cert .kicker{text-align:center;font-family:var(--f-display);font-size:15px;color:var(--ink-soft);letter-spacing:.3em}
.cert h3{text-align:center;font-size:28px}
.cert .bigseal{position:absolute;right:14px;top:14px;width:62px;height:62px;border:3px solid var(--seal);border-radius:8px;color:var(--seal);font-family:var(--f-display);display:grid;place-items:center;text-align:center;line-height:1.1;font-size:15px;transform:rotate(-10deg);opacity:.85}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:13px}
.mini span{font-family:var(--f-num)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:84px;display:flex;flex-direction:column;gap:2px;background:var(--paper)}
.slot b{font-family:var(--f-display);font-weight:400;font-size:15px}
.slot small{color:var(--ink-soft);font-size:12px}
.slot.locked b{color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.doc.stamped .seal{opacity:.9;transform:rotate(-14deg)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">청장 메이커 <span class="stamp">결재</span></div>
    <div class="when">
      <span class="chip" id="chipDate"><b>2026년 봄</b></span>
      <span class="chip" id="chipYear">1년차 · 1/40분기</span>
      <button class="ghost" id="btnGallery" type="button">엔딩 도감</button>
    </div>
  </header>

  <section class="main">
    <div class="panel hero">
      <div class="portrait">
        <div id="charBox"></div>
        <div class="idcard">
          <span class="sub">조달청 공무원증</span>
          <span class="name" id="pName">김하늘</span>
          <span class="rank" id="pRank">9급 주무관</span>
          <span class="sub" id="pDept">공공조달 신입 연수생</span>
        </div>
      </div>
      <div class="joy" aria-live="polite">
        <div class="face" aria-hidden="true"><svg viewBox="0 0 26 26"><rect x="3" y="5" width="20" height="16" rx="5" fill="#fff"/><circle cx="9.5" cy="13" r="2.2" fill="#1E2A3A"/><circle cx="16.5" cy="13" r="2.2" fill="#1E2A3A"/><rect x="12" y="1" width="2" height="4" fill="#fff"/></svg></div>
        <div style="min-width:0;flex:1">
          <div class="who">AI 멘토 조이 <span class="trust" id="joyTrust"></span></div>

          <div class="basis" id="joyBasis" hidden></div>
        </div>
      </div>
    </div>

    <div class="panel record">
      <h2>인사기록카드 <small id="recHint">스탯 0~100</small></h2>
      <div class="stats" id="stats"></div>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <section class="panel desk">
    <h2>이번 분기 업무 결재 <small>서류 한 장을 골라 결재하세요</small></h2>
    <div class="docs" id="docs"></div>
    <div class="log" id="log"></div>
  </section>

  <p class="foot">등장인물과 사건은 모두 가상입니다. 2026 조달청 AI 게임·콘텐츠 공모전 출품용 프로토타입.</p>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

/* ---------- AI 멘토 조이 ---------- */
function makeAdvice(){
  const weakest=[...STATS].sort((a,b)=>S[a.k]-S[b.k])[0];
  const strongest=[...STATS].sort((a,b)=>S[b.k]-S[a.k])[0];
  const glitch = S.turn>1 && Math.random()<0.2;
  if(!glitch){
    if(S.stress>=65) return {job:'rest',glitch:false,trust:rnd(88,97),msg:'스트레스가 높아요. 이번 분기는 쉬는 게 좋겠어요.',basis:`스트레스 ${S.stress}. 70을 넘으면 성장 효율이 절반으로 떨어지고, 100이 되면 번아웃이에요.`};
    return {job:JOB_FOR[weakest.k],glitch:false,trust:rnd(82,96),msg:`${weakest.n}이(가) 가장 약해요. "${JOBS.find(j=>j.id===JOB_FOR[weakest.k]).t}"을(를) 추천해요.`,basis:`현재 가장 낮은 스탯은 ${weakest.n} ${S[weakest.k]}. 청장이 되려면 다섯 역량이 고르게 높아야 해요.`};
  }
  // 조이의 실수: 그럴듯하지만 틀린 추천
  if(S.stress>=55) return {job:'g2b',glitch:true,trust:rnd(93,99),msg:'데이터상 지금이 연수 효율 최고 시점이에요! 연수를 강력 추천해요.',basis:`⚠ 근거를 보니 스트레스 수치(${S.stress})가 계산에서 빠져 있어요. 조이의 추천 오류를 발견했습니다!`};
  return {job:JOB_FOR[strongest.k],glitch:true,trust:rnd(93,99),msg:`${strongest.n} 분야가 요즘 뜨고 있어요! 이쪽을 더 키우는 걸 추천해요.`,basis:`⚠ 근거를 보니 이미 가장 높은 ${strongest.n}(${S[strongest.k]})을 또 키우라는 추천이에요. 약한 역량을 놓친 오류입니다!`};
}

  if(a){ $('joyBasis').textContent=a.basis; $('joyBasis').className='basis'+(a.glitch?' err':''); }
  $('btnBasis').hidden=!a||a.shown;
  $('docs').innerHTML=JOBS.map(j=>`<button class="doc${a&&a.job===j.id?' rec':''}" type="button" data-job="${j.id}" ${S.busy?'disabled':''}>
    ${a&&a.job===j.id?'<span class="rectag">조이 추천</span>':''}
    <span class="kind">${j.kind}</span><span class="t">${j.t}</span><span class="eff">${j.eff} · 스트레스 ${j.stress>0?'+':''}${j.stress}</span><span class="seal">결재</span></button>`).join('');
  $('log').innerHTML=S.log.slice(0,3).map(l=>`<div>${l}</div>`).join('');

function statRow(n,v,d,cls){
  const dd = d ? `<span class="delta">${d>0?'+':''}${d}</span>` : '';
  return `<div class="stat ${cls}"><span class="lbl">${n}${dd}</span><div class="bar"><i style="width:${v}%"></i></div><span class="num">${v}</span></div>`;
}

/* ---------- 진행 ---------- */
function apply(eff){
  const out={};
  for(const [k,v] of Object.entries(eff)){
    let val=v;
    if(k!=='stress' && v>0 && S.stress>=70) val=Math.max(1,Math.round(v/2));
    if(k!=='stress' && v>0 && S[k]>=70) val=Math.max(1,Math.round(val*0.5)); // 고른 성장 유도
    const before=S[k]; S[k]=clamp(S[k]+val); out[k]=(out[k]||0)+(S[k]-before);
  }
  return out;
}
function merge(a,b){ const o={...a}; for(const k in b) o[k]=(o[k]||0)+b[k]; return o; }
function describe(d){ return Object.entries(d).filter(([,v])=>v).map(([k,v])=>`${NAME[k]} ${v>0?'+':''}${v}`).join(', '); }

function doJob(id){
  if(S.busy||S.done) return;
  const j=JOBS.find(x=>x.id===id);
  S.busy=true;
  const btn=document.querySelector(`[data-job="${id}"]`);
  if(btn) btn.classList.add('stamped');
  const eff={stress:j.stress};
  for(const [k,[a,b]] of Object.entries(j.gain)) eff[k]=rnd(a,b);
  const followed = S.advice && S.advice.job===id;
  if(followed && S.advice.glitch && !S.advice.shown) eff.stress=(eff.stress||0)+4; // 검증 없이 따른 오류 추천
  const d=apply(eff);
  S.last={...d,happy:j.id==='rest'||Object.values(d).some(v=>v>=8)};
  const y=Math.floor(S.turn/4), q=S.turn%4;
  S.log.unshift(`${2026+y}년 ${SEASONS[q]}: ${j.t} (${describe(d)})`);
  setTimeout(()=>{ S.busy=false; afterJob(); },reduced()?0:420);
  render(); if(btn){ const b2=document.querySelector(`[data-job="${id}"]`); b2&&b2.classList.add('stamped'); }
}
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function checkInstant(){
  if(S.stress>=100) return 'burnout';
  if(S.integrity<12) return 'fired';
  return null;
}
function afterJob(){
  const inst=checkInstant(); if(inst) return finish(inst);
  if(Math.random()<0.38){
    const pool=EVENTS.filter(e=>!S.used.includes(e.id));
    if(pool.length){ const e=pool[rnd(0,pool.length-1)]; S.used.push(e.id); return showEvent(e); }
  }
  endTurn();
}
function endTurn(){
  const inst=checkInstant(); if(inst) return finish(inst);
  const q=S.turn%4;
  S.turn++;
  if(q===3){ // 연말 인사평가
    if(S.rank<PROMO.length && avg()>=PROMO[S.rank]){ S.rank++; S.last.happy=true; S.log.unshift(`연말 인사평가: ${RANKS[S.rank]}(으)로 승진했습니다!`); showPromo(); }
    else if(S.rank<PROMO.length) S.log.unshift(`연말 인사평가: 이번에는 승진하지 못했습니다. (평균 ${avg().toFixed(1)})`);
    else S.log.unshift(`연말 인사평가: 최고 평가를 받았습니다. (평균 ${avg().toFixed(1)})`);
  }
  if(S.turn>=TURNS) return finish(judge());
  S.advice=makeAdvice();
  render();
}
function judge(){
  const ks=STATS.map(s=>s.k);
  if(S.rank>=6 && ks.every(k=>S[k]>=66) && S.integrity>=75) return 'chief';
  const top=[...ks].sort((a,b)=>S[b]-S[a])[0];
  if(S[top]>=60) return {integrity:'auditor',expertise:'architect',innovation:'scout',safety:'meister',comms:'partner'}[top];
  return 'steady';
}

/* ---------- 모달 ---------- */
function open(html){ $('modal').innerHTML=html; $('overlay').hidden=false; const f=$('modal').querySelector('button,input'); f&&f.focus(); }
function close(){ $('overlay').hidden=true; }

function showEvent(e){
  open(`<span class="eyebrow">돌발 상황 · 공문 도착</span><h3>${e.t}</h3><p>${e.d}</p>
  <div class="choices">${(Math.random()<.5?['a','b']:['b','a']).map(k=>`<button class="choice" type="button" data-c="${k}">${e[k].l}</button>`).join('')}</div>`);
  $('modal').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const c=e[b.dataset.c]; const d=apply(c.e);
    S.last=merge(S.last,d); S.last.happy = Object.values(d).reduce((s,v)=>s+v,0)>0;
    S.log.unshift(`${e.t}: ${c.l} (${describe(d)})`);
    open(`<span class="eyebrow">결과</span><h3>${e.t}</h3><p>${c.r}</p><p class="muted">${describe(d)||'변화 없음'}</p><button class="primary" type="button" id="ok">확인</button>`);
    $('ok').onclick=()=>{ close(); endTurn(); };
    render();
  });
}
function showPromo(){
  if(S.turn>=TURNS) return;
  open(`<span class="eyebrow">인사 발령</span><h3>${RANKS[S.rank]} 승진!</h3><div class="title-art">${charSVG(S.rank,'happy')}</div><p class="center">${S.name} 님이 ${DEPTS[S.rank]}(으)로 발령받았습니다.</p><button class="primary" type="button" id="ok">축하해요</button>`);
  $('ok').onclick=close;
}
function finish(id){
  S.done=id; store.add(id);
  const e=ENDINGS.find(x=>x.id===id);
  const y=Math.min(2026+Math.floor(S.turn/4),2036);
  render();
  open(`<div class="cert"><div class="kicker">발 령 장</div><h3>${e.t}</h3>
    <div class="title-art">${charSVG(id==='chief'?6:S.rank, id==='burnout'||id==='fired'?'tired':'happy')}</div>
    <p><b>${S.name}</b> · ${y}년</p><p>${e.d}</p>
    <div class="mini">${STATS.map(s=>`<div>${s.n} <span>${S[s.k]}</span></div>`).join('')}<div>AI 검증 <span>${S.caught}회</span></div></div>
    <div class="bigseal">${e.seal}</div></div>
    <p class="muted center">모은 엔딩 ${store.get().length} / ${ENDINGS.length}</p>
    <div class="row"><button class="primary" type="button" id="again">다시 키우기</button><button class="choice" type="button" id="gal">엔딩 도감</button></div>`);
  $('again').onclick=()=>titleScreen();
  $('gal').onclick=()=>gallery(true);
}
function gallery(fromEnd){
  const got=new Set(store.get());
  open(`<span class="eyebrow">엔딩 도감 · ${got.size} / ${ENDINGS.length}</span><h3>어떤 조달인이 될까요?</h3>
   <div class="gallery">${ENDINGS.map(e=>got.has(e.id)?`<div class="slot"><b>${e.t}</b><small>${e.d.split('.')[0]}.</small></div>`:`<div class="slot locked"><b>???</b><small>아직 보지 못한 엔딩</small></div>`).join('')}</div>
   <button class="primary" type="button" id="ok">${fromEnd?'다시 키우기':'닫기'}</button>`);
  $('ok').onclick=()=> fromEnd ? titleScreen() : (S.started?close():titleScreen());
}
function titleScreen(){
  S=fresh(); render();
  open(`<div class="title-art">${charSVG(0,'happy')}</div>
   <p class="big">청장 메이커</p>
   <p class="center">2026년 봄, 조달청에 신입 주무관이 들어왔습니다.<br>당신은 AI 멘토 <b>조이</b>. 10년 뒤 이 사람을 <b>조달청장</b>으로 키워 낼 수 있을까요?</p>
   <label class="muted" for="nm">신입 주무관 이름</label>
   <input type="text" id="nm" maxlength="8" value="김하늘" autocomplete="off">
   <div class="row"><button class="primary" type="button" id="go">첫 출근</button><button class="choice" type="button" id="howto">플레이 방법</button></div>`);
  $('go').onclick=start; $('nm').onkeydown=e=>{ if(e.key==='Enter') start(); };
  $('howto').onclick=howto;
}
function howto(){
  open(`<span class="eyebrow">플레이 방법</span><h3>10년, 40분기의 육성</h3>
  <p>매 분기 업무 서류 한 장을 골라 결재하면 스탯이 오릅니다. 일할수록 스트레스가 쌓이니 틈틈이 쉬어야 합니다.</p>
  <p>AI 멘토 조이가 매 분기 업무를 추천합니다. 대부분 맞지만 가끔 틀립니다. <b>추천 근거 확인하기</b>로 오류를 잡아내세요.</p>
  <p>해마다 겨울이 끝나면 인사평가로 승진이 결정됩니다. 70을 넘은 역량은 잘 오르지 않으니 고르게 키우세요. 국장까지 오르고 다섯 역량이 모두 66 이상, 청렴이 75 이상이면 조달청장이 됩니다. 엔딩은 모두 9개입니다.</p>
  <button class="primary" type="button" id="ok">알겠어요</button>`);
  $('ok').onclick=titleScreen;
}
function start(){
  const nm=($('nm')&&$('nm').value.trim())||'김하늘';
  S=fresh(nm); S.started=true; S.advice=makeAdvice(); close(); render();
}

/* ---------- 이벤트 ---------- */
$('docs').addEventListener('click',e=>{ const b=e.target.closest('[data-job]'); if(b) doJob(b.dataset.job); });
$('btnBasis').onclick=()=>{ if(!S.advice||S.advice.shown) return; S.advice.shown=true; S.verified++;
  if(S.advice.glitch){ S.caught++; const d=apply({expertise:2}); S.log.unshift(`AI 추천 오류를 검증으로 발견했습니다 (전문성 +${d.expertise||0})`); }
  render(); };
$('btnGallery').onclick=()=>gallery(false);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('overlay').hidden && S.started && !S.done && !$('modal').querySelector('[data-c]')) close(); });

/* ---------- 부팅 (뷰어 업데이트 시 진행 상태 유지) ---------- */
function boot(data){
  if(data && data.S && data.S.started){ S=data.S; S.busy=false; render(); if(S.done) finish(S.done); }
  else titleScreen();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
