<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>냥이 배포 도우미</title>
<style>
:root{--plum:#43285a;--pink:#ff6f9c;--bg:#efe7fb;color-scheme:light}
body{background:var(--bg);color:var(--plum);font-family:"Malgun Gothic",system-ui,sans-serif;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{margin:0;font-size:24px}
p{margin:0;max-width:60ch;text-align:center}
button{font:inherit;font-size:22px;padding:14px 28px;border-radius:18px;border:3px solid var(--plum);background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--plum);cursor:pointer}
#st{font-size:16px;min-height:1.4em}
textarea{width:min(640px,100%);height:120px}
</style>
<h1>우리 집 냥이 배포 도우미</h1>
<p>게임 파일(index.html)을 클립보드에 복사해서 GitHub 편집 화면에 붙여 넣을 때 쓰는 페이지예요.</p>
<button id="copy">index.html 복사하기</button>
<div id="st"></div>
<textarea id="ta" readonly hidden></textarea>
<script>
const st=document.getElementById('st'),ta=document.getElementById('ta');let src=null;
fetch('game.txt').then(r=>r.text()).then(t=>{src=t;st.textContent='준비됨: '+t.length+'자';}).catch(()=>{st.textContent='파일을 불러오지 못했어요.';});
document.getElementById('copy').addEventListener('click',()=>{
  if(!src){st.textContent='아직 불러오는 중이에요.';return;}
  navigator.clipboard.writeText(src).then(()=>{st.textContent='복사됨: '+src.length+'자';document.title='COPIED '+src.length;})
  .catch(()=>{ta.hidden=false;ta.value=src;ta.select();try{document.execCommand('copy');st.textContent='복사됨(대체 방법): '+src.length+'자';document.title='COPIED '+src.length;}catch(e){st.textContent='복사하지 못했어요.';}});
});
</script>

</body></html>
