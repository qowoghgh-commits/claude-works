<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>한글 받아쓰기 연습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one school-notebook column — 원고지 answer grid on top, big jamo keyboard below, teacher settings in a drawer */
:root{
  --paper:#F4F8F3; --sheet:#FFFFFF; --ink:#1E2A23; --muted:#5E6E64;
  --grid:#5E9E72; --grid-soft:#CFE3D4;
  --cons:#2C63C9; --cons-bg:#E6EEFB; --vow:#C9402F; --vow-bg:#FBE9E5;
  --stamp:#D23A2A; --ok:#2E8B4E; --ok-bg:#E3F3E8; --bad:#C9402F; --bad-bg:#FBE4E0;
  --btn:#1E2A23; --btn-ink:#FFFFFF; --shadow:0 2px 0 rgba(30,42,35,.18);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121915; --sheet:#1A231E; --ink:#E4EEE7; --muted:#9BB0A2;
  --grid:#5FA477; --grid-soft:#2D4235;
  --cons:#7FA8F2; --cons-bg:#1E2B44; --vow:#F08A78; --vow-bg:#3A221E;
  --stamp:#F0614F; --ok:#6BCB8B; --ok-bg:#1C3326; --bad:#F08A78; --bad-bg:#3A221E;
  --btn:#E4EEE7; --btn-ink:#121915; --shadow:0 2px 0 rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121915; --sheet:#1A231E; --ink:#E4EEE7; --muted:#9BB0A2;
  --grid:#5FA477; --grid-soft:#2D4235;
  --cons:#7FA8F2; --cons-bg:#1E2B44; --vow:#F08A78; --vow-bg:#3A221E;
  --stamp:#F0614F; --ok:#6BCB8B; --ok-bg:#1C3326; --bad:#F08A78; --bad-bg:#3A221E;
  --btn:#E4EEE7; --btn-ink:#121915; --shadow:0 2px 0 rgba(0,0,0,.5); color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted);letter-spacing:.02em}
button{font-family:var(--body);font-size:1rem;cursor:pointer;border:0;border-radius:12px;color:inherit;background:none}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.ghost{border:2px solid var(--grid-soft);padding:8px 14px;background:var(--sheet)}
.ghost:hover{border-color:var(--grid)}
.primary{background:var(--btn);color:var(--btn-ink);padding:12px 20px;font-family:var(--display);font-size:1.15rem;box-shadow:var(--shadow)}
.primary:active{transform:translateY(1px)}

.sheet{background:var(--sheet);border:2px solid var(--grid);border-radius:6px;padding:18px clamp(12px,3vw,24px) 22px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-size:1.35rem;color:var(--grid)}
.qnum b{font-size:1.9rem;font-weight:400}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress i{width:12px;height:12px;border-radius:50%;border:2px solid var(--grid-soft)}
.progress i.ok{background:var(--ok);border-color:var(--ok)}
.progress i.bad{background:var(--bad);border-color:var(--bad)}
.progress i.now{border-color:var(--grid);background:var(--grid-soft)}
.listen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.listen .primary{display:flex;align-items:center;gap:8px}
.hint{font-family:var(--display);font-size:1.6rem;color:var(--muted);opacity:.55;letter-spacing:.06em;min-height:0}

/* 원고지 */
.grid{display:flex;flex-wrap:wrap;--c:clamp(40px,10.5vw,58px)}
.cell{width:var(--c);height:var(--c);border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:grid;place-items:center;
  font-family:var(--body);font-size:calc(var(--c)*.62);line-height:1;position:relative;background:var(--sheet)}
.cell.cursor::after{content:"";position:absolute;left:18%;right:18%;bottom:10%;height:3px;border-radius:2px;background:var(--grid);animation:blink 1s steps(1) infinite}
.cell.composing{color:var(--cons)}
.cell.ok{background:var(--ok-bg)}
.cell.bad{background:var(--bad-bg);color:var(--bad)}
.cell.bad::before{content:"";position:absolute;inset:14%;border:2.5px solid var(--bad);border-radius:50%;opacity:.7}
@keyframes blink{50%{opacity:0}}
.answer{display:flex;flex-direction:column;gap:6px}
.answer .lab{font-size:.85rem;color:var(--muted);letter-spacing:.06em}
.answer .grid{--c:clamp(32px,8vw,42px)}
.answer .cell{color:var(--ok)}

.stamp{position:absolute;right:18px;top:14px;width:118px;height:118px;border:4px solid var(--stamp);border-radius:50%;color:var(--stamp);
  display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:1.45rem;line-height:1.15;transform:rotate(-14deg);
  opacity:.9;pointer-events:none;box-shadow:inset 0 0 0 4px var(--sheet),inset 0 0 0 6px var(--stamp)}
.stamp.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:rotate(-14deg) scale(1.8);opacity:0}}
.msg{font-family:var(--display);font-size:1.3rem;min-height:1.6em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* keyboard */
.kbd{display:flex;flex-direction:column;gap:10px}
.row{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.key{font-family:var(--body);font-size:1.75rem;height:58px;border-radius:12px;box-shadow:var(--shadow);font-weight:700}
.key:active{transform:translateY(2px);box-shadow:none}
.key.c{background:var(--cons-bg);color:var(--cons)}
.key.v{background:var(--vow-bg);color:var(--vow)}
.key.p{background:var(--sheet);border:2px solid var(--grid-soft);font-size:1.4rem}
.rowlab{font-size:.8rem;color:var(--muted);letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.rowlab .dot{width:10px;height:10px;border-radius:3px}
.ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.ctrl .key{font-size:1.15rem;font-family:var(--display);font-weight:400;background:var(--sheet);border:2px solid var(--grid-soft);color:var(--ink)}
.ctrl .check{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* teacher drawer */
.drawer{background:var(--sheet);border:2px dashed var(--grid);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.drawer h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0}
.drawer p{margin:0;color:var(--muted);font-size:.92rem;max-width:62ch}
textarea{width:100%;box-sizing:border-box;min-height:220px;font-family:var(--body);font-size:1.15rem;line-height:1.8;padding:10px 12px;
  border:2px solid var(--grid-soft);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;
  background-image:linear-gradient(var(--grid-soft) 1px,transparent 1px);background-size:100% 1.8em;background-position:0 calc(10px + 1.8em - 1px);background-attachment:local}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.opts label{display:flex;gap:6px;align-items:center}
select{font-family:var(--body);font-size:1rem;padding:6px 8px;border-radius:8px;border:2px solid var(--grid-soft);background:var(--paper);color:var(--ink)}
.saved{color:var(--ok);font-size:.95rem}

.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.score{font-family:var(--display);font-size:3rem;line-height:1;color:var(--grid)}
.score span{font-size:1.4rem;color:var(--muted)}
.wronglist{margin:0;padding-left:1.2em;font-size:1.15rem}
.wronglist li{margin:4px 0}
.wronglist s{color:var(--bad)}
/* 급수 chips */
.levels{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.levelsLab{font-family:var(--display);font-size:1.1rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:1.1rem;padding:8px 16px;border-radius:999px;background:var(--sheet);border:2px solid var(--grid-soft);color:var(--ink);display:flex;align-items:center;gap:6px}
.chip small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
.chip:hover{border-color:var(--grid)}
.chip[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--grid);border-color:var(--grid);color:var(--sheet)}
.chip[aria-selected="true"] small,.chip[aria-pressed="true"] small{color:var(--sheet);opacity:.85}
.chip.add{border-style:dashed;color:var(--muted)}
.nameIn{font-family:var(--body);font-size:1rem;padding:6px 10px;border-radius:8px;border:2px solid var(--grid-soft);background:var(--paper);color:var(--ink);width:9em}
/* slime pet */
:root{--jelly1:#7FD3FF;--jelly2:#FF8FC0}
.wrap{max-width:1020px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:start}
.stage>.sheet{grid-column:1;grid-row:1;min-width:0}
.pet{grid-column:2;grid-row:1;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--sheet);border:2px solid var(--grid-soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.petTag{font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.petName{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.petStage{position:relative;width:100%;max-width:190px;aspect-ratio:1}
#slime{width:100%;height:100%;display:block;overflow:visible}
.lv{font-family:var(--display);color:var(--grid);font-size:1.05rem}
.lv b{font-weight:400;font-size:1.4rem}
.exp{width:100%;height:14px;border-radius:7px;background:var(--grid-soft);overflow:hidden}
.exp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jelly1),var(--jelly2));border-radius:7px;transition:width .5s}
.expTxt,.next{font-size:.85rem;color:var(--muted)}
.levelup{position:absolute;left:50%;top:2%;font-family:var(--display);font-size:1.4rem;color:var(--stamp);white-space:nowrap;background:var(--sheet);padding:2px 12px;border-radius:999px;border:2px solid var(--stamp);animation:rise 2s ease-out forwards;z-index:2}
.plus{position:absolute;right:4%;top:22%;font-family:var(--display);font-size:1.6rem;color:var(--ok);animation:float 1.3s ease-out forwards;pointer-events:none}
@keyframes float{to{transform:translateY(-44px);opacity:0}}
@keyframes rise{0%{transform:translateX(-50%) scale(.4);opacity:0}20%{transform:translateX(-50%) scale(1.15);opacity:1}80%{transform:translateX(-50%);opacity:1}100%{transform:translateX(-50%) translateY(-14px);opacity:0}}
.anim{transform-box:view-box;transform-origin:100px 180px;animation:breathe 2.4s ease-in-out infinite}
.anim.joy{animation:hop .55s ease-out 3}
.anim.sad{animation:droop 1.2s ease-in-out}
.anim.lvup{animation:grow 1.1s ease-out}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hop{0%{transform:scale(1.1,.88)}40%{transform:translateY(-26px) scale(.94,1.06)}80%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes droop{30%,70%{transform:scale(1.08,.88)}}
@keyframes grow{0%{transform:scale(.6)}50%{transform:scale(1.2)}100%{transform:none}}
.spark{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
@media (max-width:760px){
  .stage{grid-template-columns:1fr}
  .pet{grid-row:1;grid-column:1;position:static;display:grid;grid-template-columns:110px 1fr;text-align:left;align-items:center;column-gap:14px;row-gap:3px}
  .stage>.sheet{grid-row:2}
  .petStage{grid-row:1/span 6;grid-column:1}
  .pet>*:not(.petStage){grid-column:2}
}
/* effects */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.cell.hooray{animation:hooray .5s ease-out both}
@keyframes hooray{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
.grid.wobble{animation:wobble .45s ease-in-out}
@keyframes wobble{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.evolve{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(14,20,40,.78);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.evolve.show{animation:fadeIn .3s ease-out}
.evolve::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.evolve.flash::after{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.evoCard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:min(360px,100%)}
.evoRays{position:absolute;left:50%;top:130px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,226,120,.55) 0deg 10deg,rgba(255,226,120,0) 10deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%)}
.evolve.rays .evoRays{opacity:1;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.evoSlime{position:relative;width:260px;max-width:70vw;aspect-ratio:1}
.evoSvg{width:100%;height:100%;overflow:visible;display:block}
.evoSvg .anim{animation:none}
.evoSvg.shake{animation:charge 1s ease-in forwards}
@keyframes charge{0%{transform:none;filter:none}20%{transform:translateX(-5px)}30%{transform:translateX(5px)}40%{transform:translateX(-7px)}50%{transform:translateX(7px)}60%{transform:translateX(-9px)}70%{transform:translateX(9px)}100%{transform:scale(.85);filter:brightness(3) saturate(0)}}
.evoSvg.born{animation:born .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes born{0%{transform:scale(.2);filter:brightness(3)}60%{filter:brightness(1.3)}100%{transform:scale(1);filter:none}}
.evoTitle{position:relative;font-family:var(--display);font-size:2.6rem;color:#FFE27A;text-shadow:0 3px 0 #B5651D,0 0 18px rgba(255,210,90,.7);min-height:1.2em}
.evoTitle.go{animation:titlePop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes titlePop{from{transform:scale(.3);opacity:0}}
.evoSub{position:relative;font-family:var(--display);font-size:1.35rem;color:#fff;min-height:1.5em;text-wrap:balance}
.evolve .primary{position:relative;background:#FFE27A;color:#3A2878}
@media (max-width:480px){.stamp{width:88px;height:88px;font-size:1.05rem;right:10px;top:10px}.key{font-size:1.5rem;height:52px}.row{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}}
/* touch */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kbd{user-select:none;-webkit-user-select:none}
.headBtns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 가로 태블릿: 한 화면에 모두 ---------- */
@media (orientation:landscape) and (min-width:820px) and (min-height:560px){
  :root,body{height:100%;box-sizing:border-box}
  body{padding-block:10px;overflow:hidden}
  .wrap{max-width:1360px;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 250px;
    grid-template-rows:auto minmax(0,1fr) auto;gap:10px 14px}
  header{grid-column:1/-1;grid-row:1}
  h1{font-size:1.55rem}
  h1 small{display:inline;margin-left:10px}
  .stage{display:contents}
  .stage>.sheet{grid-column:1;grid-row:2;min-height:0;overflow:auto;padding:12px 18px 14px;gap:10px}
  .pet{grid-column:2;grid-row:2;position:static;align-self:stretch;justify-content:center;min-height:0;overflow:hidden;padding:10px}
  .petStage{max-width:min(230px,34vh)}
  .kbd{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:8fr 7fr 2.1fr;grid-template-rows:repeat(3,auto);gap:6px 14px}
  .kbd .rowlab{display:none}
  #consRow{grid-column:1;grid-row:1/4;grid-template-columns:repeat(8,1fr);grid-auto-rows:var(--kh)}
  #punctRow{grid-column:1;grid-row:3;align-self:end;justify-self:end;width:calc(50% - 3px);grid-template-columns:repeat(4,1fr);grid-auto-rows:var(--kh)}
  #vowRow{grid-column:2;grid-row:1/4;grid-template-columns:repeat(7,1fr);grid-auto-rows:var(--kh)}
  .ctrl{grid-column:3;grid-row:1/4;grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
  .ctrl .key{height:auto}
  .wrap{--kh:clamp(46px,7.6vh,60px)}
  .key{height:100%;font-size:clamp(1.4rem,3.6vh,1.9rem)}
  .grid{--c:clamp(52px,11vh,88px)}
  #grid{margin-block:auto}
  .answer .grid{--c:clamp(28px,5vh,40px)}
  .msg{font-size:1.15rem;min-height:1.3em}
  .stamp{width:96px;height:96px;font-size:1.15rem;top:10px;right:12px}
  /* 급수 고르기를 헤더 안으로 */
  header{display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
  header h1{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .headBtns{flex-wrap:nowrap;flex:0 0 auto}
  .levelsInHead .levelsLab{display:none}
  .levelsInHead{display:flex!important;flex:1 1 auto;min-width:0;justify-content:center}
  .levelsInHead .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{padding:6px 14px;font-size:1rem;white-space:nowrap}
  /* 선생님 설정은 가운데 창으로 */
  .drawer{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 40px));max-height:calc(100% - 40px);overflow:auto;
    box-shadow:0 0 0 100vmax rgba(14,20,30,.55);border-style:solid;box-sizing:border-box}
  .drawer textarea{min-height:160px}
}
@media (orientation:landscape) and (max-width:1120px){h1 small{display:none}}
.cell.pad{border-color:var(--grid-soft)}
.cell:not(.pad){z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>받아쓰기 연습장<small>잘 듣고, 자음과 모음을 눌러 문장을 써 보세요</small></h1>
    <nav class="levels levelsInHead" aria-label="급수 고르기">
      <span class="levelsLab">급수</span>
      <div class="chips" id="levelChips"></div>
    </nav>
    <div class="headBtns">
      <button class="ghost" id="fsBtn" hidden>전체 화면</button>
      <button class="ghost" id="teacherBtn" aria-expanded="false">선생님 설정</button>
    </div>
  </header>

  <section class="drawer" id="drawer" hidden>
    <h2>급수별 문제 입력</h2>
    <p>급수를 고른 뒤 한 줄에 한 문제씩 써 주세요. 띄어쓰기와 문장부호(. , ? !)도 그대로 채점합니다. 저장한 문제는 이 기기의 브라우저에 남습니다.</p>
    <div class="chips" id="editChips" role="tablist" aria-label="편집할 급수"></div>
    <div class="opts">
      <label for="groupName">급수 이름 <input id="groupName" type="text" maxlength="12" class="nameIn"></label>
      <button class="ghost" id="delGroupBtn">이 급수 지우기</button>
    </div>
    <textarea id="wordList" spellcheck="false" aria-label="받아쓰기 문제 목록"></textarea>
    <div class="opts">
      <label for="modeSel">연습 방식
        <select id="modeSel">
          <option value="listen">듣고 쓰기</option>
          <option value="see">보고 쓰기</option>
        </select>
      </label>
      <label><input type="checkbox" id="shuffleChk"> 순서 섞기</label>

<script>
(function(){
/* ---------- 한글 조합 ---------- */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const CV={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const CF={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const SPLIT={}; for(const k in CF) SPLIT[CF[k]]=[k[0],k[1]];
const isV=k=>JUNG.includes(k), isC=k=>CHO.includes(k);
function render(c){
  if(c.cho&&c.jung) return String.fromCharCode(0xAC00+(CHO.indexOf(c.cho)*21+JUNG.indexOf(c.jung))*28+JONG.indexOf(c.jong||""));
  return c.cho||c.jung;
}
// 누른 순서(keys)로부터 글자를 처음부터 다시 조합 → 지우기는 마지막 자모 하나만 빼면 됨
function compose(keys){
  let out=[],c=null;
  const flush=()=>{if(c){out.push(render(c));c=null;}};
  for(const k of keys){
    if(isV(k)){
      if(!c) c={jung:k};
      else if(c.jong){const sp=SPLIT[c.jong];
        if(sp){c.jong=sp[0];flush();c={cho:sp[1],jung:k};}
        else{const j=c.jong;c.jong=null;flush();c={cho:j,jung:k};}}
      else if(c.jung){const cv=CV[c.jung+k]; if(cv) c.jung=cv; else{flush();c={jung:k};}}
      else c.jung=k;
    }else if(isC(k)){
      if(!c) c={cho:k};
      else if(!c.jung||!c.cho){flush();c={cho:k};}
      else if(!c.jong){ if(JONG.includes(k)) c.jong=k; else{flush();c={cho:k};} }
      else{const cf=CF[c.jong+k]; if(cf) c.jong=cf; else{flush();c={cho:k};}}
    }else{flush();out.push(k);}
  }
  const composing=!!c; flush();
  return {chars:out,composing};
}

/* ---------- 문제 / 저장 ---------- */
// 예시 급수표 (선생님이 바꿔 쓰는 용도)
const SAMPLE=[
  {name:"1급",items:["나무","학교에 가요.","우리 엄마","예쁜 꽃","친구야 안녕"]},
  {name:"2급",items:["나무에 새가 앉았어요.","강아지가 멍멍 짖어요.","맛있는 사과를 먹어요.","하늘이 참 맑아요.","할머니께 인사해요."]},
  {name:"3급",items:["꽃이 활짝 피었습니다.","엄마와 시장에 갔어요.","놀이터에서 그네를 탔어요.","책을 읽고 있어요.","동생과 함께 놀았어요."]}
];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clone=g=>g.map(x=>({name:x.name,items:x.items.slice()}));
let groups=null;
try{groups=JSON.parse(store.get("bd_groups")||"null")}catch(e){}
if(!Array.isArray(groups)||!groups.length){
  let old=null;try{old=JSON.parse(store.get("bd_words")||"null")}catch(e){}
  groups=Array.isArray(old)&&old.length?[{name:"1급",items:old}]:clone(SAMPLE);
}
let cur=Math.min(parseInt(store.get("bd_cur")||"0",10)||0,groups.length-1);
const curList=()=>groups[cur].items;
let mode=store.get("bd_mode")||"listen";
let shuffle=store.get("bd_shuffle")==="1";

const $=id=>document.getElementById(id);
const norm=s=>s.replace(/\s+/g," ").trim();

let queue=[],idx=0,keys=[],results=[],checked=false,tries=0,awarded=[];

/* ---------- 슬라임 키우기 ---------- */
const PER=5; // 레벨 하나에 필요한 젤리
const STAGES=[
  {name:"물방울 슬라임",c1:"#B9E4FF",c2:"#4FA8E8",s:.6},
  {name:"말랑 슬라임",c1:"#A8DCFF",c2:"#3E8FDA",s:.7,cheeks:1},
  {name:"리본 슬라임",c1:"#FFC2D8",c2:"#EE6A9A",s:.78,cheeks:1,bow:1},
  {name:"새싹 슬라임",c1:"#C6F2B0",c2:"#5BB648",s:.84,cheeks:1,sprout:1},
  {name:"반짝 슬라임",c1:"#FFEFA6",c2:"#F0AE1C",s:.88,cheeks:1,sparkle:1},
  {name:"마법사 슬라임",c1:"#D6C6FF",c2:"#7C5CE0",s:.92,cheeks:1,hat:1,sparkle:1},
  {name:"천사 슬라임",c1:"#F2FAFF",c2:"#8FC0EA",s:.95,cheeks:1,wings:1,halo:1},
  {name:"왕 슬라임",c1:"#FFD0A0",c2:"#E5702A",s:.98,cheeks:1,crown:1,cape:1,sparkle:1},
  {name:"무지개 킹 슬라임",rainbow:1,s:1,cheeks:1,crown:1,wings:1,sparkle:1}
];
let exp=parseInt(store.get("bd_exp")||"0",10)||0;
const lvOf=e=>Math.floor(e/PER)+1;
function slimeSVG(st,mood,gid="sg"){
  const s=st.s;
  const grad=st.rainbow
    ?`<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A8A"/><stop offset=".25" stop-color="#FFD36B"/><stop offset=".5" stop-color="#8BE38B"/><stop offset=".75" stop-color="#7EC8FF"/><stop offset="1" stop-color="#C79BFF"/></linearGradient>`
    :`<radialGradient id="${gid}" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="${st.c1}"/><stop offset="1" stop-color="${st.c2}"/></radialGradient>`;
  let back="",top="";
  if(st.cape) back+=`<path d="M52 104 L148 104 L176 178 L24 178 Z" fill="#C9402F"/><path d="M52 104 L148 104 L150 112 L50 112Z" fill="#F2C14E"/>`;
  if(st.wings) back+=`<g fill="#FFFFFF" stroke="#A9CBE8" stroke-width="3" stroke-linejoin="round"><path d="M46 116 C10 104 2 70 18 62 C26 84 42 92 58 98 Z"/><path d="M46 130 C14 126 6 102 14 94 C24 112 40 116 56 116 Z"/><path d="M154 116 C190 104 198 70 182 62 C174 84 158 92 142 98 Z"/><path d="M154 130 C186 126 194 102 186 94 C176 112 160 116 144 116 Z"/></g>`;
  const eyes=mood==="joy"
    ?`<path d="M68 128 Q78 116 88 128 M112 128 Q122 116 132 128" fill="none" stroke="#1E2A23" stroke-width="5" stroke-linecap="round"/>`
    :`<g fill="#1E2A23"><ellipse cx="78" cy="126" rx="7.5" ry="10"/><ellipse cx="122" cy="126" rx="7.5" ry="10"/></g><g fill="#fff"><circle cx="80.5" cy="122" r="3"/><circle cx="124.5" cy="122" r="3"/></g>`;
  const mouth=mood==="joy"?`<path d="M88 142 Q100 162 112 142 Z" fill="#8A2B2B"/>`
    :mood==="sad"?`<path d="M90 154 Q100 145 110 154" fill="none" stroke="#1E2A23" stroke-width="4" stroke-linecap="round"/>`
    :`<path d="M90 145 Q100 154 110 145" fill="none" stroke="#1E2A23" stroke-width="4" stroke-linecap="round"/>`;
  const tear=mood==="sad"?`<path d="M134 132 Q139 143 134 147 Q129 143 134 132Z" fill="#7EC8FF"/>`:"";
  const cheeks=st.cheeks?`<g fill="#FF6F91" opacity=".45"><ellipse cx="62" cy="142" rx="9" ry="5.5"/><ellipse cx="138" cy="142" rx="9" ry="5.5"/></g>`:"";
  if(st.bow) top+=`<g transform="translate(62 80) rotate(-18)"><path d="M0 0 L-20 -12 L-20 12 Z M0 0 L20 -12 L20 12 Z" fill="#E8457A"/><circle r="6" fill="#C42E62"/></g>`;
  if(st.sprout) top+=`<path d="M100 64 C100 54 100 46 100 38" stroke="#3E8E3A" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M100 44 C88 30 74 34 72 40 C82 46 92 46 100 44Z M100 42 C112 26 128 30 130 36 C120 44 108 44 100 42Z" fill="#5DBB4A"/>`;
  if(st.halo) top+=`<ellipse cx="100" cy="38" rx="28" ry="7" fill="none" stroke="#F2C14E" stroke-width="5"/>`;
  if(st.hat) top+=`<path d="M68 72 L104 6 L134 72 Z" fill="#4B3399"/><path d="M71 64 L131 64 L134 72 L68 72Z" fill="#F2C14E"/><ellipse cx="100" cy="72" rx="44" ry="8" fill="#3A2878"/><path d="M104 30 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#FFE88A"/>`;
  if(st.crown) top+=`<path d="M70 70 L72 36 L88 54 L100 28 L112 54 L128 36 L130 70 Z" fill="#F2C14E" stroke="#C98F12" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="57" r="5" fill="#E8457A"/><circle cx="82" cy="62" r="3.5" fill="#4FA8E8"/><circle cx="118" cy="62" r="3.5" fill="#4FA8E8"/>`;
  const spark=st.sparkle?[[22,58,1],[178,44,.8],[184,128,.6],[14,136,.7]].map(([x,y,k],i)=>`<path class="spark" style="animation-delay:${i*.4}s" transform="translate(${x} ${y}) scale(${k})" d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10Z" fill="#FFC93C"/>`).join(""):"";
  return `<defs>${grad}</defs><ellipse cx="100" cy="183" rx="${(66*s).toFixed(1)}" ry="7" style="fill:var(--grid-soft)"/>${spark}<g class="anim"><g transform="translate(100 180) scale(${s}) translate(-100 -180)">${back}<path d="M26 178 C20 122 56 64 100 62 C144 64 180 122 174 178 Q100 190 26 178Z" fill="url(#${gid})"/><ellipse cx="68" cy="96" rx="15" ry="8" fill="#fff" opacity=".55" transform="rotate(-32 68 96)"/>${eyes}${mouth}${cheeks}${tear}${top}</g></g>`;
}
let moodT;
function drawPet(mood,animCls){
  const lv=lvOf(exp),st=STAGES[Math.min(lv-1,STAGES.length-1)];
  $("slime").innerHTML=slimeSVG(st,mood||"idle");
  if(animCls) $("slime").querySelector(".anim").classList.add(animCls);
  $("petName").textContent=st.name;$("petLv").textContent=lv;
  const w=exp%PER;$("expBar").style.width=(w/PER*100)+"%";$("expTxt").textContent=`젤리 ${w} / ${PER}`;
  $("petNext").textContent=lv<STAGES.length?`다음 모습: ${STAGES[lv].name}`:"최고 모습이 되었어요!";
  clearTimeout(moodT);
  if(mood&&mood!=="idle") moodT=setTimeout(()=>drawPet(),1900);
}
function floatText(txt,cls){
  const el=document.createElement("div");el.className=cls;el.textContent=txt;
  $("petStage").appendChild(el);setTimeout(()=>el.remove(),2100);
}
const stageOf=lv=>STAGES[Math.min(lv-1,STAGES.length-1)];
function gain(n){
  const before=lvOf(exp);exp+=n;store.set("bd_exp",String(exp));
  floatText(`+${n} 젤리`,"plus");
  if(lvOf(exp)>before){
    $("msg").textContent+=` 슬라임이 레벨 업 했어요!`;
    drawPet("joy","joy");
    setTimeout(()=>evolve(before,lvOf(exp)),900);
  }else drawPet("joy","joy");
}

/* ---------- 효과음 ---------- */
let actx=null;
function tone(freq,t0,dur,type="triangle",vol=.18){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+t0;
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sndCorrect=()=>{[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,i*.09,.35));};
const sndJelly=()=>{tone(880,0,.12,"sine",.12);tone(1320,.08,.18,"sine",.1);};
const sndWrong=()=>{tone(330,0,.25,"sine",.12);tone(262,.18,.35,"sine",.12);};
const sndCharge=()=>{for(let i=0;i<10;i++)tone(400+i*70,i*.08,.12,"square",.05);};
const sndFanfare=()=>{[[523.3,0,.2],[659.3,.15,.2],[784,.3,.2],[1046.5,.45,.7],[784,.45,.7],[659.3,.45,.7]].forEach(([f,t,d])=>tone(f,t,d,"triangle",.14));};

/* ---------- 색종이 ---------- */
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const COLORS=["#FF6F91","#FFC93C","#5BB648","#4FA8E8","#7C5CE0","#FF8A3D"];
function burst(x,y,count,spread,star){
  if(reduce)return;
  const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,v=(Math.random()*.6+.4)*spread;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spread*.55,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,
      w:6+Math.random()*7,h:4+Math.random()*5,c:COLORS[i%COLORS.length],life:0,max:70+Math.random()*50,star:star&&Math.random()<.5});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function starPath(r){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.closePath();}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<p.max);
  for(const p of parts){
    p.life++;p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.globalAlpha=Math.min(1,(p.max-p.life)/25);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.star){starPath(p.w*.9);cx.fill();}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}
function burstFrom(el,count,spread,star){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,count,spread,star);}

/* ---------- 진화 연출 ---------- */
let evoT=[];
function evolve(fromLv,toLv){
  const a=stageOf(fromLv),b=stageOf(toLv),ov=$("evolve"),box=$("evoSlime");
  evoT.forEach(clearTimeout);evoT=[];
  const changed=a.name!==b.name;
  $("evoTitle").textContent="";$("evoSub").textContent="";$("evoOk").hidden=true;
  box.innerHTML=`<svg viewBox="0 0 200 200" class="evoSvg shake">${slimeSVG(a,"idle","eg1")}</svg>`;
  ov.className="evolve show";ov.hidden=false;
  sndCharge();
  evoT.push(setTimeout(()=>{ov.classList.add("flash");},950));
  evoT.push(setTimeout(()=>{
    box.innerHTML=`<svg viewBox="0 0 200 200" class="evoSvg born">${slimeSVG(b,"joy","eg2")}</svg>`;
    ov.classList.add("rays");sndFanfare();
    $("evoTitle").textContent=`레벨 ${toLv}!`;
    const tt=$("evoTitle");tt.classList.remove("go");void tt.offsetWidth;tt.classList.add("go");
    $("evoSub").textContent=changed?`${b.name}(으)로 진화했어요!`:`${b.name}이(가) 더 강해졌어요!`;
    $("evoOk").hidden=false;
    burst(innerWidth/2,innerHeight*.42,140,15,true);
    drawPet("joy","lvup");
  },1250));
  evoT.push(setTimeout(()=>burst(innerWidth*.25,innerHeight*.5,60,11,true),1700));
  evoT.push(setTimeout(()=>burst(innerWidth*.75,innerHeight*.5,60,11,true),2000));
  evoT.push(setTimeout(closeEvolve,6000));
}
function closeEvolve(){evoT.forEach(clearTimeout);evoT=[];$("evolve").hidden=true;$("evolve").className="evolve";}

function start(list){
  queue=list.map(norm).filter(Boolean);
  if(shuffle) queue.sort(()=>Math.random()-.5);
  idx=0;results=[];awarded=[];
  $("result").hidden=true;$("practice").hidden=false;$("kbd").hidden=false;
  loadQ();
}
function loadQ(){
  keys=[];checked=false;tries=0;
  $("qNow").textContent=idx+1;$("qTotal").textContent="/ "+queue.length;
  $("msg").textContent="";$("msg").className="msg";
  $("answerBox").hidden=true;$("afterActions").hidden=true;$("stamp").hidden=true;
  const see=mode==="see";
  $("hint").hidden=!see;$("hint").textContent=see?queue[idx]:"";
  $("speakBtn").innerHTML=see?"🔊 읽어 주기":"🔊 문제 듣기";
  drawProgress();draw();
}
function drawProgress(){
  $("progress").innerHTML=queue.map((_,i)=>{
    const r=results[i];return `<i class="${r===true?"ok":r===false?"bad":i===idx?"now":""}"></i>`}).join("");
}
function padRow(g,n){
  const t=document.createElement("div");t.className="cell";g.appendChild(t);
  const c=t.getBoundingClientRect().width||50;t.remove();
  const cols=Math.max(1,Math.floor((g.clientWidth-1.5)/(c-1.5)));
  return Math.max(cols,Math.ceil(n/cols)*cols);
}
function markPad(g,n){[...g.children].forEach((el,i)=>{if(i>=n)el.classList.add("pad");});}
function cellsFor(chars,n){
  let h="";for(let i=0;i<n;i++){const ch=chars[i]??"";h+=`<div class="cell">${ch===" "?"":esc(ch)}</div>`}return h;
}
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[m]);
function draw(marks){
  const {chars,composing}=compose(keys);
  const ans=queue[idx]||"";
  const n=Math.max(ans.length,chars.length+(checked?0:1));
  const g=$("grid");g.innerHTML=cellsFor(chars,padRow(g,n));markPad(g,n);
  const cells=g.children;
  if(!checked){
    if(composing&&chars.length) cells[chars.length-1].classList.add("composing");
    if(cells[chars.length]) cells[chars.length].classList.add("cursor");
  }
  if(marks) marks.forEach((m,i)=>cells[i]&&cells[i].classList.add(m?"ok":"bad"));
}

/* ---------- 입력 ---------- */
function press(k){
  if(checked) return;
  keys.push(k);draw();
}
function back(){if(checked)return;keys.pop();draw();}
function check(){
  if(checked) return;
  const typed=norm(compose(keys).chars.join(""));
  const ans=queue[idx];
  if(!typed){$("msg").textContent="먼저 문장을 써 보세요.";$("msg").className="msg";return;}
  checked=true;tries++;
  const n=Math.max(ans.length,typed.length),marks=[];
  for(let i=0;i<n;i++) marks.push(typed[i]===ans[i]);
  keys=[...typed]; // 공백 정리된 상태로 보여 주기
  const right=typed===ans;
  // 칸을 정리된 글자로 다시 그림
  const g=$("grid");g.innerHTML=cellsFor([...typed],padRow(g,n));markPad(g,n);
  [...g.children].forEach((c,i)=>{if(i<n)c.classList.add(marks[i]?"ok":"bad");});
  const first=results[idx]===undefined;
  if(first) results[idx]=right;
  drawProgress();
  if(right){
    $("msg").textContent=tries>1?"고쳐서 맞혔어요!":"딩동댕! 맞았어요!";$("msg").className="msg ok";
    sndCorrect();setTimeout(sndJelly,450);
    [...$("grid").children].filter(c=>!c.classList.contains("pad")).forEach((c,i)=>{c.style.animationDelay=(i*45)+"ms";c.classList.add("hooray");});
    burstFrom($("grid"),90,13,true);setTimeout(()=>burstFrom($("stamp"),40,9,false),250);
    const s=$("stamp");s.hidden=false;s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");
    $("retryBtn").hidden=true;
    if(!awarded[idx]){awarded[idx]=1;gain(first?2:1);}
  }else{
    drawPet("sad","sad");sndWrong();$("grid").classList.remove("wobble");void $("grid").offsetWidth;$("grid").classList.add("wobble");
    const wrong=marks.filter(m=>!m).length;
    $("msg").textContent=`빨간 동그라미 ${wrong}칸을 다시 살펴봐요.`;$("msg").className="msg bad";
    $("answerGrid").innerHTML=cellsFor([...ans],ans.length);$("answerBox").hidden=false;
    $("retryBtn").hidden=false;
  }
  $("nextBtn").textContent=idx===queue.length-1?"결과 보기":"다음 문제";
  $("afterActions").hidden=false;
}
function retry(){
  keys=[];checked=false;$("answerBox").hidden=true;$("afterActions").hidden=true;
  $("msg").textContent="";draw();speak(.75);
}
function next(){
  if(idx<queue.length-1){idx++;loadQ();setTimeout(()=>{if(mode==="listen")speak(.8)},250);}
  else showResult();
}
function showResult(){
  $("practice").hidden=true;$("kbd").hidden=true;$("result").hidden=false;
  const ok=results.filter(r=>r===true).length,total=queue.length;
  $("resultLab").textContent=groups[cur].name+" 받아쓰기 결과";
  $("score").innerHTML=`${ok}<span> / ${total} 문제</span>`;
  const wrong=queue.filter((_,i)=>results[i]===false);
  $("wrongWrap").innerHTML=wrong.length?`<div style="color:var(--muted);font-size:.9rem;margin-bottom:4px">다시 연습할 문장</div><ul class="wronglist">${wrong.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:"<div class='msg ok'>모두 맞혔어요! 정말 멋져요.</div>";
  $("redoWrongBtn").hidden=!wrong.length;
  const fs=$("finalStamp");fs.hidden=ok!==total;if(!fs.hidden){fs.classList.remove("pop");void fs.offsetWidth;fs.classList.add("pop");}
}

/* ---------- 소리 ---------- */
function speak(rate){
  const t=queue[idx];if(!t)return;
  try{
    const ss=window.speechSynthesis;if(!ss){peek();return;}
    ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=rate||.8;
    const v=ss.getVoices().find(v=>/ko/i.test(v.lang));if(v)u.voice=v;
    ss.speak(u);
  }catch(e){peek();}
}
let peekT;
function peek(){
  const h=$("hint");h.textContent=queue[idx];h.hidden=false;clearTimeout(peekT);
  peekT=setTimeout(()=>{if(mode==="listen")h.hidden=true},2000);
}

/* ---------- 키보드 그리기 ---------- */
const CONS=["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","ㄲ","ㄸ","ㅃ","ㅆ","ㅉ"];
const VOWS=["ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ","ㅐ","ㅒ","ㅔ","ㅖ","ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ"];
const PUNCT=[".",",","?","!"];
const mk=(arr,cls,row)=>{$(row).innerHTML=arr.map(k=>`<button class="key ${cls}" data-k="${k}" aria-label="${k}">${k}</button>`).join("")};
mk(CONS,"c","consRow");mk(VOWS,"v","vowRow");mk(PUNCT,"p","punctRow");
$("kbd").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)press(b.dataset.k);});
$("bsBtn").onclick=back;$("spaceBtn").onclick=()=>press(" ");$("checkBtn").onclick=check;
$("speakBtn").onclick=()=>speak(.85);$("slowBtn").onclick=()=>speak(.55);
$("retryBtn").onclick=retry;
try{
  if(document.fullscreenEnabled){
    const fb=$("fsBtn");fb.hidden=false;
    fb.onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{fb.hidden=true;});}catch(e){fb.hidden=true;}};
    document.addEventListener("fullscreenchange",()=>{fb.textContent=document.fullscreenElement?"전체 화면 끄기":"전체 화면";});
  }
}catch(e){}$("evoOk").onclick=closeEvolve;$("nextBtn").onclick=next;
$("restartBtn").onclick=()=>start(curList());
$("redoWrongBtn").onclick=()=>start(queue.filter((_,i)=>results[i]===false));

// 실제 키보드(두벌식)도 지원
const QW={q:"ㅂ",w:"ㅈ",e:"ㄷ",r:"ㄱ",t:"ㅅ",y:"ㅛ",u:"ㅕ",i:"ㅑ",o:"ㅐ",p:"ㅔ",a:"ㅁ",s:"ㄴ",d:"ㅇ",f:"ㄹ",g:"ㅎ",h:"ㅗ",j:"ㅓ",k:"ㅏ",l:"ㅣ",z:"ㅋ",x:"ㅌ",c:"ㅊ",v:"ㅍ",b:"ㅠ",n:"ㅜ",m:"ㅡ",Q:"ㅃ",W:"ㅉ",E:"ㄸ",R:"ㄲ",T:"ㅆ",O:"ㅒ",P:"ㅖ"};
document.addEventListener("keydown",e=>{
  if(e.target.closest("textarea,select,input")||$("practice").hidden||e.ctrlKey||e.metaKey||e.altKey) return;
  let k=e.key;
  if(k==="Backspace"){e.preventDefault();back();return;}
  if(k===" "){e.preventDefault();press(" ");return;}
  if(k==="Enter"){e.preventDefault();checked?next():check();return;}
  if(QW[k]) k=QW[k]; else if(QW[k.toLowerCase()]&&!e.shiftKey) k=QW[k.toLowerCase()];
  if(isC(k)||isV(k)||PUNCT.includes(k)){e.preventDefault();press(k);}
});

/* ---------- 급수 고르기 ---------- */
function drawLevels(){
  $("levelChips").innerHTML=groups.map((g,i)=>`<button class="chip" data-g="${i}" aria-pressed="${i===cur}">${esc(g.name)} <small>${g.items.length}문제</small></button>`).join("");
}
$("levelChips").addEventListener("click",e=>{
  const b=e.target.closest("[data-g]");if(!b)return;
  cur=+b.dataset.g;store.set("bd_cur",String(cur));drawLevels();start(curList());
});

/* ---------- 선생님 설정 ---------- */
let draft=[],edit=0;
function syncDraft(){
  if(!draft[edit])return;
  draft[edit].items=$("wordList").value.split("\n").map(norm).filter(Boolean);
  draft[edit].name=$("groupName").value.trim()||`${edit+1}급`;
}
function drawEditor(){
  $("editChips").innerHTML=draft.map((g,i)=>`<button class="chip" role="tab" data-e="${i}" aria-selected="${i===edit}">${esc(g.name)} <small>${g.items.length}</small></button>`).join("")
    +`<button class="chip add" id="addGroupBtn">+ 급수 추가</button>`;
  $("groupName").value=draft[edit].name;
  $("wordList").value=draft[edit].items.join("\n");
  $("delGroupBtn").hidden=draft.length<2;
}
$("editChips").addEventListener("click",e=>{
  if(e.target.closest("#addGroupBtn")){syncDraft();draft.push({name:`${draft.length+1}급`,items:[]});edit=draft.length-1;drawEditor();$("wordList").focus();return;}
  const b=e.target.closest("[data-e]");if(!b)return;
  syncDraft();edit=+b.dataset.e;drawEditor();
});
$("groupName").addEventListener("input",()=>{syncDraft();const c=$("editChips").children[edit];if(c)c.firstChild.textContent=draft[edit].name+" ";});
$("wordList").addEventListener("input",()=>{const c=$("editChips").children[edit];if(c)c.querySelector("small").textContent=$("wordList").value.split("\n").map(norm).filter(Boolean).length;});
let delArmed=false;
$("delGroupBtn").onclick=()=>{
  if(!delArmed){delArmed=true;$("delGroupBtn").textContent=`${draft[edit].name}을(를) 지울까요? 한 번 더 누르세요`;
    setTimeout(()=>{delArmed=false;$("delGroupBtn").textContent="이 급수 지우기";},4000);return;}
  delArmed=false;$("delGroupBtn").textContent="이 급수 지우기";
  draft.splice(edit,1);edit=Math.max(0,edit-1);drawEditor();
};
function openDrawer(open){
  $("drawer").hidden=!open;$("teacherBtn").setAttribute("aria-expanded",open);
  $("teacherBtn").textContent=open?"설정 닫기":"선생님 설정";
  if(open){draft=clone(groups);edit=cur;drawEditor();$("modeSel").value=mode;$("shuffleChk").checked=shuffle;$("savedMsg").hidden=true;}
}
$("teacherBtn").onclick=()=>openDrawer($("drawer").hidden);
$("sampleBtn").onclick=()=>{draft=clone(SAMPLE);edit=0;drawEditor();};
$("saveBtn").onclick=()=>{
  syncDraft();
  const kept=draft.filter(g=>g.items.length);
  if(!kept.length){$("savedMsg").textContent="문제를 한 개 이상 써 주세요.";$("savedMsg").style.color="var(--bad)";$("savedMsg").hidden=false;return;}
  const editing=draft[edit];
  groups=kept;cur=Math.max(0,groups.indexOf(editing));
  mode=$("modeSel").value;shuffle=$("shuffleChk").checked;
  store.set("bd_groups",JSON.stringify(groups));store.set("bd_cur",String(cur));store.set("bd_mode",mode);store.set("bd_shuffle",shuffle?"1":"0");
  openDrawer(false);drawLevels();start(curList());
};

let resetArmed=false;
$("petResetBtn").onclick=()=>{
  if(!resetArmed){resetArmed=true;$("petResetBtn").textContent="정말요? 한 번 더 누르면 Lv.1이 돼요";
    setTimeout(()=>{resetArmed=false;$("petResetBtn").textContent="슬라임 처음부터 키우기";},4000);return;}
  resetArmed=false;exp=0;store.set("bd_exp","0");drawPet("joy","lvup");
  $("petResetBtn").textContent="슬라임 처음부터 키우기";
};

drawPet();
drawLevels();
start(curList());
let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!checked)draw();},150);});
})();
</script>

</body></html>
