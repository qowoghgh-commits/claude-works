<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>우리 집 냥이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 놀이방: 위 = 냥이 마음 게이지, 가운데 = 방(캔버스), 아래 = 집사 도구 */
:root{
  --plum:#43285a; --plum-soft:#7a5b95; --lav:#efe7fb; --mint:#8fdcc4;
  --butter:#ffd95e; --pink:#ff6f9c; --sky:#7cc8ff; --paper:#ffffff;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--lav);color:var(--plum);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);color:var(--plum);cursor:pointer}
button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

#top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);
  border-bottom:3px solid var(--plum);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#who{display:flex;align-items:center;gap:8px;min-width:0}
#nm{font-size:26px;white-space:nowrap}
.chip{font-size:15px;background:var(--lav);border:2px solid var(--plum);border-radius:999px;padding:3px 10px;white-space:nowrap}
#hearts{background:#ffe3ec}
#hearts.pop{animation:pop .35s}
#gauges{display:flex;gap:8px;flex:1;justify-content:center;min-width:0}
.g{display:flex;align-items:center;gap:5px;background:var(--lav);border:2px solid var(--plum);border-radius:999px;padding:3px 9px 3px 3px;min-width:0}
.g .ic{font-size:19px;width:30px;height:30px;display:grid;place-items:center;background:#fff;border-radius:50%;flex:none}
.g .bar{width:62px;height:13px;border-radius:99px;background:#fff;border:2px solid var(--plum);overflow:hidden;flex:none}
.g .bar i{display:block;height:100%;width:50%;background:var(--mint);transition:width .4s}
.g.mid .bar i{background:var(--butter)}
.g.low .bar i{background:var(--pink)}
.g.low{animation:wob 1.1s infinite}
#menu{display:flex;gap:7px}
.ib{width:46px;height:46px;border-radius:15px;border:3px solid var(--plum);background:#fff;font-size:22px;
  box-shadow:0 3px 0 var(--plum);display:grid;place-items:center;padding:0}
.ib:active{transform:translateY(3px);box-shadow:none}

#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:#bfe9dc}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#caption{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);width:max-content;max-width:min(88%,620px);
  background:#fff;border:3px solid var(--plum);border-radius:22px;padding:8px 18px;font-size:22px;line-height:1.35;
  box-shadow:0 4px 0 var(--plum);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;text-wrap:balance}
#caption.on{opacity:1;transform:translate(-50%,0)}

#tools{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;background:var(--plum);padding-block:9px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tool{height:74px;border-radius:20px;border:3px solid var(--plum);background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;padding:0;min-width:0;transition:transform .12s}
.tool .e{font-size:31px;line-height:1;height:34px;display:grid;place-items:center}
.tool .e svg{width:34px;height:34px}
.tool .l{white-space:nowrap}
.tool.on{background:var(--butter);transform:translateY(-5px);box-shadow:0 10px 0 rgba(0,0,0,.35)}
.tool[data-t="light"]{background:#d9ccff}
.tool[data-t="light"].dark{background:#2c2350;color:#fff}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:rgba(67,40,90,.5);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:#fff;border:4px solid var(--plum);border-radius:30px;box-shadow:0 8px 0 var(--plum);padding:22px;
  width:min(600px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:30px;font-weight:400;text-align:center;text-wrap:balance}
.panel p{margin:0;text-align:center;font-size:17px;color:var(--plum-soft)}
.big{font-size:26px;padding:14px 30px;border-radius:22px;background:var(--pink);color:#fff;border:3px solid var(--plum);box-shadow:0 5px 0 var(--plum)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--plum)}
.big.alt{background:var(--sky);color:var(--plum)}
.x{position:sticky;top:0;align-self:flex-end;margin-bottom:-50px;width:44px;height:44px;border-radius:50%;border:3px solid var(--plum);background:#fff;font-size:22px;padding:0;z-index:1}

#mStart{background:radial-gradient(circle at 50% 35%,#fff6c9 0,#ffd6e5 45%,#d8c8f6 100%)}
#mStart .panel{background:transparent;border:0;box-shadow:none;align-items:center;text-align:center}
.logo{font-size:clamp(46px,9vw,78px);line-height:1;margin:0;color:var(--plum);text-shadow:0 4px 0 #fff,0 7px 0 var(--pink)}
.logo span{color:var(--pink);text-shadow:0 4px 0 #fff,0 7px 0 var(--plum)}
#startCv{width:230px;height:200px;max-width:100%}
#saves{display:flex;flex-direction:column;gap:8px;width:min(420px,100%)}
.save{display:flex;gap:8px;align-items:stretch}
.save .go{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--plum);border-radius:18px;padding:8px 12px;font-size:21px;box-shadow:0 4px 0 var(--plum);text-align:left}
.save .go small{font-size:14px;color:var(--plum-soft)}
.save canvas{width:52px;height:52px;flex:none}
.save .del{width:64px;border:3px solid var(--plum);border-radius:16px;background:#fff;font-size:14px;box-shadow:0 4px 0 var(--plum)}
.save .del.sure{background:var(--pink);color:#fff}

#furs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fur{border:3px solid var(--plum);border-radius:18px;background:var(--lav);padding:4px 2px 6px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fur canvas{width:100%;max-width:96px;aspect-ratio:1}
.fur.on{background:var(--butter);box-shadow:0 4px 0 var(--plum);transform:translateY(-3px)}
#nameIn{font-family:var(--font);font-size:28px;text-align:center;border:3px solid var(--plum);border-radius:18px;padding:10px;color:var(--plum);width:100%}
#nameIn:focus{outline:4px solid var(--sky)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{font-size:18px;border:2px solid var(--plum);border-radius:999px;background:#fff;padding:6px 14px}

#stickerGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stk{border:3px dashed #cbbbe0;border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.stk .se{font-size:40px;line-height:1.1;filter:grayscale(1) opacity(.25)}
.stk .sn{font-size:15px}
.stk .sh{font-size:12px;color:var(--plum-soft)}
.stk.got{border:3px solid var(--plum);background:#fff7d6;box-shadow:0 4px 0 var(--plum)}
.stk.got .se{filter:none;animation:pop .5s}

.drow h3{margin:0 0 6px;font-size:20px;font-weight:400}
.dopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dopt{border:3px solid var(--plum);border-radius:18px;background:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.dopt .sw{width:44px;height:44px;border-radius:12px;border:2px solid var(--plum);display:grid;place-items:center;font-size:26px}
.dopt.on{background:var(--butter);box-shadow:0 4px 0 var(--plum)}
.dopt .price{font-size:13px;color:var(--pink)}
.dopt.shake{animation:shake .4s}

#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);z-index:30;background:#fff;border:4px solid var(--plum);
  border-radius:28px;box-shadow:0 6px 0 var(--plum);padding:16px 26px;text-align:center;opacity:0;pointer-events:none;transition:all .3s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .te{font-size:58px;line-height:1.1}
#toast .tt{font-size:22px}

@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (max-width:760px){
  #gauges{order:3;flex-basis:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .g{padding-right:6px;gap:3px}
  .g .ic{width:24px;height:24px;font-size:15px}
  .g .bar{flex:1;width:auto;min-width:0;height:11px}
  #who{flex:1}
  #nm{font-size:22px}
  .chip{font-size:13px;padding:2px 8px}
  .ib{width:40px;height:40px;font-size:19px}
  #menu{gap:5px}
  #tools{gap:5px;padding-block:7px 8px}
  .tool{height:60px;border-radius:15px;font-size:11px}
  .tool .e{font-size:24px;height:27px}
  .tool .e svg{width:27px;height:27px}
  #caption{font-size:18px;top:8px}
  #stickerGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  #furs{gap:5px}
  .fur{font-size:13px}
  .panel{padding:18px 14px}
}
@media (max-width:420px){ #age{display:none} .tool .l{font-size:10px;letter-spacing:-.3px} }
@media (max-height:540px) and (orientation:landscape){
  #top{padding-block:4px;flex-wrap:nowrap}
  #gauges{order:0;flex-basis:auto;display:flex}
  .g .bar{width:46px;flex:none}
  .ib{width:38px;height:38px}
  #tools{padding-block:5px 6px}
  .tool{height:48px;flex-direction:row;gap:4px}
  .tool .l{display:none}
}
@media (prefers-reduced-motion:reduce){ .g.low{animation:none} }
</style>

<div id="app">
  <header id="top">

    <button class="tool" data-t="light"><span class="e" id="lightE">🌙</span><span class="l" id="lightL">불끄기</span></button>
  </nav>
</div>

  <div class="panel">

(()=>{

};

let AC=null,master=null,muted=false,purrN=null,purring=false;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);}catch(e){AC=null;}}
let NB=null;function noiseBuf(){if(NB)return NB;NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB;}
function tone(f,dur,{type='sine',vol=.2,to=null,at=0}={}){if(!AC||muted)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,{f=1500,type='bandpass',vol=.2,q=1}={}){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf();fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
function sMeow(p=1,len=1){if(!AC||muted)return;const t=AC.currentTime,pp=p*[1.35,1.15,1][S.stage||0],d=.5*len;const o=AC.createOscillator();o.type='sawtooth';const f0=470*pp;o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*1.5,t+d*.35);o.frequency.linearRampToValueAtTime(f0*.88,t+d);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=3.5;bp.frequency.setValueAtTime(900*pp,t);bp.frequency.linearRampToValueAtTime(1700*pp,t+d*.4);bp.frequency.linearRampToValueAtTime(800*pp,t+d);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+.06);g.gain.setValueAtTime(.36,t+d*.65);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(bp);bp.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
function setPurr(on){if(!AC)return;if(!purrN){const s=AC.createBufferSource();s.buffer=noiseBuf();s.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;const am=AC.createGain();am.gain.value=.5;const lfo=AC.createOscillator();lfo.frequency.value=23;const lg=AC.createGain();lg.gain.value=.5;lfo.connect(lg);lg.connect(am.gain);const g=AC.createGain();g.gain.value=0;s.connect(lp);lp.connect(am);am.connect(g);g.connect(master);s.start();lfo.start();purrN=g;}purrN.gain.setTargetAtTime(on&&!muted?1.1:0,AC.currentTime,.12);}

function setState(s,dur=0,ex){cat.state=s;cat.t=0;cat.dur=dur;cat.jump=0;cat.hit=false;if(ex)Object.assign(cat,ex);}
function go(x,y,after,o={}){cat.state='walk';cat.t=0;cat.tx=clamp(x,AREA.x0,AREA.x1);cat.ty=clamp(y,AREA.y0,AREA.y1);cat.after=after||null;cat.ess=!!o.ess;cat.spd=o.spd||1;cat.jump=0;}
const awake=()=>cat.state!=='sleep';
function interruptible(){const s=cat.state;return ['idle','groom','window','beg','bat','bump','stretch'].includes(s)||(s==='walk'&&!cat.ess);}
function meow(p=1,len=1){cat.meow=.45*len;sMeow(p,len);}

function wander(){go(rand(AREA.x0+40,AREA.x1-40),rand(AREA.y0,AREA.y1),()=>setState('idle',rand(1.5,3.5)));}
function goSleep(){go(P.cushion.x,P.cushion.y-6,()=>{cat.facing=-1;setState('sleep');S.c.sleep++;checkStickers();},{ess:true});}
function goEat(){const y=P.food.y-10;go(P.food.x-64*kAt(y),y,()=>{cat.facing=1;setState('eat');say('냠냠, 맛있게 먹어요.','eat',40);},{ess:true});}
function goDrink(){const y=P.water.y-10;go(P.water.x-64*kAt(y),y,()=>{cat.facing=1;setState('drink');},{ess:true});}
function enterLitter(){go(P.litter.x,P.litter.y-2,()=>{cat.facing=1;setState('litterSquat',2.4);},{ess:true});}
function goLitter(){
  if(S.clumps.length>=3){go(P.litter.x+150,P.litter.y+8,()=>{cat.facing=-1;setState('hesitate',5);say('화장실이 지저분해서 들어가기 싫대요. 청소해 주세요!','dirty',30);},{ess:true});}
  else enterLitter();
}
function startBall(){cat.batN=0;goBall();}
function goBall(){const side=ball.x>cat.x?1:-1;go(ball.x-side*50*kAt(ball.y),ball.y,()=>{cat.facing=ball.x>cat.x?1:-1;setState('bat',.65);},{spd:1.6});}
function comeTo(x,y,then){go(x,y,()=>{cat.facing=x>cat.x?1:-1;then();});}
function beg(kind){
  if(kind==='food'){say('밥그릇이 비었어요. 밥을 주세요!','emptyfood',35);go(P.food.x+75,P.food.y-14,()=>{cat.facing=-1;setState('beg',6,{begKind:'food',begT:0});});}
  else if(kind==='water'){say('물그릇이 비었어요. 물을 주세요!','emptywater',35);go(P.water.x+75,P.water.y-14,()=>{cat.facing=-1;setState('beg',6,{begKind:'water',begT:0});});}
  else comeTo(clamp(cam.x+viewW/2,AREA.x0,AREA.x1),600,()=>setState('beg',5,{begKind:kind,begT:0}));
}
function decide(){
  if(!S.lights)return goSleep();
  if(S.bladder>=100)return goLitter();
  if(S.energy<20)return goSleep();
  if(S.full<35)return S.foodBowl>4?goEat():beg('food');
  if(S.water<35)return S.waterBowl>4?goDrink():beg('water');
  if(S.energy<45&&Math.random()<.25)return goSleep();
  if(S.fun<35&&Math.random()<.5)return Math.random()<.5?startBall():beg('play');
  if(S.love<35&&Math.random()<.5)return beg('love');
  const r=Math.random();
  if(r<.33)return wander();
  if(r<.47)return setState('idle',rand(2,4));
  if(r<.62)return setState('groom',rand(2.5,4));
  if(r<.76)return go(P.win.x+P.win.w/2+rand(-50,50),512,()=>setState('window',rand(4,7)));
  if(r<.9)return startBall();
  if(S.full<85&&S.foodBowl>4)return goEat();
  wander();
}
function featherActive(){return tool==='play'&&(ptr.down||(ptr.mouse&&ptr.show)||now<feather.hideAt);}
function catK(){return kAt(cat.y);}
function pounce(){const k=catK(),headY=cat.y-82*k,jh=clamp(headY-feather.y+10,18,240);
  setState('pounce',.45+jh/900,{j:{x0:cat.x,x1:clamp(feather.x-cat.facing*36*k,AREA.x0,AREA.x1),h:jh}});sBoing();}

function updateCat(dt){
  const c=cat;c.t+=dt;c.meow=Math.max(0,c.meow-dt);
  c.nextBlink-=dt;if(c.nextBlink<=0){c.blink=.14;c.nextBlink=rand(2,5);}if(c.blink>0)c.blink-=dt;
  const fa=featherActive();
  if(fa&&S.lights&&interruptible()){setState('chase');c.stalk=0;}
  if(S.bladder>=115&&!['litterSquat','litterCover','hesitate','sleep'].includes(c.state)&&!(c.state==='walk'&&c.ess))goLitter();
  switch(c.state){
  case 'walk':{const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy),sp=110*c.spd*catK();
    if(d<=sp*dt+.5){c.x=c.tx;c.y=c.ty;const a=c.after;c.after=null;if(a)a();else setState('idle',rand(1.5,3));}
    else{c.x+=dx/d*sp*dt;c.y+=dy/d*sp*dt;if(Math.abs(dx)>3)c.facing=dx>0?1:-1;c.phase+=dt*(8+4*c.spd);}break;}
  case 'idle':if(c.t>c.dur)decide();break;
  case 'groom':if(c.t>c.dur)setState('idle',rand(1,2));break;
  case 'window':if(c.t>c.dur)decide();break;
  case 'stretch':if(c.t>c.dur)decide();break;
  case 'bump':if(c.t>c.dur)decide();break;
  case 'beg':
    c.begT-=dt;if(c.begT<=0){meow(1.05);c.begT=2.6;}
    if(c.begKind==='food'&&S.foodBowl>4){goEat();break;}
    if(c.begKind==='water'&&S.waterBowl>4){goDrink();break;}
    if(c.t>c.dur)decide();break;
  case 'petted':if(now>c.petUntil)setState('idle',rand(1,2));break;
  case 'sleep':
    S.energy=Math.min(100,S.energy+2.6*dt);
    c.zT-=dt;if(c.zT<=0){c.zT=1.3;const h=headWorld();parts.push({type:'z',x:h.x+12,y:h.y-20,vx:18,vy:-26,life:0,max:2.2,s:16+Math.random()*8,rot:0,vr:0});}
    if(S.lights&&S.energy>=100){setState('stretch',1.4);meow(1,1.3);say(`${voc()}, 잘 잤니?`,'wake',30);}
    break;
  case 'eat':
    c.facing=1;if(Math.floor(c.t/.3)!==Math.floor((c.t-dt)/.3))sCrunch();
    if(S.foodBowl>0){S.full=Math.min(100,S.full+15*dt);S.foodBowl=Math.max(0,S.foodBowl-11*dt);S.gut+=5*dt;}
    if(S.full>=100||S.foodBowl<=0||c.t>9)setState('groom',2.5);break;
  case 'drink':
    c.facing=1;if(Math.floor(c.t/.25)!==Math.floor((c.t-dt)/.25))sLap();
    if(S.waterBowl>0){S.water=Math.min(100,S.water+18*dt);S.waterBowl=Math.max(0,S.waterBowl-13*dt);}
    if(S.water>=100||S.waterBowl<=0||c.t>7)setState('idle',1.5);break;
  case 'hesitate':if(S.clumps.length<3||c.t>c.dur)enterLitter();break;
  case 'litterSquat':
    if(c.t>c.dur){const poop=S.gut>=40;if(poop)S.gut-=40;S.bladder=0;
      S.clumps.push({t:poop?'poop':'pee',dx:rand(-55,55),dy:rand(-9,8)});if(S.clumps.length>8)S.clumps.shift();
      sPop();puff('sparkle',P.litter.x,P.litter.y-50,5,{col:'#ffd95e'});
      if(poop){S.c.poop++;say(`${subj()} 응가를 했어요! 치워 줄까요?`,'poop',25);}else say(`${subj()} 쉬를 했어요!`,'pee',45);
      checkStickers();setState('litterCover',1.6);}
    break;
  case 'litterCover':
    c.digT-=dt;if(c.digT<=0){c.digT=.18;sDig();c.facing*=-1;puff('sand',P.litter.x-c.facing*30,P.litter.y-30,4,{spread:1.4,g:500});}
    if(c.t>c.dur)go(P.litter.x+180,632,()=>setState('idle',1.5));break;
  case 'chase':{
    if(!fa){setState('idle',rand(1,2));break;}
    const k=catK();c.facing=feather.x>c.x?1:-1;
    const gy=clamp(feather.y+60,AREA.y0,AREA.y1),gx=clamp(feather.x-c.facing*55*k,AREA.x0,AREA.x1);
    const dx=gx-c.x,dy=gy-c.y,d=Math.hypot(dx,dy);
    if(d>35){const sp=245*k,st=Math.min(d,sp*dt);c.x+=dx/d*st;c.y+=dy/d*st;c.phase+=dt*17;c.moving=true;c.stalk=0;}
    else{c.moving=false;c.stalk+=dt;if(c.stalk>.4&&now-c.lastPounce>.45)pounce();}
    break;}
  case 'pounce':{const p=Math.min(1,c.t/c.dur);c.x=lerp(c.j.x0,c.j.x1,p);c.jump=Math.sin(Math.PI*p)*c.j.h;
    if(p>=1){c.jump=0;c.lastPounce=now;
      if(Math.abs(feather.x-c.x)<170*catK()){S.fun=Math.min(100,S.fun+12);addHeart(1);S.c.pounce++;puff('sparkle',feather.x,feather.y,7,{col:'#ffd95e'});meow(1.2,.7);say('와, 잡았다!','catch',18);checkStickers();setState('chaseRest',.7);}
      else setState('chaseRest',.4);}
    break;}
  case 'chaseRest':if(c.t>c.dur){if(fa)setState('chase');else setState('idle',1.5);}break;
  case 'bat':
    if(!c.hit&&c.t>.32){c.hit=true;ball.vx=c.facing*rand(260,420);ball.vy=rand(-90,90);S.fun=Math.min(100,S.fun+6);tone(300,.06,{vol:.12});}
    if(c.t>c.dur){c.batN++;if(c.batN<3)goBall();else setState('idle',2);}break;
  case 'punch':if(c.t>.9){const tx=c.x<600?c.x+280:c.x-280;go(tx,rand(AREA.y0,AREA.y1),()=>setState('groom',2.5),{ess:true});}break;
  }
}
function updateBall(dt){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const f=Math.pow(.35,dt);ball.vx*=f;ball.vy*=f;
  if(ball.x<90){ball.x=90;ball.vx*=-.7;}if(ball.x>1110){ball.x=1110;ball.vx*=-.7;}
  if(ball.y<AREA.y0+5){ball.y=AREA.y0+5;ball.vy*=-.7;}if(ball.y>AREA.y1-4){ball.y=AREA.y1-4;ball.vy*=-.7;}
  ball.rot+=ball.vx*dt/14;}

    say(`와! ${subj()} 쑥 자라서 ${STAGES[st]}가 됐어요!`,'grow'+st,1);toast('🎉',STAGES[st]+'가 됐어요!');checkStickers();}
}

let toastT=null;function toast(e,t){$('#toastE').textContent=e;$('#toastT').textContent=t;const el=$('#toast');el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400);}
function puff(type,x,y,n,o={}){for(let i=0;i<n;i++)parts.push({type,x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-70,70)*(o.spread||1),vy:rand(-150,-60)*(o.up||1),g:o.g||0,life:0,max:o.max||rand(.8,1.3),s:o.s||rand(10,17),rot:rand(0,TAU),vr:rand(-3,3),col:o.col});}

function hitCat(x,y){const k=catK();if(cat.state==='sleep')return ((x-cat.x)/(88*k))**2+((y-(cat.y-30*k))/(50*k))**2<1;
  const cy=cat.y-cat.jump-62*k;return ((x-cat.x)/(82*k))**2+((y-cy)/(78*k))**2<1;}
function catPetted(){if(!awake())return;if(['idle','groom','window','beg','petted','bump','bat','stretch'].includes(cat.state)||(cat.state==='walk'&&!cat.ess)){if(cat.state!=='petted')setState('petted');cat.petUntil=now+1.1;}}
function stroke(p){
  if(now<cat.noPetUntil)return;
  S.love=Math.min(100,S.love+4);addHeart(1);S.c.pet++;purrUntil=now+.7;
  parts.push({type:'heart',x:p.x,y:p.y-10,vx:rand(-30,30),vy:-90,life:0,max:1.1,s:rand(13,18),rot:0,vr:0});sHeart();

cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(demo)return;initAudio();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=toWorld(e);ptr.mouse=e.pointerType==='mouse';Object.assign(ptr,{down:true,x:p.x,y:p.y,sx:p.x,sy:p.y,moved:0,t0:now,show:true,onCat:hitCat(p.x,p.y),petDist:0});
  if(tool==='food'||tool==='water'){if(!carry)carry={kind:tool,x:p.x,y:p.y,phase:'hold',rot:0};}
  if(tool==='play'){feather.x=p.x;feather.y=p.y;feather.last=now;}
  if(tool==='love')loveTap(p);

cv.addEventListener('pointermove',e=>{
  if(demo)return;const p=toWorld(e);ptr.mouse=e.pointerType==='mouse';
  const d=Math.hypot(p.x-ptr.x,p.y-ptr.y);ptr.x=p.x;ptr.y=p.y;if(ptr.mouse)ptr.show=true;
  if(tool==='play'&&(ptr.down||ptr.mouse)){feather.spd=lerp(feather.spd,d*60,.3);feather.x=p.x;feather.y=p.y;feather.last=now;}
  if(!ptr.down)return;ptr.moved+=d;
  if(carry&&carry.phase==='hold'){carry.x=p.x;carry.y=p.y;}
  if((tool==='hand'||tool==='brush')&&hitCat(p.x,p.y)){
    ptr.petDist+=d;const need=tool==='hand'?95:130;
    while(ptr.petDist>=need){ptr.petDist-=need;tool==='hand'?stroke(p):brushStroke(p);}
    if(now>=cat.noPetUntil){purrUntil=Math.max(purrUntil,now+.3);catPetted();}
  }
});
function endPtr(e){
  if(demo||!ptr.down)return;const p=toWorld(e);ptr.down=false;if(!ptr.mouse)ptr.show=false;
  const tap=ptr.moved<14&&now-ptr.t0<.45;
  if(tool==='hand'&&tap){if(ptr.onCat)boop();else callCat(p);}
  if(carry&&carry.phase==='hold')releaseCarry();

cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);

    if(F.pat==='patch'){c.fillStyle=F.dark;c.beginPath();c.ellipse(-24,by-12,18,22,0,0,TAU);c.fill();c.fillStyle=F.dark2;c.beginPath();c.ellipse(26,by+18,14,14,0,0,TAU);c.fill();}}
  if(kind==='sleep'){c.fillStyle=F.belly;c.beginPath();c.ellipse(4,by+22,42,10,0,0,TAU);c.fill();
    if(F.pat==='stripe'){c.strokeStyle=F.dark;c.lineWidth=7;for(let i=0;i<5;i++){const x=-46+i*18;c.beginPath();c.moveTo(x,by-30);c.quadraticCurveTo(x+6,by-14,x-2,by);c.stroke();}}

function head(c,o,F,r){

  c.fillStyle='rgba(255,105,150,.42)';for(const s of [-1,1]){c.beginPath();c.ellipse(s*r*.68,r*.3,r*.17,r*.11,0,0,TAU);c.fill();}

  else{const sad=face==='sad',sur=face==='surprise',rx=r*(sad?.14:sur?.2:.17),ry=r*(sad?.17:sur?.2:.22);
    for(const s of [-1,1]){const x=s*ex;

      else{c.fillStyle='#2a1d33';c.beginPath();c.ellipse(x,ey,rx,ry,0,0,TAU);c.fill();}
      c.fillStyle='#fff';c.beginPath();c.arc(x+rx*.32,ey-ry*.38,rx*.42,0,TAU);c.fill();c.beginPath();c.arc(x-rx*.32,ey+ry*.38,rx*.18,0,TAU);c.fill();
      if(sad){c.beginPath();c.moveTo(s*(ex-r*.16),ey-r*.4);c.lineTo(s*(ex+r*.16),ey-r*.3);c.stroke();}}}
  c.fillStyle='#ff8fa8';c.beginPath();c.moveTo(-r*.1,r*.16);c.lineTo(r*.1,r*.16);c.lineTo(0,r*.27);c.closePath();c.fill();c.lineWidth=2.2;c.stroke();
  c.lineWidth=2.6;
  if(o.meow>0){c.fillStyle='#d9486e';c.beginPath();c.ellipse(0,r*.42,r*.11,r*.14*Math.min(1,o.meow*5),0,0,TAU);c.fill();c.stroke();}
  else{c.beginPath();c.arc(-r*.09,r*.27,r*.09,0,Math.PI);c.moveTo(r*.18,r*.27);c.arc(r*.09,r*.27,r*.09,0,Math.PI);c.stroke();
    if(o.pose==='groom'||o.pose==='eat'){c.fillStyle='#ff7c9c';c.beginPath();c.ellipse(0,r*.42,r*.07,r*.08+Math.abs(Math.sin(o.t*10))*r*.04,0,0,TAU);c.fill();}}
  c.strokeStyle=F.pat==='none'&&F.base<'#5'?'rgba(255,255,255,.55)':'rgba(67,40,90,.5)';c.lineWidth=2;
  for(const s of [-1,1])for(const dy of [-.07,.07]){c.beginPath();c.moveTo(s*r*.58,r*.3+dy*r);c.lineTo(s*r*1.38,r*.22+dy*r*2);c.stroke();}
  c.strokeStyle=OL;c.lineWidth=3.4;
  if(o.collar)collar(c,0,r*.9,o.collar,r);
}
function collar(c,x,y,type,r){

  if(type===1){c.fillStyle='#ff4d6d';for(const d of [-1,1]){c.beginPath();c.moveTo(0,0);c.lineTo(d*20,-11);c.lineTo(d*20,11);c.closePath();c.fill();c.stroke();}c.beginPath();c.arc(0,0,6,0,TAU);c.fill();c.stroke();}

function poseSide(c,o,F,hs){
  const p=o.pose,t=o.t,ph=o.phase||0,crouch=p==='crouch',eat=p==='eat',jump=p==='jump',walk=p==='walk';

  if(crouch)tail(c,F,[[-46+wig,by],[-82+wig,by-8+sway*.3],[-98+wig,by+2+sway]]);
  else tail(c,F,[[-46,by-6],[-92,by-14+sway],[-80,by-64+sway*.7]]);

  case 'bigheart':{const s=p.s*Math.min(1,p.life*5)*(1+p.life*.3);heartPath(c,0,0,s);c.fillStyle='#ff5f93';c.fill();c.lineWidth=4;c.stroke();c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(-s*.35,-s*.3,s*.15,0,TAU);c.fill();break;}
  case 'fur':c.fillStyle=p.col;c.beginPath();c.ellipse(0,0,p.s,p.s*.5,0,0,TAU);c.fill();c.globalAlpha*=.4;c.lineWidth=1.5;c.stroke();break;
  case 'kibble':c.fillStyle=p.col;c.beginPath();c.arc(0,0,p.s,0,TAU);c.fill();break;
  case 'drop':c.fillStyle='#5bb8ff';c.beginPath();c.moveTo(0,-p.s);c.quadraticCurveTo(p.s,p.s*.4,0,p.s);c.quadraticCurveTo(-p.s,p.s*.4,0,-p.s);c.fill();break;
  case 'sand':c.fillStyle='#e6cf9a';c.beginPath();c.arc(0,0,4,0,TAU);c.fill();break;
  case 'sparkle':{const s=p.s*(1-p.life/p.max*.5);starPath(c,0,0,s,4,.35);c.fillStyle=p.col||'#ffd95e';c.fill();c.lineWidth=1.5;c.stroke();break;}
  case 'z':c.rotate(-p.rot);c.font=`${p.s}px Jua, sans-serif`;c.fillStyle=S.lights?OL:'#efe8ff';c.textAlign='center';c.fillText('Z',0,0);break;
  case 'note':c.rotate(-p.rot);c.font=`${p.s}px sans-serif`;c.fillStyle='#ffd0e4';c.textAlign='center';c.fillText('♪',0,0);break;
  case 'confetti':c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);break;
  }c.restore();}}
function drawTools(c){
  if(tool==='play'&&featherActive()){const fx=feather.x,fy=feather.y,ax=fx+90,ay=Math.max(cam.y-20,fy-260);c.save();c.lineCap='round';
    c.strokeStyle='rgba(67,40,90,.6)';c.lineWidth=2;c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo(fx+30,(fy+ay)/2+20,fx,fy-6);c.stroke();
    c.strokeStyle=OL;c.lineWidth=10;c.beginPath();c.moveTo(ax,ay);c.lineTo(ax+110,ay-30);c.stroke();c.strokeStyle='#ffd95e';c.lineWidth=5;c.stroke();
    c.translate(fx,fy);c.rotate(Math.sin(now*8)*.25);c.lineWidth=2.5;c.strokeStyle=OL;
    for(const [a,col] of [[-.5,'#7cc8ff'],[0,'#ff6f9c'],[.5,'#8fdcc4']]){c.save();c.rotate(a);c.fillStyle=col;c.beginPath();c.ellipse(0,18,8,20,0,0,TAU);c.fill();c.stroke();c.restore();}
    c.fillStyle='#ffd23f';c.beginPath();c.arc(0,0,7,0,TAU);c.fill();c.stroke();c.restore();}
  if(!ptr.show)return;const {x,y}=ptr;
  if(tool==='brush'){c.save();c.translate(x,y);c.rotate(-.35);c.lineWidth=3;c.strokeStyle=OL;c.fillStyle='#ff9ebd';rr(c,-36,-30,72,22,10);c.fill();c.stroke();
    c.lineWidth=3.5;for(let i=0;i<7;i++){c.beginPath();c.moveTo(-28+i*9.3,-8);c.lineTo(-28+i*9.3,14);c.stroke();}c.restore();}
  if(tool==='clean'){c.save();c.translate(x,y);c.rotate(-.3);c.lineWidth=3;c.strokeStyle=OL;c.fillStyle='#8fdcc4';c.beginPath();c.moveTo(-26,-14);c.lineTo(26,-14);c.lineTo(20,16);c.lineTo(-20,16);c.closePath();c.fill();c.stroke();
    c.lineWidth=2;for(const dx of [-10,0,10]){c.beginPath();c.moveTo(dx,-8);c.lineTo(dx,10);c.stroke();}c.lineWidth=9;c.beginPath();c.moveTo(24,-12);c.lineTo(60,-44);c.stroke();c.strokeStyle='#ffd95e';c.lineWidth=4;c.stroke();c.restore();}
}
function drawCarry(c){if(!carry)return;c.save();c.translate(carry.x,carry.y);c.rotate(carry.rot||0);c.lineWidth=3;c.strokeStyle=OL;
  if(carry.kind==='food'){c.fillStyle='#ffb347';rr(c,-24,-34,48,62,8);c.fill();c.stroke();c.fillStyle='#fff';rr(c,-16,-14,32,24,6);c.fill();c.stroke();c.fillStyle='#ff7aa2';c.beginPath();c.ellipse(-2,-2,8,5,0,0,TAU);c.fill();c.beginPath();c.moveTo(5,-2);c.lineTo(11,-7);c.lineTo(11,3);c.closePath();c.fill();
    c.fillStyle='#ffd95e';c.beginPath();c.moveTo(-24,-34);c.lineTo(24,-34);c.lineTo(18,-44);c.lineTo(-18,-44);c.closePath();c.fill();c.stroke();}
  else{c.fillStyle='rgba(124,200,255,.9)';rr(c,-18,-30,36,60,12);c.fill();c.stroke();c.fillStyle='#4f9bff';rr(c,-9,-44,18,16,4);c.fill();c.stroke();c.fillStyle='#fff';c.beginPath();c.ellipse(-6,-6,4,12,0,0,TAU);c.fill();}
  c.restore();}
function drawFly(c){for(const f of flying)drawClump(c,f.x,f.y,f.cl.t);}
function drawHint(c){if(!hint||now>hint.until)return;const b=Math.abs(Math.sin(now*6))*14;c.save();c.translate(hint.x,hint.y-b);c.lineWidth=4;c.strokeStyle=OL;c.fillStyle='#ffd95e';
  c.beginPath();c.moveTo(-14,-40);c.lineTo(14,-40);c.lineTo(14,-14);c.lineTo(28,-14);c.lineTo(0,14);c.lineTo(-28,-14);c.lineTo(-14,-14);c.closePath();c.fill();c.stroke();c.restore();}

function render(){
  if(cv.width!==Math.round(cw*dpr)||!cw)resize();
  const fx=focus.until>now?focus.x:cat.x;
  const tx=viewW>=W?(W-viewW)/2:clamp(fx-viewW/2,0,W-viewW);
  cam.x=Math.abs(cam.x-tx)>viewW?tx:lerp(cam.x,tx,.08);cam.y=Math.max(0,H-viewH);
  const c=ctx;c.setTransform(dpr*scale,0,0,dpr*scale,-cam.x*dpr*scale,-cam.y*dpr*scale);
  drawRoom(c);
  const items=[
    {y:P.litter.y-60,d:drawLitterBack},{y:P.litter.y+5,d:drawLitterFront},{y:P.trash.y,d:drawTrash},
    {y:P.food.y,d:c=>drawBowl(c,P.food,'food')},{y:P.water.y,d:c=>drawBowl(c,P.water,'water')},
    {y:P.cushion.y-20,d:drawCushion},{y:ball.y,d:drawBall},{y:cat.y,d:c=>drawCat(c,catOpts())}];
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.d(c));
  drawFly(c);
  if(!S.lights){const g=c.createRadialGradient(P.win.x+P.win.w/2,P.win.y+P.win.h,60,P.win.x+P.win.w/2,P.win.y+P.win.h,900);g.addColorStop(0,'rgba(40,30,90,.28)');g.addColorStop(1,'rgba(30,20,70,.62)');c.fillStyle=g;c.fillRect(cam.x-10,cam.y-10,viewW+20,viewH+20);}
  drawParts(c);
  const need=getNeed();
  if(need&&!demo&&awake()&&!['eat','drink','litterSquat','litterCover','petted','pounce','chase','bump'].includes(cat.state))drawBubble(c,need);
  drawCarry(c);drawTools(c);drawHint(c);
}
function getNeed(){if(S.clumps.length>=3)return 'litter';if(S.full<30)return 'food';if(S.water<30)return 'water';if(S.energy<22)return 'sleep';if(S.fun<28)return 'play';if(S.love<28)return 'love';return null;}
const NEED_LINES={food:()=>`${subj()} 배고파요! 밥을 주세요.`,water:()=>`${subj()} 목이 말라요. 물을 주세요.`,litter:()=>'화장실이 지저분해요. 청소해 주세요!',
  sleep:()=>`${subj()} 졸려요. 불을 꺼 줄까요?`,play:()=>`${subj()} 심심해요! 놀아 주세요.`,love:()=>`${subj()} 쓰다듬어 달래요.`};

/* ---------- 흐름 ---------- */
function update(dt){
  const sl=cat.state==='sleep';
  if(!demo){
    S.full=clamp(S.full-.32*dt*(sl?.4:1),0,100);S.water=clamp(S.water-.38*dt*(sl?.4:1),0,100);
    S.fun=clamp(S.fun-(sl?0:.34)*dt,0,100);S.love=clamp(S.love-(sl?.06:.27)*dt,0,100);
    if(!sl)S.energy=clamp(S.energy-.17*dt,0,100);
    S.bladder=clamp(S.bladder+(sl?.15:.55)*dt,0,130);S.fluff=clamp(S.fluff-.1*dt,0,100);
  }
  updateCat(dt);updateBall(dt);
  for(const p of parts){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.rot+=p.vr*dt;}parts=parts.filter(p=>p.life<p.max);
  for(const t of tweens){t.t+=dt;t.up(Math.min(1,t.t/t.dur));}const done=tweens.filter(t=>t.t>=t.dur);tweens=tweens.filter(t=>t.t<t.dur);done.forEach(t=>t.done&&t.done());
  birdT-=dt;if(birdT<=0){birdT=cat.state==='window'?rand(2,4):rand(6,14);birds.push({x:P.win.x-20,y:P.win.y+rand(30,120),o:rand(0,6)});}
  birds.forEach(b=>b.x+=70*dt);if(birds.length&&cat.state==='window'&&birds.some(b=>Math.abs(b.x-(P.win.x+P.win.w/2))<3)&&cat.meow<=0)meow(1.5,.5);
  birds=birds.filter(b=>b.x<P.win.x+P.win.w+20);
  if(S.fluff>80&&awake()&&Math.random()<dt*1.5){const k=catK();puff('sparkle',cat.x+rand(-50,50)*k,cat.y-rand(30,110)*k,1,{col:'#fff6a8',s:8,up:.3});}
  const pr=now<purrUntil;if(pr!==purring){purring=pr;setPurr(pr);}
  if(!S.lights&&!demo){lullT-=dt;if(lullT<=0){const f=LULL[lullI++%LULL.length];if(f){tone(f,.55,{type:'triangle',vol:.05});if(Math.random()<.5)parts.push({type:'note',x:P.win.x+rand(30,220),y:P.win.y+rand(150,220),vx:rand(-10,10),vy:-28,life:0,max:2,s:22,rot:0,vr:0});}lullT=.62;}}
  if(!demo){needT-=dt;if(needT<=0){needT=1;const n=getNeed();if(n&&awake())say(NEED_LINES[n](),'need-'+n,45);}
    saveT-=dt;if(saveT<=0){saveT=8;saveNow();}}
}
let hudT=0;
function hud(){$$('.g').forEach(g=>{const v=S[g.dataset.k];g.querySelector('i').style.width=Math.max(4,v)+'%';g.classList.toggle('low',v<30);g.classList.toggle('mid',v>=30&&v<60);});
  $('#nm').textContent=S.name;$('#age').textContent=STAGES[S.stage];$('#hearts').textContent='♥ '+S.hearts;}
function frame(ts){const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;now+=dt;update(dt);render();hudT-=dt;if(hudT<=0){hudT=.25;hud();}if(!$('#mStart').hidden)drawStart();requestAnimationFrame(frame);}

/* ---------- 시작 화면 ---------- */
let newFur='cheese';
function miniCat(cvs,fur,stage=1,face='normal',t=0){const c=cvs.getContext('2d'),w=cvs.width,h=cvs.height;c.clearRect(0,0,w,h);
  drawCat(c,{x:w/2,y:h*.9,k:h/170,pose:'sit',facing:1,face,t,phase:0,jump:0,meow:0,blink:0,fur,stage,collar:0});}
function drawStart(){const cvs=$('#startCv'),t=now;const blink=(t%4)<.14;
  miniCat(cvs,['cheese','calico','mackerel','black','white'][Math.floor(t/4)%5],1,blink?'sleep':(Math.floor(t/2)%2?'happy':'normal'),t);}
function showStart(){
  saveNow();demo=true;purrUntil=0;carry=null;S.lights=true;
  const d=loadAll(),box=$('#saves');box.innerHTML='';
  (d.order||Object.keys(d.cats)).filter(n=>d.cats[n]).forEach(n=>{const s=d.cats[n];
    const row=document.createElement('div');row.className='save';
    const goB=document.createElement('button');goB.className='go';const mc=document.createElement('canvas');mc.width=104;mc.height=104;
    const tx=document.createElement('span');tx.innerHTML=`${esc(n)}<br><small>${STAGES[s.stage||0]} · ♥ ${s.hearts||0}</small>`;goB.append(mc,tx);
    goB.onclick=()=>{initAudio();startGame(s,false);};
    const del=document.createElement('button');del.className='del';del.textContent='지우기';
    del.onclick=()=>{if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='정말?';setTimeout(()=>{del.classList.remove('sure');del.textContent='지우기';},2500);return;}
      const dd=loadAll();delete dd.cats[n];dd.order=(dd.order||[]).filter(x=>x!==n);storeAll(dd);showStart();};
    row.append(goB,del);box.append(row);miniCat(mc,s.fur,s.stage||0);});
  $('#bNew').textContent=box.children.length?'🐾 새 고양이 데려오기':'🐾 고양이 데려오기';
  $('#mStart').hidden=false;$('#mNew').hidden=true;
}
function esc(s){return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function showNew(){
  const box=$('#furs');box.innerHTML='';
  Object.entries(FURS).forEach(([k,f])=>{const b=document.createElement('button');b.className='fur'+(k===newFur?' on':'');const c=document.createElement('canvas');c.width=192;c.height=192;
    b.append(c,document.createTextNode(f.n));b.onclick=()=>{initAudio();newFur=k;$$('.fur').forEach(x=>x.classList.toggle('on',x===b));sMeow(1.2,.7);};box.append(b);miniCat(c,k,0,'happy');});
  const chips=$('#nameChips');chips.innerHTML='';['나비','콩이','보리','치즈','구름','모모'].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{$('#nameIn').value=n;};chips.append(b);});
  $('#nameIn').value='';$('#mStart').hidden=true;$('#mNew').hidden=false;
}
function startGame(s,isNew){
  S=s;S.c=Object.assign({pet:0,brush:0,love:0,feed:0,water:0,pounce:0,clean:0,sleep:0,poop:0},S.c||{});
  demo=false;Object.assign(cat,{x:760,y:600,facing:1,jump:0,meow:0});setState('idle',1.5);ball.x=860;ball.y=575;ball.vx=ball.vy=0;
  parts=[];tweens=[];flying=[];carry=null;hint=null;$('#mStart').hidden=true;$('#mNew').hidden=true;
  if(!S.lights){S.lights=true;}lightBtn();setTool('hand');hud();saveNow();
  setTimeout(()=>{meow(1,1.2);say(isNew?`${subj()} 우리 집에 왔어요! 손가락으로 쓰다듬어 볼까요?`:`${voc()}, 또 만났네!`,'hello',1);},350);
}
$('#bNew').onclick=()=>{initAudio();showNew();};
$('#bBack').onclick=()=>showStart();
$('#bAdopt').onclick=()=>{initAudio();let n=$('#nameIn').value.trim().replace(/\s+/g,' ').slice(0,8)||'냥이';const d=loadAll();startGame(d.cats[n]||newCat(n,newFur),!d.cats[n]);};
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bAdopt').click();});

/* ---------- 스티커·꾸미기·메뉴 ---------- */
function openStickers(){const g=$('#stickerGrid');g.innerHTML='';STICKERS.forEach(s=>{const got=S.stickers.includes(s.id),d=document.createElement('div');d.className='stk'+(got?' got':'');
  d.innerHTML=`<div class="se">${got?s.e:'⭐'}</div><div class="sn">${got?s.n:'???'}</div><div class="sh">${s.h}</div>`;g.append(d);});
  $('#stkCount').textContent=`${STICKERS.length}개 중에 ${S.stickers.length}개를 모았어요`;$('#mSticker').hidden=false;}
function openDecor(){const rows=$('#decorRows');rows.innerHTML='';$('#decHearts').textContent='♥ '+S.hearts;
  Object.entries(DECOR).forEach(([key,grp])=>{const r=document.createElement('div');r.className='drow';r.innerHTML=`<h3>${grp.t}</h3>`;const o=document.createElement('div');o.className='dopts';
    grp.items.forEach((it,i)=>{const own=S.owned[key].includes(i),b=document.createElement('button');b.className='dopt'+(S.decor[key]===i?' on':'');
      const sw=key==='collar'?`<span class="sw" style="background:#fff">${it.e}</span>`:`<span class="sw" style="background:${it.c}"></span>`;
      b.innerHTML=`${sw}<span>${it.n}</span>${own?'':`<span class="price">♥ ${it.cost}</span>`}`;
      b.onclick=()=>{if(!own){if(S.hearts<it.cost){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');say(`하트가 ${it.cost-S.hearts}개 더 필요해요.`,'needh',3);return;}S.hearts-=it.cost;S.owned[key].push(i);sChime();}
        else sSparkle();S.decor[key]=i;saveNow();hud();openDecor();};
      o.append(b);});r.append(o);rows.append(r);});
  $('#mDecor').hidden=false;}
$('#bSticker').onclick=()=>{initAudio();openStickers();};
$('#bDecor').onclick=()=>{initAudio();openDecor();};
$('#bHome').onclick=()=>showStart();
$('#bSound').onclick=()=>{muted=!muted;$('#bSound').textContent=muted?'🔇':'🔊';$('#bSound').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기');if(muted){try{speechSynthesis.cancel();}catch(e){}setPurr(false);}else initAudio();};
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').hidden=true);
$$('#mSticker,#mDecor').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.hidden=true;}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});
window.addEventListener('pagehide',saveNow);

resize();showStart();requestAnimationFrame(frame);
window.__nyang={get S(){return S;},cat,setTool,toggleLight};
})();
</script>
