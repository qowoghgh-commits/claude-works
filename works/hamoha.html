<title>하모하</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 위 막대(제목·학급) + 탭, 아래는 흰 쟁반 카드. 태블릿 손가락 크기 기준 */
:root{
  --bg:#eaf1f4; --sheet:#dde7ec; --plate:#ffffff; --ink:#2e2940; --sub:#6c6680;
  --accent:#e2557a; --accent-ink:#ffffff; --gold:#e8a400; --line:#d3dde3;
  --good:#2f9e6a; --warn:#d9822b; --bad:#d64545; --soft:#f4f7f9; --star:#f2a900;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1922; --sheet:#25202c; --plate:#2e2836; --ink:#f3eef8; --sub:#b3abc2;
  --accent:#ff7d9c; --accent-ink:#2a1020; --gold:#ffc73a; --line:#3b3446;
  --good:#5fd39b; --warn:#ffb15c; --bad:#ff7b7b; --soft:#27222e; --star:#ffc73a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1922; --sheet:#25202c; --plate:#2e2836; --ink:#f3eef8; --sub:#b3abc2;
  --accent:#ff7d9c; --accent-ink:#2a1020; --gold:#ffc73a; --line:#3b3446;
  --good:#5fd39b; --warn:#ffb15c; --bad:#ff7b7b; --soft:#27222e; --star:#ffc73a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:26px} h3{font-size:21px}
p{margin:0}
.muted{color:var(--sub)}
.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:2px solid var(--line);background:var(--plate);border-radius:16px;padding:10px 18px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:19px}
.btn:hover{border-color:var(--sub)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1d00}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{min-height:42px;padding:6px 12px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--plate);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:2px solid var(--line);background:var(--plate);border-radius:14px;padding:10px 14px;min-height:52px;width:100%}
textarea{min-height:160px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--sub)}
.note{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:15px;color:var(--sub)}
.err{color:var(--bad);font-size:15px;min-height:1.4em}
.ok{color:var(--good)}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--plate);border-radius:32px;padding:28px;border:1px solid var(--line)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(36px,6vw,58px);line-height:1.15}
.hero h1 b{color:var(--accent);font-weight:400}
.parade{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:var(--sheet);border-radius:24px;padding:16px}
.parade svg{width:min(23%,110px);height:auto}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modes .btn{min-height:96px;flex-direction:column;font-size:24px;border-radius:22px}
.modes .btn small{font-family:var(--body);font-size:14px;opacity:.85}

/* 위 막대 */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-size:clamp(20px,3vw,26px);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{color:var(--accent);font-weight:400}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:2px solid transparent;background:transparent;border-radius:14px;padding:8px 16px;min-height:50px;font-family:var(--display);font-size:18px;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--plate);border-color:var(--line);color:var(--ink)}

/* 표 */
.tbl-wrap{overflow-x:auto;border-radius:18px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;background:var(--plate);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-family:var(--display);font-weight:400;font-size:15px;color:var(--sub);background:var(--soft);white-space:nowrap}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap;text-align:left}
.who svg{width:40px;height:40px;flex:none}
.who button{border:0;background:none;padding:0;font-family:var(--display);font-size:18px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.day{border:2px solid var(--line);background:var(--plate);border-radius:12px;min-width:58px;min-height:44px;padding:2px 6px;color:var(--star);font-size:15px;letter-spacing:-1px}
.day.none{color:var(--sub)}
.day.lock{cursor:default}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:42px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--plate);font-size:20px;font-family:var(--display)}
.stepper input{width:74px;min-height:44px;text-align:center;padding:4px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:14px;background:var(--soft);color:var(--sub);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.gold{background:color-mix(in srgb,var(--gold) 20%,transparent);color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:86px}
.cell .r{font-size:14px;white-space:nowrap}
.cell .c{font-size:13px;color:var(--sub)}

/* 역할 카드 */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.role{border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.role .ic{font-size:30px;line-height:1}
.role b{font-family:var(--display);font-weight:400;font-size:19px;display:block}
.role p{font-size:14px;color:var(--sub);overflow-wrap:anywhere}

/* 학생 */
.me{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:640px){.me{grid-template-columns:1fr}}
.me-cookie{background:var(--sheet);border-radius:24px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.me-cookie svg{width:88%;height:88%}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.stage-name{font-family:var(--display);font-size:32px;line-height:1.15}
.bar{height:18px;border-radius:99px;background:var(--sheet);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.bank{display:flex;gap:12px;flex-wrap:wrap}
.bank div{background:var(--soft);border-radius:16px;padding:10px 16px;min-width:140px}
.bank b{display:block;font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.bank small{color:var(--sub)}
.myrole{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:18px;padding:14px}
.myrole .ic{font-size:46px;line-height:1}
.myrole b{font-family:var(--display);font-weight:400;font-size:26px;display:block}
.days{display:flex;flex-direction:column;gap:8px}
.dayrow{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:8px 10px}
.dayrow.today{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.dayrow .d{font-family:var(--display);font-size:20px;line-height:1.1}
.dayrow .d small{display:block;font-family:var(--body);font-size:13px;color:var(--sub)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.levels button{border:2px solid var(--line);background:var(--plate);border-radius:14px;min-height:60px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.levels button .s{color:var(--star);font-size:17px;letter-spacing:-1px}
.levels button .t{font-size:13px}
@media (max-width:520px){.dayrow{grid-template-columns:52px 1fr;padding:6px}.levels button .t{font-size:11.5px;word-break:keep-all}.levels button{min-height:56px}}
.levels button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--plate))}
.levels button:disabled{cursor:default}
.levels button:disabled:not([aria-pressed="true"]){opacity:.35}
.mini-stages{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
@media (max-width:640px){.mini-stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini-stages div{display:flex;flex-direction:column;align-items:center;font-size:12px;text-align:center;line-height:1.2;color:var(--sub)}
.mini-stages div.lock svg{filter:grayscale(1);opacity:.35}
.mini-stages div.cur{color:var(--ink);font-weight:700}
.mini-stages svg{width:100%;height:auto}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 2px}
.hist div:last-child{border-bottom:0}

/* 주간 체크 표: 가로 = 요일, 세로 = 열심히 한 정도 */
.ck-grid{display:grid;grid-template-columns:minmax(78px,1.3fr) repeat(5,minmax(0,1fr));gap:6px}
.ck-day{text-align:center;font-family:var(--display);font-size:22px;line-height:1.1;padding:6px 2px;border-radius:14px}
.ck-day small{display:block;font-family:var(--body);font-size:12px;color:var(--sub)}
.ck-day.today{background:var(--accent);color:var(--accent-ink)}
.ck-day.today small{color:var(--accent-ink)}
.ck-lv{display:flex;flex-direction:column;justify-content:center;line-height:1.2;padding-right:4px}
.ck-lv .s{color:var(--star);font-size:18px;letter-spacing:-1px}
.ck-lv .t{font-size:13px;color:var(--sub);word-break:keep-all}
.ck-cell{border:2px solid var(--line);background:var(--plate);border-radius:14px;min-height:62px;font-size:28px;display:grid;place-items:center;padding:0}
.ck-cell.today{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ck-cell[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--plate))}
.ck-cell:disabled{cursor:default;background:var(--soft)}
.ck-cell:not(:disabled):hover{border-color:var(--sub)}
@media (max-width:520px){.ck-grid{gap:4px;grid-template-columns:62px repeat(5,minmax(0,1fr))}.ck-cell{min-height:52px;font-size:22px;border-radius:12px}.ck-lv .s{font-size:14px}.ck-lv .t{font-size:11px}.ck-day{font-size:19px}}

/* 칭찬 */
.praises{display:flex;flex-direction:column;gap:8px}
.praise{border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.praise p{overflow-wrap:anywhere}
.pz-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pz-head b{font-family:var(--display);font-weight:400;font-size:18px}
.pick button.on,.pick button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--plate))}
.pick button:disabled{opacity:.45;cursor:default}

/* 고르기 */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pick button{border:2px solid var(--line);background:var(--plate);border-radius:18px;min-height:64px;padding:10px;font-family:var(--display);font-size:21px}
.pick button small{display:block;font-family:var(--body);font-size:13px;color:var(--sub)}
.flavors{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.flavors button{border:3px solid var(--line);background:var(--plate);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:20px}
.flavors button[aria-pressed="true"]{border-color:var(--accent)}
.flavors svg{width:100%;max-width:120px;height:auto}

/* 창 */
.modal{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--plate);border-radius:28px;padding:24px;max-width:640px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.celebrate{text-align:center;align-items:center}
.celebrate svg{width:200px;height:200px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 20px;z-index:40;font-size:16px}
.twinkle{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.spin{animation:spin 14s linear infinite;transform-origin:100px 108px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.twinkle,.spin,.confetti i{animation:none}}
/* ===== 디자인 2: 파스텔 사탕 가게 (말랑한 카드 · 젤리 버튼 · 스프링클 바탕) ===== */
:root{
  --bg:#f4f1fb; --sheet:#ece6fa; --plate:#ffffff; --ink:#3a2f57; --sub:#857aa3;
  --accent:#ff6b9d; --accent-deep:#e54f84; --accent-ink:#ffffff; --gold:#ffb21e; --gold-deep:#e69400;
  --mint:#38c6a6; --sky:#7cb8ff; --line:#e7e1f5; --soft:#f8f5ff;
  --good:#22a77f; --warn:#e9882d; --bad:#e2506a; --star:#ffb21e;
  --shadow:0 10px 30px -12px rgba(98,72,170,.28),0 2px 6px -2px rgba(98,72,170,.10);
  --spr1:#ffc2d8; --spr2:#bfe8ff; --spr3:#c9f3e1; --spr4:#ffe3a3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1630; --sheet:#272043; --plate:#241d3d; --ink:#f4effd; --sub:#aea3cf;
  --accent:#ff7fab; --accent-deep:#e45f90; --accent-ink:#2b0f1f; --gold:#ffc54d; --gold-deep:#d99a12;
  --mint:#4fd9b9; --sky:#8fc2ff; --line:#382e5c; --soft:#2b2449;
  --good:#5ad9ad; --warn:#ffae5c; --bad:#ff7d92; --star:#ffc54d;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6);
  --spr1:#5a2a45; --spr2:#23415e; --spr3:#1f4a3f; --spr4:#5a4723; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1630; --sheet:#272043; --plate:#241d3d; --ink:#f4effd; --sub:#aea3cf;
  --accent:#ff7fab; --accent-deep:#e45f90; --accent-ink:#2b0f1f; --gold:#ffc54d; --gold-deep:#d99a12;
  --mint:#4fd9b9; --sky:#8fc2ff; --line:#382e5c; --soft:#2b2449;
  --good:#5ad9ad; --warn:#ffae5c; --bad:#ff7d92; --star:#ffc54d;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6);
  --spr1:#5a2a45; --spr2:#23415e; --spr3:#1f4a3f; --spr4:#5a4723; color-scheme:dark}

body{background-color:var(--bg);
  background-image:
    radial-gradient(var(--spr1) 2.2px,transparent 2.6px),
    radial-gradient(var(--spr2) 2.2px,transparent 2.6px),
    radial-gradient(var(--spr3) 2px,transparent 2.4px),
    radial-gradient(var(--spr4) 2px,transparent 2.4px);
  background-size:110px 110px,130px 130px,90px 90px,150px 150px;
  background-position:0 0,40px 60px,70px 20px,20px 90px;
  letter-spacing:-.01em}
h2{font-size:25px}
.card{border:0;border-radius:30px;padding:22px;box-shadow:var(--shadow)}
.card h2:first-child,.card .spread h2{display:flex;align-items:center;gap:8px}

/* 젤리 버튼 */
.btn{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:10px 22px;min-height:52px;
  box-shadow:inset 0 -4px 0 rgba(58,47,87,.10),0 2px 0 rgba(58,47,87,.04);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.03);border:0}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(58,47,87,.10)}
.btn.main{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -5px 0 var(--accent-deep),0 6px 14px -6px var(--accent)}
.btn.gold{background:var(--gold);color:#3b2600;box-shadow:inset 0 -5px 0 var(--gold-deep),0 6px 14px -6px var(--gold)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,var(--plate));color:var(--bad);border:0}
.btn.sm{min-height:42px;padding:6px 15px;font-size:16px;border-radius:999px}

input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:2px solid var(--line);background:var(--soft);border-radius:18px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--plate);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.note{background:var(--soft);border-radius:18px;border:2px dashed var(--line)}

/* 첫 화면 */
.hero{border:0;border-radius:36px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--plate)) 0%,var(--plate) 45%,color-mix(in srgb,var(--sky) 16%,var(--plate)) 100%)}
.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.12}
.hero h1 b{color:var(--accent);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--gold) 45%,transparent) 62%);padding:0 4px;border-radius:6px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--plate);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:15px;color:var(--accent);box-shadow:var(--shadow)}
.parade{background:color-mix(in srgb,var(--plate) 60%,transparent);border-radius:30px;backdrop-filter:blur(2px)}
.parade svg{animation:bob 2.8s ease-in-out infinite}
.parade svg:nth-child(2n){animation-delay:-.7s}
.parade svg:nth-child(3n){animation-delay:-1.4s}
.modes .btn{min-height:104px;border-radius:28px}
.modes .btn:not(.main){background:var(--plate);box-shadow:inset 0 -5px 0 var(--line),0 6px 16px -10px rgba(98,72,170,.4)}

/* 위 막대 */
.top{background:color-mix(in srgb,var(--plate) 85%,transparent);border-radius:26px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.brand{align-items:center}
.brand-ic{width:44px;height:44px;flex:none;display:inline-grid}
.brand-ic svg{width:100%;height:100%}
.brand b{color:var(--accent)}
.tabs{background:color-mix(in srgb,var(--plate) 70%,transparent);border-radius:999px;padding:6px;gap:4px;box-shadow:var(--shadow)}
.tabs button{border:0;border-radius:999px;min-height:46px;padding:6px 16px;font-size:17px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:inset 0 -3px 0 var(--accent-deep)}

/* 표 */
.tbl-wrap{border:0;border-radius:22px;background:var(--plate);box-shadow:inset 0 0 0 2px var(--line)}
th{background:var(--soft);font-size:15px}
th,td{border-bottom:1px solid var(--line)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.day{border:0;background:var(--soft);border-radius:14px;box-shadow:inset 0 -3px 0 var(--line)}
.stepper button{border:0;background:var(--soft);border-radius:50%;width:42px;height:42px;box-shadow:inset 0 -3px 0 var(--line)}
.stepper input{border-radius:14px}
.pill{font-family:var(--display);font-size:14px;padding:3px 11px}
.who svg{width:42px;height:42px}

/* 역할 */
.role{border:0;background:var(--soft);border-radius:22px}
.myrole{background:linear-gradient(120deg,color-mix(in srgb,var(--mint) 18%,var(--plate)),color-mix(in srgb,var(--sky) 16%,var(--plate)));border-radius:24px}
.myrole .ic{width:72px;height:72px;display:grid;place-items:center;background:var(--plate);border-radius:22px;font-size:42px;box-shadow:var(--shadow)}

/* 학생 쿠키 */
.me-cookie{border-radius:30px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--gold) 22%,var(--plate)) 0%,var(--sheet) 70%)}
.stage-name{font-size:34px}
.bar{height:20px;background:var(--sheet);box-shadow:inset 0 2px 4px rgba(58,47,87,.08)}
.bar i{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px),linear-gradient(90deg,var(--gold),var(--accent))}
.bank div{border-radius:22px;background:var(--soft)}
.bank div:last-child{background:color-mix(in srgb,var(--gold) 18%,var(--plate))}

/* 주간 체크 */
.ck-cell{border:0;background:var(--soft);border-radius:18px;box-shadow:inset 0 -4px 0 var(--line);transition:transform .12s}
.ck-cell:not(:disabled):hover{filter:brightness(1.04);border:0}
.ck-cell.today{box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--accent) 40%,var(--line)),0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.ck-cell[aria-pressed="true"]{background:color-mix(in srgb,var(--gold) 26%,var(--plate));box-shadow:inset 0 -4px 0 var(--gold);border:0}
.ck-cell:disabled{opacity:.55}
.ck-day{border-radius:18px}
.ck-day.today{box-shadow:inset 0 -3px 0 var(--accent-deep)}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* 칭찬·소감 */
.praise{border:0;background:var(--soft);border-radius:22px;padding:12px 14px}
.praise p{font-size:16px}
.pick button{border:0;background:var(--soft);border-radius:22px;box-shadow:inset 0 -4px 0 var(--line)}
.pick button.on,.pick button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--plate));box-shadow:inset 0 -4px 0 var(--accent)}
.flavors button{border:0;background:var(--soft);border-radius:26px;box-shadow:inset 0 -4px 0 var(--line)}
.flavors button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--plate));box-shadow:inset 0 -4px 0 var(--accent),0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.hist div{border-bottom:2px dotted var(--line)}

/* 창 */
.modal{background:color-mix(in srgb,#2a1f4a 45%,transparent);backdrop-filter:blur(3px)}
.modal .box{border-radius:34px;box-shadow:var(--shadow);animation:pop .3s ease-out}
.toast{border-radius:999px;background:var(--ink);box-shadow:var(--shadow);font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.parade svg,.ck-cell[aria-pressed="true"],.modal .box{animation:none}}


/* ===== 디자인 3: 움직임 ===== */
/* 떠다니는 빛 방울 배경 */
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(28vmax 28vmax at 15% 20%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
             radial-gradient(30vmax 30vmax at 85% 30%,color-mix(in srgb,var(--sky) 18%,transparent),transparent 70%),
             radial-gradient(26vmax 26vmax at 50% 90%,color-mix(in srgb,var(--mint) 14%,transparent),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3vmax,-2vmax) rotate(4deg)}100%{transform:translate(-2vmax,2vmax) rotate(-3deg)}}

/* 화면 들어올 때: 아래에서 톡톡 차례로 (보이는 상태에서 시작) */
#app.enter>*{animation:rise .55s cubic-bezier(.2,.9,.3,1.25) both}
#app.enter>*:nth-child(2){animation-delay:.06s}#app.enter>*:nth-child(3){animation-delay:.12s}#app.enter>*:nth-child(4){animation-delay:.18s}
#app.enter>*:nth-child(5){animation-delay:.24s}#app.enter>*:nth-child(6){animation-delay:.3s}#app.enter>*:nth-child(n+7){animation-delay:.36s}
@keyframes rise{from{transform:translateY(22px) scale(.98)}to{transform:none}}
#app.enter .bar i{animation:grow 1.1s .25s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
#app.enter .ck-cell[aria-pressed="true"],#app.enter .day:not(.none){animation:pop .4s both}
#app.enter .hero h1 b{animation:marker 1s .3s both}
@keyframes marker{from{background-size:0 100%}to{background-size:100% 100%}}
.hero h1 b{background-repeat:no-repeat}

/* 클릭 반짝이 */
.pt{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);animation:fly .7s cubic-bezier(.15,.8,.3,1) forwards;font-weight:700;line-height:1}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(160deg);opacity:0}}
.ring{position:fixed;z-index:59;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid var(--accent);animation:ring .5s ease-out forwards}
@keyframes ring{to{transform:scale(4.2);opacity:0;border-width:1px}}
.ftxt{position:fixed;z-index:61;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-size:22px;color:var(--accent);text-shadow:0 2px 0 var(--plate);animation:up 1.1s ease-out forwards}
@keyframes up{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}20%{transform:translate(-50%,-80%) scale(1.15);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
.confetti i{animation-name:fall2;display:grid;place-items:center}
@keyframes fall2{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sway),55vh) rotate(360deg)}100%{transform:translate(calc(var(--sway) * -.5),112vh) rotate(720deg)}}

/* 버튼: 살짝 떠오르고 눌리면 말랑 */
.btn,.pick button,.flavors button,.tabs button,.ck-cell,.day,.stepper button,.levels button{transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .15s,background-color .2s,filter .15s}
.btn:hover,.pick button:not(:disabled):hover{filter:brightness(1.05) saturate(1.05)}
.btn:active,.pick button:active,.flavors button:active,.tabs button:active,.day:active,.stepper button:active{transform:translateY(2px) scale(.96)}
.ck-cell:not(:disabled):active{transform:scale(.9)}
.flavors button:hover svg{animation:wiggle .5s ease-in-out}
.flavors button[aria-pressed="true"] svg{animation:bob 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.who svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
tr:hover .who svg{transform:rotate(-10deg) scale(1.12)}
.btn.main:not(:disabled),.btn.gold:not(:disabled){background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;background-position:120% 0}
.btn.main:not(:disabled):hover,.btn.gold:not(:disabled):hover{animation:shine .8s ease-out}
@keyframes shine{from{background-position:120% 0}to{background-position:-60% 0}}

/* 내 쿠키 */
.me-cookie{position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.me-cookie .squish{animation:squish .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1)}25%{transform:scale(1.15,.85)}50%{transform:scale(.92,1.1)}75%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
.bubble{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:var(--plate);color:var(--ink);font-family:var(--display);font-size:16px;padding:6px 14px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--plate);border-bottom:0}
.bubble.show{animation:pop .35s ease-out}
.tap-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--sub);background:color-mix(in srgb,var(--plate) 80%,transparent);padding:2px 10px;border-radius:999px;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.55}50%{opacity:1}}
.ck-day.today::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--accent-ink);margin:4px auto 0;animation:hint 1.2s ease-in-out infinite}

/* 디자인 다듬기 */
.card{position:relative}
.card>h2:first-child::after,.card>.spread:first-child h2::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:2px;box-shadow:12px 0 0 var(--accent),24px 0 0 var(--mint)}
.top .brand-ic svg{animation:bob 2.6s ease-in-out infinite}
.myrole .ic{animation:bob 3s ease-in-out infinite}
.modal .box .celebrate svg,.celebrate>svg{animation:spinIn .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes spinIn{from{transform:scale(.2) rotate(-200deg)}to{transform:none}}
.toast{animation:toastIn .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes toastIn{from{transform:translate(-50%,30px) scale(.8)}to{transform:translateX(-50%)}}
.praise{transition:transform .2s}
.praise:hover{filter:brightness(1.02)}
.pill.warn{animation:hint 1.8s ease-in-out infinite}
footer.foot{text-align:center;color:var(--sub);font-size:13px;padding-top:8px}
@media (prefers-reduced-motion:reduce){body::before,#app.enter>*,#app.enter .bar i,.tabs button[aria-selected="true"],.tap-hint,.ck-day.today::after,.top .brand-ic svg,.myrole .ic,.pill.warn,.toast,.flavors button svg{animation:none!important}}

/* ===== 디자인 4: 태블릿·전자칠판 ===== */
html{-webkit-text-size-adjust:100%}
#app,.foot{zoom:var(--z,1)}
.modal .box{zoom:var(--z,1);max-height:calc(88vh / var(--z,1))}
.toast{zoom:var(--z,1)}
button,[role="button"],.ck-cell,.day{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.btn{min-height:56px}

/* 손가락 화면: 떠오르는 효과 대신 누르는 효과만 */
@media (hover:none){.btn:hover,.pick button:not(:disabled):hover,.praise:hover{transform:none}tr:hover .who svg{transform:none}.btn.main:not(:disabled):hover,.btn.gold:not(:disabled):hover{animation:none}}
/* 가로 태블릿·칠판: 내 쿠키 | 이번 주 역할·체크 */
@media (min-width:1000px) and (orientation:landscape){
  .s-top{display:grid;grid-template-columns:minmax(300px,.78fr) minmax(0,1.7fr);gap:18px;align-items:start}
  .s-top .me{grid-template-columns:1fr}
  .s-top .me-cookie{max-width:300px;margin:0 auto;width:100%}
  .s-top>.card:first-child{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
}
.s-top{display:flex;flex-direction:column;gap:18px}
@media (min-width:1000px) and (orientation:landscape){.s-top{display:grid}}
/* 화면 설정 단추 */
.dock{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:row-reverse;align-items:center;gap:8px;zoom:var(--z,1)}
.dock-main{width:56px;height:56px;border-radius:50%;border:0;background:var(--plate);box-shadow:var(--shadow);font-size:24px;transition:transform .3s}
.dock.open .dock-main{transform:rotate(90deg)}
.dock-panel{display:none;align-items:center;gap:6px;background:var(--plate);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:var(--shadow)}
.dock.open .dock-panel{display:flex;animation:pop .3s ease-out}
.dock-t{font-family:var(--display);font-size:15px;color:var(--sub);white-space:nowrap}

.dock-panel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

#app.wide{max-width:1500px}
/* 📺 칠판 화면 */
.board h2{font-size:32px}

.g-cell.today{box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--accent) 40%,var(--line)),0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.g-cell:disabled{cursor:default;opacity:.8}
.okbox{background:color-mix(in srgb,var(--good) 14%,var(--plate));color:var(--ink);border-style:solid;border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--plate));color:var(--ink);border-style:solid;border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
i.gd{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--line)}
i.gd.v3{background:#ff6b9d}i.gd.v2{background:#ffb21e}i.gd.v1{background:#b7b0c8}
i.gd.t{outline:2px solid var(--accent);outline-offset:2px}
.g-dots{gap:3px;flex-wrap:wrap;justify-content:center}.g-dots i.gd:nth-child(6){margin-left:6px}
.bar.sm{height:10px}
.gboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gb-card{background:var(--soft);border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:inset 0 -4px 0 var(--line)}
.gb-card.done{background:color-mix(in srgb,var(--gold) 14%,var(--plate))}
.gb-top{display:flex;gap:10px;align-items:center}
.gb-top>div{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.gb-pet{width:64px;height:64px;flex:none;display:grid;place-items:center}
.gb-pet svg{width:100%;height:100%}
.gb-pet.sm{width:44px;height:44px}
.gb-none{font-size:30px;opacity:.35}
.gb-name{font-family:var(--display);font-weight:400;font-size:20px}
.gb-goal{font-size:15px;overflow-wrap:anywhere}
.g-td{max-width:340px;overflow-wrap:anywhere}
.me-cookie{overflow:visible}
.me-pet{position:absolute;right:-6%;bottom:-4%;width:46%;aspect-ratio:1/1;display:block;cursor:pointer;filter:drop-shadow(0 6px 8px rgba(58,47,87,.18))}
.me-pet svg{width:100%;height:100%;animation:bob 2.2s ease-in-out infinite;animation-delay:-.6s}
.me-pet.hop svg{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}

.bc-cookie{position:relative}
.bc-pet{position:absolute;right:-28px;bottom:-8px;width:50px;height:50px}
.bc-pet svg{width:100%;height:100%}
.petpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;text-align:center}
.petpick button{border:0;background:var(--soft);border-radius:22px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 -4px 0 var(--line)}
.petpick button svg{width:100px;height:100px}
.petpick button b{font-family:var(--display);font-weight:400;font-size:18px}.petpick button small{font-size:12px;color:var(--sub)}
.petpick button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--plate));box-shadow:inset 0 -4px 0 var(--accent),0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.hatch svg,.eatpet svg{width:180px;height:180px}
.hatch svg{animation:wiggle .6s ease-in-out 3}
.eatpet svg{animation:bob 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.hero-logo svg,.me-pet svg,.hatch svg,.eatpet svg{animation:none!important}}
/* ===== 하모하 쿠키 ===== */
.hamo{background:linear-gradient(120deg,color-mix(in srgb,#fcd31a 14%,var(--plate)),color-mix(in srgb,#cb6fe2 10%,var(--plate)) 55%,color-mix(in srgb,#004caf 10%,var(--plate)))}
.hamo-wrap{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px;align-items:center}

.hamo-ck.sm{width:120px;flex:none}

.hamo-bar{height:22px}.hamo-bar i{background:linear-gradient(90deg,#01854e,#fcd31a,#e6142d,#cb6fe2,#004caf)!important}
.hamo-n{color:var(--accent);font-family:var(--display);font-size:1.15em}
.hamo-mini{flex-direction:row;align-items:center;gap:16px;background:linear-gradient(120deg,color-mix(in srgb,#fcd31a 12%,var(--plate)),color-mix(in srgb,#004caf 8%,var(--plate)))}

<script>
const FLAVORS=[

 {id:'milk',name:'우유',dough:'#f6e7c9',edge:'#d6b98a',chip:'#c9975a',raw:'#fdf5e6',icing:'#ffffff',sp:['#9cc7e8','#ffb3c6','#ffe08a']},
 {id:'matcha',name:'말차',dough:'#a9c97a',edge:'#759a45',chip:'#46622a',raw:'#d6e6bd',icing:'#f1f8e2',sp:['#ff8fab','#ffffff','#f6d860']},
 {id:'lemon',name:'레몬',dough:'#f6d966',edge:'#d9ad2c',chip:'#f08c12',raw:'#fbedb3',icing:'#fffbea',sp:['#7bd389','#ff8fab','#7bc8f6']},
 {id:'blue',name:'블루베리',dough:'#a9a3e0',edge:'#6f66b8',chip:'#3c2f86',raw:'#d9d6f3',icing:'#f3f1ff',sp:['#ff8fab','#ffffff','#ffd166']},

];
const STAGES=[

 {name:'구운 쿠키',desc:'노릇하게 구워져서 눈을 떴어요. 머리에 맛 장식이 생겼어요.',min:10},

 {name:'리본 쿠키',desc:'멋진 리본을 매고 활짝 웃는 쿠키가 되었어요.',min:70},

 {name:'전설의 쿠키',desc:'날개와 무지개 빛을 두른, 우리 반 최고의 쿠키예요.',min:190}
];
let uid=0;
const star=(x,y,r,c,cls='')=>`<path class="${cls}" style="transform-origin:${x}px ${y}px" d="M${x} ${y-r} Q${x+r*.18} ${y-r*.18} ${x+r} ${y} Q${x+r*.18} ${y+r*.18} ${x} ${y+r} Q${x-r*.18} ${y+r*.18} ${x-r} ${y} Q${x-r*.18} ${y-r*.18} ${x} ${y-r}Z" fill="${c}"/>`;
function topper(id,x,y,k){
  let s='';
  if(id==='berry') s=`<path d="M0 -10 C10 -10 14 0 8 10 C4 16 -4 16 -8 10 C-14 0 -10 -10 0 -10Z" fill="#e8384f"/><g fill="#ffe08a"><circle cx="-4" cy="-2" r="1.3"/><circle cx="4" cy="0" r="1.3"/><circle cx="0" cy="6" r="1.3"/><circle cx="-3" cy="9" r="1.1"/><circle cx="4" cy="8" r="1.1"/></g><path d="M-9 -9 L-3 -11 L0 -17 L3 -11 L9 -9 L3 -7 L0 -10 L-3 -7Z" fill="#4caf50"/>`;
  if(id==='choco') s=`<path d="M0 -16 C2 -8 12 -2 12 6 C12 13 6 16 0 16 C-6 16 -12 13 -12 6 C-12 -2 -2 -8 0 -16Z" fill="#4a2818"/><path d="M-5 0 C-6 4 -5 8 -2 10" stroke="#8a5a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(id==='milk') s=`<path d="M0 -16 C2 -8 12 -2 12 6 C12 13 6 16 0 16 C-6 16 -12 13 -12 6 C-12 -2 -2 -8 0 -16Z" fill="#ffffff" stroke="#8fbde3" stroke-width="2.5"/><circle cx="-4" cy="4" r="2.6" fill="#cfe5f7"/>`;

  if(id==='lemon') s=`<circle r="13" fill="#ffe066" stroke="#f0b400" stroke-width="3"/><g stroke="#fff6c8" stroke-width="2"><path d="M0 -10 V10 M-10 0 H10 M-7 -7 L7 7 M7 -7 L-7 7"/></g><circle r="2.5" fill="#fff6c8"/>`;
  if(id==='blue') s=`<circle cx="-6" cy="3" r="8" fill="#4b3fa8"/><circle cx="6" cy="3" r="8" fill="#5d50c4"/><circle cx="0" cy="-7" r="8" fill="#6f62d6"/><path d="M-2 -10 L0 -13 L2 -10" stroke="#2c2370" stroke-width="2" fill="none"/><circle cx="-8" cy="0" r="2" fill="#fff" opacity=".5"/>`;
  if(id==='mint') s=`<path d="M-13 12 Q-15 2 -6 2 Q-12 -6 -3 -8 Q-4 -16 5 -16 Q2 -8 9 -6 Q16 2 10 4 Q16 6 13 12Z" fill="#c8f2e8" stroke="#4fae98" stroke-width="2"/><circle cx="-4" cy="5" r="2" fill="#3b2014"/><circle cx="5" cy="-4" r="1.8" fill="#3b2014"/>`;
  return `<g transform="translate(${x} ${y}) scale(${k})">${s}</g>`;
}
function cookie(f,s){
  uid++; const g='c'+uid; let o=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${f.name} ${STAGES[s].name}"><defs>
   <clipPath id="${g}cl"><circle cx="100" cy="108" r="59"/></clipPath>
   <radialGradient id="${g}gl"><stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/><stop offset=".6" stop-color="#ffd86b" stop-opacity=".35"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
   <linearGradient id="${g}rb" x1="0" x2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".25" stop-color="#ffd166"/><stop offset=".5" stop-color="#5dd39e"/><stop offset=".75" stop-color="#5aa9ff"/><stop offset="1" stop-color="#b47cff"/></linearGradient></defs>`;
  if(s>=6) o+=`<circle cx="100" cy="108" r="96" fill="url(#${g}gl)"/>`;
  if(s>=7){
    o+=`<circle class="spin" cx="100" cy="108" r="84" fill="none" stroke="url(#${g}rb)" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round" opacity=".85"/>`;
    const w=`<path d="M44 98 C14 72 2 108 18 118 C6 126 18 142 32 134 C26 146 42 150 50 132Z" fill="#ffffff" stroke="#bcd6f5" stroke-width="2.5"/>`;
    o+=w+`<g transform="translate(200 0) scale(-1 1)">${w}</g>`;
  }
  if(s===0){
    o+=`<ellipse cx="100" cy="168" rx="58" ry="7" fill="#000" opacity=".08"/>
    <path d="M100 56 C142 52 170 80 165 114 C161 150 134 170 99 168 C62 170 34 148 37 112 C40 78 62 58 100 56Z" fill="${f.raw}" stroke="${f.dough}" stroke-width="4"/>

  } else {
    o+=`<ellipse cx="100" cy="172" rx="56" ry="7" fill="#000" opacity=".1"/>
    <circle cx="100" cy="108" r="62" fill="${f.dough}" stroke="${f.edge}" stroke-width="6"/>
    <ellipse cx="78" cy="78" rx="22" ry="9" transform="rotate(-28 78 78)" fill="#fff" opacity=".28"/>`;
    if(s>=2) [[66,80,0],[134,78,40],[50,112,80],[150,114,20],[78,152,60],[124,154,110],[100,166,10]].forEach(([x,y,r])=>{
      o+=`<ellipse cx="${x}" cy="${y}" rx="6.5" ry="5" transform="rotate(${r} ${x} ${y})" fill="${f.chip}"/>`});
  }
  if(s>=3){
    o+=`<g clip-path="url(#${g}cl)"><path d="M30 30 H170 V82 Q160 98 150 84 Q140 100 130 86 Q120 100 110 86 Q100 102 90 86 Q80 100 70 86 Q60 100 50 84 Q40 98 30 82Z" fill="${f.icing}"/>`;
    [[62,70,20],[80,60,-30],[98,72,60],[118,62,10],[136,72,-50],[90,82,30],[124,84,-10],[72,84,70],[108,56,45],[146,84,0]].forEach(([x,y,r],i)=>{

    o+=topper(f.id,152,64,.8);

    o+=`<g transform="translate(100 46)"><path d="M-23 9 L-25 -14 L-11 -2 L0 -19 L11 -2 L25 -14 L23 9Z" fill="#ffcc33" stroke="#d99100" stroke-width="2.5" stroke-linejoin="round"/><rect x="-23" y="4" width="46" height="6" rx="2" fill="#f2b300"/><circle cx="0" cy="-1" r="${s>=6?5:3.8}" fill="${gem}"/><circle cx="-25" cy="-15" r="3" fill="#fff3a6"/><circle cx="0" cy="-20" r="3" fill="#fff3a6"/><circle cx="25" cy="-15" r="3" fill="#fff3a6"/></g>`;
    const sp=s>=7?[[34,56,9],[170,52,8],[22,150,7],[178,156,9],[60,24,6],[146,22,7]]:s>=6?[[34,60,9],[168,96,8],[28,150,7],[172,160,8],[56,26,6]]:[[40,60,8],[164,96,7],[34,150,6]];
    sp.forEach(([x,y,r],i)=>{o+=`<g style="animation-delay:${i*.27}s" class="twinkle">${star(x,y,r,'#ffc928')}</g>`});

const ONLINE=!!(window.firebase&&window.FIREBASE_CONFIG);

function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o)}
const clone=o=>JSON.parse(JSON.stringify(o));
const CLS_FIELDS=['name','roster','roles','th','terms','praiseCfg','reflCfg','draws','goalCfg','petTh','hamoCfg','hamoLv','hamoReset','hamoAwards','hamoSnap'];
const STU_FIELDS=['flavor','balance','seenStage','seenPay','seenPraise','seenRefl','pet','seenPet','seenGoal'];

function pick(o,ks){const r={};ks.forEach(k=>{if(o&&o[k]!==undefined)r[k]=o[k]});return r}

function onlineInit(){
  firebase.initializeApp(window.FIREBASE_CONFIG);

  DB={v:1,teacherPw:null,classes:[],fakeToday:null};
  AUTH.onAuthStateChanged(async u=>{
    if(!u){try{await AUTH.signInAnonymously()}catch(e){showNet('인터넷 연결을 확인해 주세요. ('+e.code+')')}return}
    UID=u.uid;
    FS.collection('config').doc('teacherPwSet').onSnapshot(d=>{TPW_SET=d.exists;TPW_KNOWN=true;DB.teacherPw=TPW_SET?'•':null;markReady()},e=>showNet(e.message));
    FS.collection('classes').onSnapshot(qs=>{
      const seen=new Set();
      qs.forEach(d=>{seen.add(d.id);(REMOTE[d.id]=REMOTE[d.id]||{}).cls=d.data()});
      Object.keys(REMOTE).forEach(cid=>{if(!seen.has(cid)){delete REMOTE[cid];delete BASE[cid]}});
      CLASSLIST_OK=true;rebuildAll();markReady();
    },e=>showNet(e.message));
    /* 이 기기의 교사 모드가 아직 유효한지 */

function markReady(){if(!READY&&CLASSLIST_OK&&TPW_KNOWN&&AUTH_DONE){READY=true;render();return}schedule()}

/* 화면에 따라 필요한 데이터만 실시간으로 받기 */
function ensureSubs(){
  if(!ONLINE||!UID)return;
  let key='';const v=V.view;
  if(v==='teacher'&&ROLE==='teacher'){const c=curCls();if(c)key='T|'+c.id}
  else if((v==='sName'||v==='sPw')&&V.cid)key='P|'+V.cid;
  else if((v==='student'||v==='sFlavor'||v==='sLoading')&&ROLE&&ROLE.cid)key='S|'+ROLE.cid+'|'+ROLE.name;
  if(key===SUBKEY)return;
  SUBS.forEach(u=>u());SUBS=[];SUBKEY=key;
  Object.keys(REMOTE).forEach(cid=>{const r=REMOTE[cid];REMOTE[cid]={cls:r.cls}});
  Object.keys(BASE).forEach(k=>delete BASE[k]);
  if(!key){rebuildAll();return}
  const [mode,cid,name]=key.split('|');const col=n=>cref(cid).collection(n);
  const parts=[];
  const mapColl=(n,q)=>parts.push([n,q||col(n)]);
  if(mode==='P'){mapColl('pwset',col('studentPwSet'))}
  if(mode==='T'){['checks','weekly','paid','students','praises','refls','payrolls','apps','goals'].forEach(n=>mapColl(n));mapColl('pw',col('studentPw'));mapColl('pwset',col('studentPwSet'))}
  if(mode==='S'){['checks','weekly','paid','students','payrolls','apps','goals'].forEach(n=>mapColl(n));mapColl('pok',col('praiseOk'));mapColl('pwset',col('studentPwSet'));
    mapColl('praises',col('praises').where('from','==',name));mapColl('refls',col('refls').where('name','==',name))}
  SUBWAIT=parts.length;const got=new Set();
  parts.forEach(([n,q])=>{SUBS.push(q.onSnapshot(qs=>{
    const m={};qs.forEach(d=>m[d.id]=d.data());(REMOTE[cid]=REMOTE[cid]||{})[n]=m;
    if(!got.has(n)){got.add(n);SUBWAIT--}
    if(n==='pwset'&&ROLE&&ROLE.cid===cid&&mode==='S'&&!m[ROLE.name]){forceOut('비밀번호가 바뀌어서 다시 들어와야 해요.');return}
    rebuildAll();
  },e=>{console.warn(n,e);if(!got.has(n)){got.add(n);SUBWAIT--}if(e.code==='permission-denied'&&mode==='S')forceOut('다시 들어와 주세요.');schedule()}))});
}
function forceOut(msg){ROLE=null;V={view:'home'};SUBKEY='__';closeModal();toast(msg);render()}

/* 서버 데이터 → 화면용 학급 */
function rebuildAll(){
  const list=[];
  Object.keys(REMOTE).forEach(cid=>{const R=REMOTE[cid];if(!R.cls)return;list.push(buildClass(cid,R))});
  list.sort((a,b)=>(a._created||0)-(b._created||0)||a.name.localeCompare(b.name));
  DB.classes=list;
  list.forEach(c=>{if(SUBKEY.split('|')[1]===c.id&&SUBWAIT===0)BASE[c.id]=clone(c)});
  schedule();
}
function buildClass(cid,R){
  const b=R.cls||{};
  const c={id:cid,_created:b.created||0,name:b.name||'',roster:b.roster||[],roles:b.roles||[],th:b.th||DEFAULT_TH.slice(),terms:b.terms||[],
    praiseCfg:b.praiseCfg||{bonus:1,limit:2,approve:true},reflCfg:b.reflCfg||{bonus:2},draws:b.draws||{},apps:{},goalCfg:b.goalCfg||{bonus:3,rBonus:2},petTh:b.petTh||PET_TH.slice(),goals:[],hamoCfg:b.hamoCfg||null,hamoLv:b.hamoLv||0,hamoReset:b.hamoReset||'',hamoAwards:b.hamoAwards||[],hamoSnap:b.hamoSnap||null,
    checks:{},weekly:{},paid:{},students:{},praises:[],refls:[],payrolls:[]};
  Object.entries(R.checks||{}).forEach(([k,d])=>c.checks[k]=d.v);
  Object.entries(R.weekly||{}).forEach(([k,d])=>c.weekly[k]=d.v);
  Object.entries(R.paid||{}).forEach(([k,d])=>c.paid[k]=d.pid);
  Object.entries(R.apps||{}).forEach(([k,d])=>c.apps[k]={tid:d.tid,round:d.round,roleId:d.roleId});
  Object.entries(R.students||{}).forEach(([n,d])=>c.students[n]={flavor:null,balance:0,seenStage:-1,seenPay:null,seenPraise:[],seenRefl:[],...pick(d,STU_FIELDS),pw:null});
  const pwset=R.pwset||{},pw=R.pw||null;
  Object.keys(pwset).forEach(n=>{c.students[n]=c.students[n]||{flavor:null,balance:0,seenStage:-1,seenPay:null,seenPraise:[],seenRefl:[]};c.students[n].pw=pw&&pw[n]?pw[n].pw:'•'});
  c.praises=Object.entries(R.praises||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.created||0)-(b.created||0));
  c.refls=Object.entries(R.refls||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.created||0)-(b.created||0));
  c.payrolls=Object.entries(R.payrolls||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.created||0)-(b.created||0));
  c.goals=Object.entries(R.goals||{}).map(([id,d])=>({id,...d})).sort((a,b)=>(a.created||0)-(b.created||0));
  if(R.pok)c._pok=R.pok;
  return c;
}

async function syncDiff(){
  if(!ONLINE||!READY)return;
  const isT=ROLE==='teacher',me=ROLE&&ROLE.name,myCid=ROLE&&ROLE.cid;const ops=[];
  const set=(ref,data,merge)=>ops.push(b=>merge?b.set(ref,data,{merge:true}):b.set(ref,data));
  const del=ref=>ops.push(b=>b.delete(ref));
  if(isT){
    Object.keys(REMOTE).forEach(cid=>{if(REMOTE[cid].cls&&!DB.classes.find(c=>c.id===cid)){
      const B=BASE[cid];if(B){
        Object.keys(B.checks).forEach(k=>del(cref(cid).collection('checks').doc(k)));
        Object.keys(B.weekly).forEach(k=>del(cref(cid).collection('weekly').doc(k)));
        Object.keys(B.paid).forEach(k=>del(cref(cid).collection('paid').doc(k)));
        B.praises.forEach(p=>{del(cref(cid).collection('praises').doc(p.id));del(cref(cid).collection('praiseOk').doc(p.id))});
        B.refls.forEach(r=>del(cref(cid).collection('refls').doc(r.id)));
        B.payrolls.forEach(p=>del(cref(cid).collection('payrolls').doc(p.id)));
        Object.keys(B.apps||{}).forEach(k=>del(cref(cid).collection('apps').doc(k)));
        (B.goals||[]).forEach(g=>del(cref(cid).collection('goals').doc(g.id)));
        Object.keys(B.students).forEach(n=>{del(cref(cid).collection('students').doc(n));del(cref(cid).collection('studentPw').doc(n));del(cref(cid).collection('studentPwSet').doc(n))});
      }
      del(cref(cid));delete BASE[cid];
    }});
  }
  for(const c of DB.classes){
    const R=REMOTE[c.id];
    if(!R||!R.cls){if(isT){set(cref(c.id),{...pick(c,CLS_FIELDS),draws:c.draws||{},praiseCfg:c.praiseCfg||{bonus:1,limit:2,approve:true},reflCfg:c.reflCfg||{bonus:2},created:Date.now()})}continue}
    const B=BASE[c.id];if(!B)continue;
    const ref=cref(c.id),col=n=>ref.collection(n);
    if(isT&&stable(pick(c,CLS_FIELDS))!==stable(pick(B,CLS_FIELDS))){const data=pick(c,CLS_FIELDS);ops.push(b=>b.update(ref,data))}
    if(isT||myCid===c.id){const A=c.apps||{},O=B.apps||{};new Set([...Object.keys(A),...Object.keys(O)]).forEach(k=>{if(stable(A[k]||null)===stable(O[k]||null))return;if(!isT&&k!==me)return;
      A[k]?set(col('apps').doc(k),{tid:A[k].tid,round:A[k].round,roleId:A[k].roleId}):del(col('apps').doc(k))})}
    const mine=k=>k.split('|')[0]===me;
    if(isT||myCid===c.id){
      new Set([...Object.keys(c.checks),...Object.keys(B.checks)]).forEach(k=>{if(c.checks[k]===B.checks[k])return;if(!isT&&!mine(k))return;
        c.checks[k]?set(col('checks').doc(k),{v:c.checks[k],name:k.split('|')[0]}):del(col('checks').doc(k))});
    }
    if(isT){
      new Set([...Object.keys(c.weekly),...Object.keys(B.weekly)]).forEach(k=>{if(c.weekly[k]===B.weekly[k])return;
        c.weekly[k]!=null?set(col('weekly').doc(k),{v:+c.weekly[k]||0,name:k.split('|')[2]}):del(col('weekly').doc(k))});
      new Set([...Object.keys(c.paid),...Object.keys(B.paid)]).forEach(k=>{if(c.paid[k]===B.paid[k])return;
        c.paid[k]?set(col('paid').doc(k),{pid:c.paid[k]}):del(col('paid').doc(k))});
    }
    /* 학생 문서 */
    new Set([...Object.keys(c.students),...Object.keys(B.students)]).forEach(n=>{
      const a=c.students[n],o=B.students[n];
      if(isT){
        if(a&&stable(pick(a,STU_FIELDS))!==stable(pick(o||{},STU_FIELDS)))set(col('students').doc(n),pick(a,STU_FIELDS),true);
        if(o&&o.pw&&a&&!a.pw){del(col('studentPw').doc(n));del(col('studentPwSet').doc(n))}
        if(o&&!a){del(col('students').doc(n))}
      }else if(myCid===c.id&&n===me&&a){
        if(stable(pick(a,STU_SELF))!==stable(pick(o||{},STU_SELF)))set(col('students').doc(n),pick(a,STU_SELF),true);
      }
    });
    /* 칭찬 */
    const pm=Object.fromEntries(B.praises.map(p=>[p.id,p]));
    c.praises.forEach(p=>{const o=pm[p.id];delete pm[p.id];if(o&&stable(o)===stable(p))return;if(!isT&&p.from!==me)return;
      const {id,...d}=p;set(col('praises').doc(id),{...d,created:d.created||Date.now()});
      if(p.status==='ok')set(col('praiseOk').doc(id),{to:p.to,bonus:+p.bonus||0});else if(isT&&o&&o.status==='ok')del(col('praiseOk').doc(id))});
    Object.values(pm).forEach(p=>{if(!isT&&p.from!==me)return;del(col('praises').doc(p.id));if(isT)del(col('praiseOk').doc(p.id))});
    /* 소감 */
    const rm=Object.fromEntries(B.refls.map(r=>[r.id,r]));
    c.refls.forEach(r=>{const o=rm[r.id];delete rm[r.id];if(o&&stable(o)===stable(r))return;if(!isT&&r.name!==me)return;
      const {id,...d}=r;set(col('refls').doc(id),{...d,created:d.created||(o&&o.created)||Date.now()})});
    if(isT)Object.values(rm).forEach(r=>del(col('refls').doc(r.id)));
    /* 2주 목표 */
    const gm=Object.fromEntries((B.goals||[]).map(g=>[g.id,g]));
    (c.goals||[]).forEach(g=>{const o=gm[g.id];delete gm[g.id];if(o&&stable(o)===stable(g))return;if(!isT&&g.name!==me)return;
      const {id,...d}=g;set(col('goals').doc(id),{...d,created:d.created||(o&&o.created)||Date.now()})});
    if(isT)Object.values(gm).forEach(g=>del(col('goals').doc(g.id)));
    /* 월급 */
    if(isT){const qm=Object.fromEntries(B.payrolls.map(p=>[p.id,p]));
      c.payrolls.forEach(p=>{const o=qm[p.id];delete qm[p.id];if(o&&stable(o)===stable(p))return;const {id,...d}=p;set(col('payrolls').doc(id),{...d,created:d.created||Date.now()})});
      Object.values(qm).forEach(p=>del(col('payrolls').doc(p.id)))}
    BASE[c.id]=clone(c);
  }
  if(!ops.length)return;
  try{for(let i=0;i<ops.length;i+=400){const b=FS.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
  catch(e){console.warn(e);toast(e.code==='permission-denied'?'저장할 수 없어요. 다시 들어와 주세요.':'저장하지 못했어요. 인터넷을 확인해 주세요.');rebuildAll()}
}

let _rt=null,_pend=false;
function schedule(){clearTimeout(_rt);_rt=setTimeout(()=>{const a=document.activeElement;
  if(a&&a.closest&&a.closest('#app,#layer')&&a.matches('input[type=text],input[type=password],input[type=number],input[type=date],textarea')){_pend=true;return}
  render()},60)}
document.addEventListener('focusout',()=>{if(_pend){_pend=false;setTimeout(schedule,30)}});
/* ===== 1인 1역 신청·추첨 (class-role-draw 흐름) =====
   선생님: 신청 받기 → 마감 → 역할별 자동 합격/돌림판 추첨 → 2차 신청 → 남은 자리 무작위 → 기간 역할 배정에 반영
   학생: 자기 태블릿에서 역할 하나 신청(마감 전까지 바꾸기 가능), 결과 실시간 */
const seatsOf=r=>Math.max(1,parseInt(r&&r.seats)||1);
const drawRolesOf=c=>c.roles.filter(r=>!r.off);
function fixDraw(c){c.draws=c.draws||{};c.apps=c.apps||{};return c}
function activeDraw(c){fixDraw(c);const ts=termsSorted(c);
  for(let i=ts.length-1;i>=0;i--){const d=c.draws[ts[i].id];if(d&&d.status!=='done')return{t:ts[i],d}}return null}
function studentDraw(c){fixDraw(c);const a=activeDraw(c);if(a)return a;const td=today();
  const ts=termsSorted(c);for(let i=ts.length-1;i>=0;i--){const d=c.draws[ts[i].id];if(d&&d.status==='done'&&addDays(ts[i].start,4)>=td)return{t:ts[i],d}}return null}
const takenOf=(d,rid)=>Object.values(d.results||{}).filter(x=>x===rid).length;
const leftOf=(d,r)=>seatsOf(r)-takenOf(d,r.id);
const unassignedOf=(c,d)=>c.roster.filter(n=>!(d.results||{})[n]);
function appsNow(c,t,d){fixDraw(c);const o={};c.roster.forEach(n=>{const a=c.apps[n];if(a&&a.tid===t.id&&a.round===d.round&&!(d.results||{})[n])o[n]=a.roleId});return o}
function applicantsOf(c,t,d,rid){const a=appsNow(c,t,d);return Object.keys(a).filter(n=>a[n]===rid)}
function seatSummary(c){const s=drawRolesOf(c).reduce((a,r)=>a+seatsOf(r),0),n=c.roster.length;
  return {s,n,txt:`학생 ${n}명 · 자리 ${s}개 · ${s===n?'딱 맞아요':s>n?`자리가 ${s-n}개 남아요`:`자리가 ${n-s}개 부족해요`}`,cls:s===n?'good':s>n?'gold':'warn'}}
function roundDone(c,t,d){return drawRolesOf(c).every(r=>(d.doneRoles||[]).includes(r.id)||!applicantsOf(c,t,d,r.id).length)}
function drawTerm(c){const ts=termsSorted(c);return c.terms.find(x=>x.id===V.tsel)||(activeDraw(c)||{}).t||ts[ts.length-1]}

/* 선생님 화면 */
function drawPanel(c,t,big){
  fixDraw(c);if(!t)return '';const d=c.draws[t.id];const ss=seatSummary(c);const roles=drawRolesOf(c);
  if(!d){return `<section class="card draw ${big?'big':''}"><div class="spread"><div><h2>🎲 ${t.no}기 1인 1역 신청·추첨</h2><p class="muted">학생들이 자기 태블릿에서 하고 싶은 역할을 하나씩 신청해요. 자리보다 신청이 많으면 돌림판으로 뽑아요.</p></div><span class="pill ${ss.cls}">${ss.txt}</span></div>
    ${roles.length?`<div><button class="btn main" data-act="drStart" data-t="${t.id}">📣 신청 받기 시작</button></div>`:'<p class="note">역할을 먼저 추가하고 자리 수를 정해 주세요.</p>'}</section>`}
  const a=appsNow(c,t,d);const un=unassignedOf(c,d);const notApplied=un.filter(n=>!a[n]);
  const rows=roles.map(r=>{const apps=applicantsOf(c,t,d,r.id);const left=leftOf(d,r);const won=Object.keys(d.results||{}).filter(n=>d.results[n]===r.id);
    const done=(d.doneRoles||[]).includes(r.id);const over=apps.length>left;
    let act='';
    if(d.status==='draw'&&apps.length&&!done&&left>0)act=`<button class="btn sm ${over?'gold':'main'}" data-act="drRole" data-r="${r.id}">${over?'🎡 뽑기':'✅ 자동 합격'}</button>`;
    else if(d.status==='draw'&&done)act='<span class="pill good">끝</span>';
    return `<div class="drow ${left<=0?'full':''}"><div class="dr-name"><span class="ic">${esc(r.icon)}</span><b>${esc(r.name)}</b><span class="pill ${left<=0?'':'gold'}">남은 자리 ${Math.max(0,left)}/${seatsOf(r)}</span></div>
      <div class="dr-apps">${won.map(n=>`<span class="chip won">🎉 ${esc(n)}</span>`).join('')}${apps.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}${!won.length&&!apps.length?'<span class="muted small">아직 없어요</span>':''}</div>
      <div class="dr-act">${apps.length?`<span class="pill ${over?'warn':'good'}">신청 ${apps.length}</span>`:''}${act}</div></div>`}).join('');
  const head=d.status==='done'?`✅ ${t.no}기 역할이 모두 정해졌어요`:d.status==='apply'?`📣 ${d.round}차 신청 받는 중`:`🎡 ${d.round}차 추첨`;
  let foot='';
  if(d.status==='apply')foot=`<div class="row"><button class="btn gold" data-act="drClose">⏹ 신청 마감하고 추첨하기</button>${V.drCancel?`<button class="btn danger" data-act="drCancel">정말 그만두기</button>`:`<button class="btn" data-act="drAskCancel">그만두기</button>`}</div>`;
  else if(d.status==='draw'){const rd=roundDone(c,t,d);const seatsLeft=roles.reduce((s,r)=>s+Math.max(0,leftOf(d,r)),0);
    foot=`<div class="row">${!rd?`<button class="btn gold" data-act="drAll">⚡ 한 번에 뽑기</button>`:''}
      ${rd&&un.length&&seatsLeft?`<button class="btn main" data-act="drNext">📣 ${d.round+1}차 신청 받기 (남은 자리)</button><button class="btn" data-act="drRandom">🎲 남은 자리 무작위 배정</button>`:''}
      ${rd&&(!un.length||!seatsLeft)?`<button class="btn main" data-act="drFinish">✅ 역할 배정에 반영하기</button>`:''}</div>
      ${rd&&un.length&&!seatsLeft?`<p class="note">자리가 모자라서 ${un.length}명이 남았어요. 역할 배정 표에서 직접 정해 주세요.</p>`:''}`}
  else foot=`<div class="row"><button class="btn" data-act="drCopy" data-t="${t.id}">📋 결과 복사</button>${V.drRedo?`<button class="btn danger" data-act="drStart" data-t="${t.id}">정말 다시 신청 받기</button>`:`<button class="btn" data-act="drAskRedo">다시 신청 받기</button>`}</div><p class="note">결과가 ${t.no}기 역할 배정에 들어갔어요. 아래 표에서 직접 고칠 수도 있어요.</p>`;
  return `<section class="card draw ${big?'big':''}"><div class="spread"><div><h2>${head}</h2><p class="muted">${t.no}기 (${md(t.start)}~${md(addDays(t.start,11))}) · 정해진 친구 ${c.roster.length-un.length}/${c.roster.length}</p></div><span class="pill ${ss.cls}">${ss.txt}</span></div>
    <div class="drows">${rows}</div>
    ${d.status!=='done'&&un.length?`<div><h3>${d.status==='apply'?'아직 신청 안 한 친구':'이번 차례에 정해지지 않은 친구'} <span class="muted small">${d.status==='apply'?notApplied.length:un.length}명</span></h3><div class="row">${(d.status==='apply'?notApplied:un).map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<span class="pill good">모두 신청했어요</span>'}</div></div>`:''}
    ${foot}</section>`;
}

/* 학생 화면 */
function studentDrawCard(c,n){

  return `<section class="card draw-me"><div class="spread"><h2>📣 ${t.no}기 1인 1역 ${d.round}차 신청</h2><span class="pill ${myPick?'good':'warn'}">${myPick?'신청했어요':'아직 안 했어요'}</span></div>
    <p class="muted">하고 싶은 역할을 <b>하나</b> 골라요. 마감 전까지 바꿀 수 있어요. 자리보다 신청이 많으면 추첨해요.</p>
    <div class="dpick">${roles.map(r=>{const left=leftOf(d,r);if(left<=0)return '';const cnt=Object.values(ap).filter(x=>x===r.id).length;
      return `<button data-act="drApply" data-r="${r.id}" aria-pressed="${myPick===r.id}"><span class="ic">${esc(r.icon)}</span><b>${esc(r.name)}</b><small>신청 ${cnt} · 자리 ${left}</small>${cnt>left?'<i class="hot">추첨</i>':''}</button>`}).join('')}</div></section>`;

/* 돌림판 */
function rint(n){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function pickWinners(names,k){const pool=names.slice(),w=[];for(let i=0;i<k&&pool.length;i++)w.push(pool.splice(rint(pool.length),1)[0]);return w}
function roulette(role,names,winners){
  return new Promise(res=>{
    if(RM()){res();return}
    modal(`<div class="roul"><h2>${esc(role.icon)} ${esc(role.name)}</h2><p class="muted">신청 ${names.length}명 · 자리 ${winners.length}개</p>

/* ===== 🍪 하모하 쿠키: 우리 반 모두의 힘으로 자라는 반 쿠키 =====
   하모하 힘 = 1인 1역 체크 + 2주 목표 체크 + 목표 인정 + 소감·돌아보기 채택 + 칭찬 인정 + '모두 함께' 보너스
   단계가 오르면 반 친구 모두에게 보너스 쿠키. 선생님이 원할 때 처음부터 다시 키우기. */
const HAMO_PTS_DEF={r3:3,r2:2,r1:1,g3:2,g2:1,goalOk:10,adopt:5,praise:3,all:20};
const HAMO_PER=[0,3,9,17,29,43,62];
const HAMO_PT_LABEL=[['r3','1인 1역 체크 ★★★'],['r2','1인 1역 체크 ★★'],['r1','1인 1역 체크 ★'],['g3','목표 하루 ⭕'],['g2','목표 하루 🔺'],['goalOk','목표 성실 인정'],['adopt','소감·돌아보기 채택'],['praise','칭찬 인정 (보낸 친구)'],['all','🌈 모두 함께 (그날 모두 체크)']];
function fixHamo(c){c.hamoCfg=c.hamoCfg||{};c.hamoCfg.pts={...HAMO_PTS_DEF,...(c.hamoCfg.pts||{})};if(c.hamoCfg.bonus==null)c.hamoCfg.bonus=2;
  c.hamoAwards=c.hamoAwards||[];c.hamoLv=c.hamoLv||0;c.hamoReset=c.hamoReset||'';return c}
const hamoTh=c=>{fixHamo(c);const n=Math.max(1,c.roster.length);return c.hamoCfg.th&&c.hamoCfg.th.length===7?c.hamoCfg.th:HAMO_PER.map(v=>v*n)};
const hamoStageOf=(c,p)=>{const th=hamoTh(c);let s=0;th.forEach((m,i)=>{if(p>=m)s=i});return s};
const tsDay=t=>t?ymd(new Date(t)):'';
/* from 이상 to 이하 날짜의 힘 계산 */
function hamoCalc(c,from,to){
  fixHamo(c);const P=c.hamoCfg.pts;from=from||'';to=to||today();const per={};const add=(n,v)=>{if(v)per[n]=(per[n]||0)+v};
  const inR=d=>d&&d>=from&&d<=to;const byDay={};
  for(const k in c.checks){const [n,d]=k.split('|');if(!inR(d))continue;const v=c.checks[k];add(n,v===3?P.r3:v===2?P.r2:P.r1);(byDay[d]=byDay[d]||new Set()).add(n)}
  (c.goals||[]).forEach(g=>{for(const d in (g.checks||{})){if(!inR(d))continue;const v=g.checks[d];add(g.name,v===3?P.g3:v===2?P.g2:0)}
    const t=c.terms.find(x=>x.id===g.tid);const end=t?addDays(t.start,11):'';
    if(g.status==='ok'&&inR(tsDay(g.okAt)||end))add(g.name,P.goalOk);
    if(g.rStatus==='ok'&&inR(tsDay(g.rOkAt)||end))add(g.name,P.adopt)});
  (c.refls||[]).forEach(r=>{if(r.status==='ok'&&inR(r.date))add(r.name,P.adopt)});
  (c.praises||[]).forEach(p=>{if(p.status==='ok'&&inR(p.date))add(p.from,P.praise)});

function fixCls(c){c.praises=c.praises||[];c.praiseCfg=c.praiseCfg||{bonus:1,limit:2,approve:true};c.refls=c.refls||[];c.reflCfg=c.reflCfg||{bonus:2};c.draws=c.draws||{};c.apps=c.apps||{};c.goals=c.goals||[];c.goalCfg=c.goalCfg||{bonus:3,rBonus:2};c.petTh=c.petTh||PET_TH.slice();fixHamo(c);return c}
const okRefls=(c,n)=>fixCls(c).refls.filter(r=>r.name===n&&r.status==='ok');
const okPraises=(c,n)=>{fixCls(c);if(c._pok)return Object.entries(c._pok).filter(([id,v])=>v.to===n).map(([id,v])=>({id,to:v.to,bonus:v.bonus,status:'ok'}));return c.praises.filter(p=>p.to===n&&p.status==='ok')};
function grown(c,n){let s=0;for(const k in c.weekly){if(k.split('|')[2]===n)s+=+c.weekly[k]||0}okPraises(c,n).forEach(p=>s+=+p.bonus||0);okRefls(c,n).forEach(r=>s+=+r.bonus||0);s+=petFood(c,n);hamoAwardsFor(c,n).forEach(a=>s+=+a.bonus||0);return s}
function kval(c,k){if(k.startsWith('h|')){const [,id,n]=k.split('|');const a=(c.hamoAwards||[]).find(x=>x.id===id);return a&&(a.names||[]).includes(n)?+a.bonus||0:0}if(k.startsWith('g|')||k.startsWith('gr|')){const r=k.startsWith('gr|');const g=(c.goals||[]).find(x=>x.id===k.slice(r?3:2));if(!g)return 0;return r?(g.rStatus==='ok'?+g.rBonus||0:0):(g.status==='ok'?+g.bonus||0:0)}if(k.startsWith('r|')){const r=c.refls.find(x=>x.id===k.slice(2));return r&&r.status==='ok'?+r.bonus||0:0}if(k.startsWith('p|')){const p=c.praises.find(x=>x.id===k.slice(2));return p&&p.status==='ok'?+p.bonus||0:0}return +c.weekly[k]||0}
function stageOf(c,total){let s=0;c.th.forEach((m,i)=>{if(total>=m)s=i});return s}
function unpaidKeys(c,n){return Object.keys(c.weekly).filter(k=>k.split('|')[2]===n&&!c.paid[k]&&(+c.weekly[k]||0)>0).concat(okPraises(c,n).map(p=>'p|'+p.id),okRefls(c,n).map(r=>'r|'+r.id),(c.goals||[]).filter(g=>g.name===n).flatMap(g=>['g|'+g.id,'gr|'+g.id]),hamoAwardsFor(c,n).map(a=>'h|'+a.id+'|'+n)).filter(k=>!c.paid[k]&&kval(c,k)>0)}
const starsOf=(c,n,days)=>days.reduce((s,d)=>s+(c.checks[n+'|'+d]||0),0);
const termLabel=(t,w)=>`${t.no}기 ${w+1}주차`;
const weekRange=(t,w)=>{const d=weekDays(t,w);return `${md(d[0])}~${md(d[4])}`};
function cookieOf(c,n,forceStage){const f=flavorOf(c,n)||FLAVORS[2];const st=forceStage??stageOf(c,grown(c,n));return cookie(f,st)}

function burst(x,y,big){if(RM())return;const n=big?12:7;const sy=big?['✦','★','♥','🍪','✦','●']:['✦','●','★'];const cs=['#ff6b9d','#ffb21e','#7cb8ff','#38c6a6','#b48cff'];
  for(let i=0;i<n;i++){const e=document.createElement('span');e.className='pt';e.textContent=sy[i%sy.length];
    const a=(Math.PI*2*i/n)+Math.random()*.5,d=(big?60:38)+Math.random()*26;
    e.style.left=x+'px';e.style.top=y+'px';e.style.color=cs[i%5];e.style.fontSize=(big?14:11)+Math.random()*8+'px';

    document.body.appendChild(e);setTimeout(()=>e.remove(),750)}
  const r=document.createElement('span');r.className='ring';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),550)}
function floatText(x,y,txt,color){if(RM())return;const e=document.createElement('span');e.className='ftxt';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';if(color)e.style.color=color;document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}

function payRows(c){

    modal(`<div class="celebrate box" style="padding:0;gap:10px;display:flex;flex-direction:column"><div style="font-size:72px">👏</div><h2>칭찬을 받았어요!</h2>${newP.map(p=>`<p><b>${esc(p.from)}</b>: “${esc(p.reason)}”</p>`).join('')}<p><b style="font-family:var(--display);font-size:28px">보너스 🍪 ${newP.reduce((a,p)=>a+(+p.bonus||0),0)}개</b></p><button class="btn main" data-act="close">고마워!</button></div>`);
    return;
  }
  if(lastPay&&s.seenPay!==lastPay.id&&lastPay.items[n]!=null){s.seenPay=lastPay.id;save();confetti();
    modal(`<div class="celebrate box" style="padding:0;gap:10px;display:flex;flex-direction:column"><div style="font-size:72px">💰</div><h2>월급이 들어왔어요!</h2><p>${esc(lastPay.memo||'월급')}<br><b style="font-family:var(--display);font-size:34px">🍪 ${lastPay.items[n]}개</b></p><p class="muted">지금 통장: ${s.balance}개</p><button class="btn main" data-act="close">좋아요!</button></div>`);
  }
}

  const st=kind==='gr'?'rStatus':'status',fd=kind==='gr'?'rBonus':'bonus';if(!it||it[st]!=='ok'||c.paid[kind+'|'+id])return;
  it[fd]=Math.max(0,Math.min(99,v||0));save();clearTimeout(setBonus.t);setBonus.t=setTimeout(()=>{render();toast(`보너스 🍪${it[fd]}개로 바꿨어요.`)},700)}
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset?.chg;if(!k)return;const c=V.view==='teacher'?curCls():null;
  if(k==='cls'){V.cid=el.value;V.wsel=null;V.tsel=null;render()}
  else if(k==='wsel'){V.wsel=el.value;render()}
  else if(k==='tsel'){V.tsel=el.value;render()}
  else if(k==='gsel'){V.gsel=el.value;render()}
  else if(k==='petSet'){const s=stu(c,el.dataset.n);s.pet=el.value||null;if(s.pet)s.seenPet=Math.max(s.seenPet||1,petStage(c,petFood(c,el.dataset.n)));save();render()}
  else if(k==='ck'){const pk=pickWeek(c);const key=wkey(pk.term,pk.w,el.dataset.n);if(el.value==='')delete c.weekly[key];else c.weekly[key]=Math.max(0,parseInt(el.value)||0);save();render()}
  else if(k==='assign'){const ts=termsSorted(c);const t=c.terms.find(x=>x.id===V.tsel)||ts[ts.length-1];if(el.value)t.assign[el.dataset.n]=el.value;else delete t.assign[el.dataset.n];save()}
  else if(k==='adj'){V.adj=V.adj||{};V.adj[el.dataset.n]=parseInt(el.value)||0;keepPayForm();render()}
  else if(k==='bnLive'){setBonus(el.dataset.kind,el.dataset.id,parseInt(el.value)||0)}
  else if(k==='flavor'){if(el.value){stu(c,el.dataset.n).flavor=el.value;save();render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target.matches('input[type=password]')){const b=document.querySelector('[data-act="tLogin"],[data-act="sLogin"]');b&&b.click()}});

/* 화면 크기 맞추기 (태블릿·전자칠판) */
const SCALES={s:.85,m:1,l:1.2,xl:1.45};
function applyScale(){const pref=devGet('cookiePayday:scale')||'m';const w=innerWidth,h=innerHeight;
  let z=w>=1200?Math.min(w/1180,h/720):1;z=Math.max(1,Math.min(z,2.6))*(SCALES[pref]||1);
  if(w<700)z=Math.min(z,1);document.documentElement.style.setProperty('--z',z.toFixed(3));
  document.querySelectorAll('[data-act="scale"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===pref))}
ACT.scale=el=>{devSet('cookiePayday:scale',el.dataset.v);applyScale();toast('글자 크기를 바꿨어요.')};
ACT.dockToggle=()=>{const d=$('dock');d.classList.toggle('open')};
ACT.full=()=>{const d=document;if(d.fullscreenElement){d.exitFullscreen?.();return}
  const p=d.documentElement.requestFullscreen?.();if(p&&p.catch)p.catch(()=>toast('여기서는 전체화면이 안 돼요. 실제 주소에서는 돼요.'));else if(!p)toast('이 기기는 전체화면을 지원하지 않아요.')};
addEventListener('resize',applyScale);
if(ONLINE)onlineInit();else load();applyScale();render();
</script>
