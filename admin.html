<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>작품 올리기 · 클로드 작품 서랍</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F3F5F2;--surface:#FFFFFF;--ink:#1F2A33;--muted:#5F6B72;--line:#D9DED8;--accent:#2E6B5E;--warn:#C0392B;--ok:#2E6B5E;
  --font-display:"Do Hyeon","Noto Sans KR",sans-serif;--font-body:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#151A1D;--surface:#1E252A;--ink:#E7ECEA;--muted:#9AA6AC;--line:#2F383E;--accent:#6FC1AC;--warn:#EE8762;--ok:#6FC1AC;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left,0px)) 64px;display:flex;flex-direction:column;gap:24px}
a{color:var(--accent)}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,6vw,44px);margin:0;line-height:1.1}
h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;border-radius:0;background:transparent;padding:8px 16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}
.thumb{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumb .box{width:192px;aspect-ratio:16/10;border-radius:8px;border:1px dashed var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.msg{border-radius:8px;padding:10px 14px;font-size:14px}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.msg.info{background:var(--bg);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.item span{min-width:0;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.item button{padding:4px 10px;font-size:13px;flex:none}
.hint{font-size:13px;color:var(--muted);margin:0}
#shot{position:fixed;left:-20000px;top:0;width:1280px;height:800px;border:0;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <a href="./">← 작품 서랍으로</a>
    <h1>작품 올리기</h1>
    <p class="sub">만든 사이트(HTML 파일)나 이미 배포한 주소를 올리면 1분 안에 작품 서랍에 나타나요.</p>
  </div>

  <div class="card">
    <label>올리기 비밀번호<input type="password" id="pw" autocomplete="current-password" placeholder="Vercel에 정해 둔 비밀번호"></label>
    <label class="check"><input type="checkbox" id="remember"> 이 기기에서 비밀번호 기억하기</label>
  </div>

  <form class="card" id="form">
    <h2>새 작품</h2>
    <div class="seg" role="group" aria-label="올리는 방식">
      <button type="button" data-mode="file" aria-pressed="true">HTML 파일로</button>
      <button type="button" data-mode="link" aria-pressed="false">주소로</button>
    </div>
    <label id="fileWrap">HTML 파일 (한 파일로 된 사이트, 4MB까지)<input type="file" id="file" accept=".html,.htm,text/html"></label>
    <label id="linkWrap" hidden>작품 주소<input type="url" id="url" placeholder="https://내사이트.vercel.app"></label>
    <label>제목<input type="text" id="title" maxlength="80" required></label>
    <label>한 줄 설명<input type="text" id="desc" maxlength="200"></label>
    <div class="row">
      <label>카테고리<select id="cat">
        <option value="game">게임</option><option value="lesson">수업자료</option><option value="slides">슬라이드·연수</option>
        <option value="design">디자인</option><option value="class">학급 활동</option><option value="plan">계획·기획</option>
        <option value="tool">도구</option><option value="video">영상</option><option value="draft">작업 과정</option>
      </select></label>
      <label>만든 날<input type="date" id="date"></label>
    </div>
    <label class="check"><input type="checkbox" id="featured"> 대표 작품으로 보이기</label>
    <div class="thumb">
      <div class="box" id="thumbBox">썸네일 없음</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label>썸네일 이미지 (선택)<input type="file" id="thumbFile" accept="image/*"></label>
        <p class="hint">HTML 파일을 고르면 첫 화면을 자동으로 찍어 봐요. 마음에 안 들면 이미지를 직접 골라 주세요.</p>
      </div>
    </div>
    <div id="msg" class="msg" hidden></div>
    <button type="submit" class="primary" id="submit">작품 서랍에 올리기</button>
  </form>

  <div class="card">
    <h2>올라간 작품</h2>
    <p class="hint">빼기를 두 번 누르면 목록에서 빠져요. 이 메뉴로 올린 작품은 파일도 함께 지워져요.</p>
    <div class="list" id="list"><p class="hint">불러오는 중…</p></div>
  </div>
</div>
<iframe id="shot" title="썸네일 만들기" aria-hidden="true" tabindex="-1"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const CATS={game:"게임",lesson:"수업자료",slides:"슬라이드·연수",design:"디자인",class:"학급 활동",plan:"계획·기획",tool:"도구",video:"영상",draft:"작업 과정"};
let mode="file",html=null,thumb=null;
$("date").value=new Date().toISOString().slice(0,10);
try{const p=localStorage.getItem("drawer-pw");if(p){$("pw").value=p;$("remember").checked=true}}catch(_){}

function say(t,kind){const m=$("msg");m.textContent=t;m.className="msg "+kind;m.hidden=!t}
function setThumb(d){thumb=d;const b=$("thumbBox");if(d){b.style.backgroundImage=`url(${d})`;b.textContent=""}else{b.style.backgroundImage="";b.textContent="썸네일 없음"}}

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("fileWrap").hidden=mode!=="file";$("linkWrap").hidden=mode!=="link";
});

function toJpeg(src,w=640,h=400){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);const s=Math.max(w/img.width,h/img.height);const dw=img.width*s,dh=img.height*s;g.drawImage(img,(w-dw)/2,0,dw,dh);ok(c.toDataURL("image/jpeg",0.82))};img.onerror=no;img.src=src})}

$("file").onchange=async e=>{
  const f=e.target.files[0];html=null;if(!f)return;
  if(f.size>4*1024*1024){say("파일이 4MB보다 커요. 더 작은 파일을 골라 주세요.","err");e.target.value="";return}
  html=await f.text();
  if(!$("title").value){const m=html.match(/<title>([^<]{1,80})<\/title>/i);$("title").value=(m?m[1]:f.name.replace(/\.html?$/i,"")).trim()}
  if($("thumbFile").files[0])return;
  say("첫 화면을 찍고 있어요…","info");
  try{
    const fr=$("shot");
    await new Promise(r=>{fr.onload=r;fr.srcdoc=html});
    await new Promise(r=>setTimeout(r,2500));
    const doc=fr.contentDocument;
    const c=await html2canvas(doc.documentElement,{width:1280,height:800,windowWidth:1280,windowHeight:800,scale:0.5,useCORS:true,logging:false,backgroundColor:"#ffffff"});
    setThumb(await toJpeg(c.toDataURL("image/png")));say("","info");
  }catch(err){setThumb(null);say("첫 화면을 자동으로 찍지 못했어요. 썸네일 이미지를 골라 주시거나 그냥 올려도 돼요.","info")}
  finally{$("shot").srcdoc=""}
};
$("thumbFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);try{setThumb(await toJpeg(url))}catch(_){say("이미지를 읽지 못했어요.","err")}URL.revokeObjectURL(url)};

async function api(payload){
  const pw=$("pw").value;
  if(!pw){throw new Error("올리기 비밀번호를 적어 주세요.")}
  try{if($("remember").checked)localStorage.setItem("drawer-pw",pw);else localStorage.removeItem("drawer-pw")}catch(_){}
  const r=await fetch("api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,...payload})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||("요청이 실패했어요 ("+r.status+")"));
  return d;
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const item={title:$("title").value.trim(),desc:$("desc").value.trim(),cat:$("cat").value,date:$("date").value,featured:$("featured").checked};
  if(!item.title){say("제목을 적어 주세요.","err");return}
  const payload={action:"add",item};
  if(mode==="file"){if(!html){say("HTML 파일을 골라 주세요.","err");return}payload.html=html}
  else{const u=$("url").value.trim();if(!/^https?:\/\//i.test(u)){say("https:// 로 시작하는 주소를 적어 주세요.","err");return}item.url=u}
  if(thumb)payload.thumb=thumb;
  if(JSON.stringify(payload).length>4.2e6){say("파일과 썸네일을 합쳐 너무 커요. 썸네일을 빼거나 더 작은 파일로 해 주세요.","err");return}
  $("submit").disabled=true;say("올리는 중이에요…","info");
  try{
    await api(payload);
    say(`‘${item.title}’을(를) 올렸어요. 1분쯤 지나면 작품 서랍에 나타나요.`,"ok");
    $("form").reset();$("date").value=new Date().toISOString().slice(0,10);html=null;setThumb(null);
    setTimeout(loadList,1500);
  }catch(err){say(err.message,"err")}
  finally{$("submit").disabled=false}
});

let armed=null;
async function loadList(){
  try{
    const w=await fetch("works.json",{cache:"no-store"}).then(r=>r.json());
    $("list").innerHTML="";
    w.forEach(x=>{
      const row=document.createElement("div");row.className="item";
      const s=document.createElement("span");s.innerHTML=`<b></b> <small></small>`;s.querySelector("b").textContent=x.title;s.querySelector("small").textContent=`${CATS[x.cat]||""} · ${x.date||""}`;
      const b=document.createElement("button");b.type="button";b.textContent="빼기";
      b.onclick=async()=>{
        if(armed!==x.id){armed=x.id;b.textContent="한 번 더 누르면 빠져요";setTimeout(()=>{if(armed===x.id){armed=null;b.textContent="빼기"}},3000);return}
        armed=null;b.disabled=true;b.textContent="빼는 중…";
        try{await api({action:"delete",id:x.id});row.remove();say(`‘${x.title}’을(를) 뺐어요. 1분쯤 지나면 반영돼요.`,"ok")}
        catch(err){b.disabled=false;b.textContent="빼기";say(err.message,"err")}
      };
      row.append(s,b);$("list").append(row);
    });
  }catch(_){$("list").innerHTML='<p class="hint">목록을 불러오지 못했어요.</p>'}
}
loadList();
</script>
</body>
</html>
