<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>클로드 작품 서랍</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a set of index-tab drawers — category tabs across the top, cards filed underneath like catalogue cards */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1F2A33; --muted:#5F6B72; --line:#D9DED8; --accent:#2E6B5E;
  --c-game:#E0663F; --c-lesson:#2E6B5E; --c-slides:#3D5A99; --c-design:#B5487A; --c-class:#D49A1E; --c-plan:#6B5B95; --c-tool:#4A7F96; --c-draft:#8A8F87; --c-video:#C24A3A;
  --font-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151A1D; --surface:#1E252A; --ink:#E7ECEA; --muted:#9AA6AC; --line:#2F383E; --accent:#6FC1AC;
  --c-game:#EE8762; --c-lesson:#5FAE98; --c-slides:#7C98D6; --c-design:#DA7BA7; --c-class:#E8B64A; --c-plan:#9C8CC8; --c-tool:#78AFC6; --c-draft:#8E968D; --c-video:#E8806E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A1D; --surface:#1E252A; --ink:#E7ECEA; --muted:#9AA6AC; --line:#2F383E; --accent:#6FC1AC;
  --c-game:#EE8762; --c-lesson:#5FAE98; --c-slides:#7C98D6; --c-design:#DA7BA7; --c-class:#E8B64A; --c-plan:#9C8CC8; --c-tool:#78AFC6; --c-draft:#8E968D; --c-video:#E8806E;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.count{font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search],input[type=text],input[type=url],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input[type=search]{width:min(320px,100%)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
/* index tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:0}
.tab{border:2px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:7px 14px 6px;background:transparent;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:-2px}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.tab[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);color:var(--ink);font-weight:700}
.tab.sep{margin-left:auto}
h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0 0 12px}
.featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.featured .card .cover{aspect-ratio:16/10}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;color:inherit;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease;position:relative;min-width:0}
a.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--ink) 40%,transparent)}
.cover img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:var(--surface)}
.cover .label{z-index:1}
a.card:hover img.shot{transform:scale(1.03)}
.cover img.shot{transition:transform .3s ease}
.cover{aspect-ratio:16/10;max-width:100%;background:var(--c);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px 14px}
.cover::before{content:"";position:absolute;inset:0;opacity:.22;background-image:var(--pat)}
.cover .glyph{position:absolute;right:-6px;top:-18px;font-family:var(--font-display);font-size:120px;line-height:1;color:var(--bg);opacity:.35}
.cover .label{position:relative;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--bg);background:color-mix(in srgb,var(--ink) 25%,transparent);padding:2px 8px;border-radius:999px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.title{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge-local{color:var(--c-class);font-weight:700}
.edit-btns{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.edit-btns button{padding:4px 9px;font-size:12px;background:var(--surface)}
.empty,.notice{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center}
.notice{padding:10px 14px;text-align:left;font-size:13px}
/* patterns per category */
.k-game{--c:var(--c-game);--pat:radial-gradient(circle at 2px 2px,var(--bg) 2px,transparent 2.5px);background-size:auto}
.k-game .cover::before{background-size:14px 14px}
.k-lesson{--c:var(--c-lesson)} .k-lesson .cover::before{background-image:linear-gradient(var(--bg) 1px,transparent 1px),linear-gradient(90deg,var(--bg) 1px,transparent 1px);background-size:16px 16px}
.k-slides{--c:var(--c-slides)} .k-slides .cover::before{background-image:repeating-linear-gradient(0deg,var(--bg) 0 2px,transparent 2px 22px)}
.k-design{--c:var(--c-design)} .k-design .cover::before{background-image:repeating-linear-gradient(45deg,var(--bg) 0 2px,transparent 2px 12px)}
.k-class{--c:var(--c-class)} .k-class .cover::before{background-image:radial-gradient(circle,var(--bg) 3px,transparent 3.5px);background-size:22px 22px}
.k-plan{--c:var(--c-plan)} .k-plan .cover::before{background-image:repeating-linear-gradient(0deg,var(--bg) 0 1px,transparent 1px 14px)}
.k-tool{--c:var(--c-tool)} .k-tool .cover::before{background-image:repeating-linear-gradient(90deg,var(--bg) 0 2px,transparent 2px 18px)}
.k-draft{--c:var(--c-draft)} .k-draft .cover::before{background-image:repeating-linear-gradient(-45deg,var(--bg) 0 1px,transparent 1px 8px)}
.k-game .cover::before{background-image:radial-gradient(circle at 2px 2px,var(--bg) 2px,transparent 2.5px)}
.k-video{--c:var(--c-video)}
button.card{padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;border:1px solid var(--line);background:var(--surface)}
button.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--ink) 40%,transparent)}
button.card:hover img.shot{transform:scale(1.03)}
.play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:color-mix(in srgb,var(--ink) 70%,transparent);z-index:1;display:grid;place-items:center}
.play::after{content:"";border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent var(--bg);margin-left:4px}
.player{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.player .box{width:min(1100px,100%);display:flex;flex-direction:column;gap:10px}
.player video{width:100%;max-height:78vh;background:#000;border-radius:10px}
.player .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff}
.player .bar b{font-size:16px}
.upload-link{font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:9px 14px;white-space:nowrap}
.upload-link:hover{background:var(--accent);color:var(--bg)}
/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:14px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row>*{flex:1 1 160px}
.sheet .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.sheet .actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.err{color:var(--c-game);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.tab.sep{margin-left:0}.cover .glyph{font-size:90px}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>클로드 작품 서랍</h1>
      <p class="sub">Claude와 함께 만든 게임, 수업자료, 디자인을 한곳에 모았어요. <span class="count" id="count"></span></p>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="제목이나 설명으로 찾기" aria-label="작품 검색">
      <a href="admin.html" class="upload-link">작품 올리기</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="카테고리"></nav>
  <div id="notice" class="notice" hidden></div>

  <section id="featSec">
    <h2>대표 작품</h2>
    <div class="featured" id="featured"></div>
  </section>

  <section>
    <h2 id="listTitle">모든 작품</h2>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="player" id="player" hidden>
  <div class="box">
    <video id="pv" controls playsinline preload="metadata"></video>
    <div class="bar"><b id="pt"></b><button type="button" id="pclose">닫기</button></div>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <form class="sheet" id="form">
    <h2 id="formTitle" style="margin:0">작품 추가</h2>
    <label>제목<input type="text" id="f-title" required></label>
    <label>한 줄 설명<textarea id="f-desc" rows="2"></textarea></label>
    <label>주소 (Claude 작품 링크나 배포 주소)<input type="url" id="f-url" placeholder="https://claude.ai/artifact/..."></label>
    <div class="row">
      <label>카테고리<select id="f-cat"></select></label>
      <label>만든 날<input type="date" id="f-date"></label>
    </div>
    <label class="check"><input type="checkbox" id="f-featured"> 대표 작품으로 보이기</label>
    <p class="err" id="f-err" hidden></p>
    <div class="actions">
      <button type="button" id="f-del" hidden>삭제</button>
      <span style="display:flex;gap:8px;margin-left:auto">
        <button type="button" id="f-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </span>
    </div>
  </form>
</div>

<script>
const CATS={game:"게임",lesson:"수업자료",slides:"슬라이드·연수",design:"디자인",class:"학급 활동",plan:"계획·기획",tool:"도구",video:"영상",draft:"작업 과정"};
const $=id=>document.getElementById(id);
let works=[],filter="all",query="",db=null,canEdit=false,editing=null,loaded=false;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return `${y}.${m}.${dd}`}

function card(w){
  const cat=CATS[w.cat]?w.cat:"tool";
  const glyph=esc((w.title||"?").trim().charAt(0));
  const local=w.place==="local";
  const tag=w.url?"a":(w.video?"button":"div");
  const href=w.url?` href="${esc(w.url)}" target="_blank" rel="noopener"`:(w.video?` type="button" data-play="${esc(w.id)}"`:"");
  return `<${tag} class="card k-${cat}"${href}>
    <div class="cover"><span class="glyph" aria-hidden="true">${glyph}</span><img class="shot" src="thumbs/${encodeURIComponent(w.id)}.jpg" alt="" loading="lazy">${w.video?'<span class="play" aria-hidden="true"></span>':""}<span class="label">${CATS[cat]}</span></div>
    <div class="body"><div class="title">${esc(w.title)}</div><div class="desc">${esc(w.desc)}</div>
    <div class="meta"><span>${fmt(w.date)}</span>${local?'<span class="badge-local">내 컴퓨터</span>':(w.url?(w.url.startsWith("https://claude.ai")?"<span>Claude에서 열기 ↗</span>":"<span>열기 →</span>"):(w.video?"<span>재생 ▶</span>":""))}</div></div>
    ${canEdit?`<div class="edit-btns"><button type="button" data-edit="${esc(w.id)}">수정</button></div>`:""}
  </${tag}>`;
}

function render(){
  const q=query.trim().toLowerCase();
  const match=w=>!q||(w.title+" "+(w.desc||"")).toLowerCase().includes(q);
  const sorted=[...works].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const main=sorted.filter(w=>w.cat!=="draft");
  $("count").textContent=works.length?`지금 ${main.length}개가 들어 있어요.`:"";
  // tabs
  const counts={};works.forEach(w=>counts[w.cat]=(counts[w.cat]||0)+1);
  const tabList=[["all","전체",main.length,"var(--ink)"],...Object.keys(CATS).filter(k=>counts[k]).map(k=>[k,CATS[k],counts[k],`var(--c-${k})`])];
  $("tabs").innerHTML=tabList.map(([k,l,n,c])=>`<button type="button" class="tab${k==="draft"?" sep":""}" data-cat="${k}" aria-pressed="${filter===k}" style="--c:${c}"><span class="dot"></span>${l}<span class="n">${n}</span></button>`).join("");
  // featured
  const feat=main.filter(w=>w.featured&&match(w)).slice(0,4);
  $("featSec").hidden=!(filter==="all"&&feat.length);
  $("featured").innerHTML=feat.map(card).join("");
  // list
  const list=(filter==="all"?main:sorted.filter(w=>w.cat===filter)).filter(match);
  $("listTitle").textContent=filter==="all"?"모든 작품":CATS[filter];
  if(!loaded){$("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">작품 목록을 불러오고 있어요.</div>`;return}
  if(!works.length){$("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">아직 서랍이 비어 있어요. ${canEdit?"오른쪽 위 ‘작품 추가’로 첫 작품을 넣어 보세요.":"주인이 작품을 넣으면 여기에 보여요."}</div>`;return}
  $("grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1">‘${esc(query)}’와 맞는 작품이 없어요.</div>`;
}

$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;filter=b.dataset.cat;try{localStorage.setItem("drawer-tab",filter)}catch(_){}render()});
$("q").addEventListener("input",e=>{query=e.target.value;render()});
try{const t=localStorage.getItem("drawer-tab");if(t)filter=t}catch(_){}

// editing
$("f-cat").innerHTML=Object.entries(CATS).map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
function openForm(w){
  editing=w||null;
  $("formTitle").textContent=w?"작품 수정":"작품 추가";
  $("f-title").value=w?.title||"";$("f-desc").value=w?.desc||"";$("f-url").value=w?.url||"";
  $("f-cat").value=w?.cat||"game";$("f-date").value=w?.date||new Date().toISOString().slice(0,10);
  $("f-featured").checked=!!w?.featured;$("f-del").hidden=!w;$("f-err").hidden=true;
  $("modal").hidden=false;$("f-title").focus();
}
function closeForm(){$("modal").hidden=true;editing=null}
document.addEventListener("click",e=>{const b=e.target.closest("[data-edit]");if(!b)return;e.preventDefault();e.stopPropagation();openForm(works.find(w=>w.id===b.dataset.edit))},true);
$("addBtn").onclick=()=>openForm(null);
$("f-cancel").onclick=closeForm;
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modal").hidden)closeForm()});
function showErr(m){$("f-err").textContent=m;$("f-err").hidden=false}
$("form").addEventListener("submit",async e=>{
  e.preventDefault();if(!db)return;
  const data={title:$("f-title").value.trim(),desc:$("f-desc").value.trim(),url:$("f-url").value.trim(),cat:$("f-cat").value,date:$("f-date").value,featured:$("f-featured").checked};
  if(editing?.place)data.place=editing.place;
  try{
    if(editing)await db.collection("works").doc(editing.id).set(data);
    else await db.collection("works").add(data);
    closeForm();
  }catch(err){showErr(err?.code==="quota_exceeded"?"서랍이 가득 찼어요. 오래된 작품을 지운 뒤 다시 저장해 주세요.":"저장하지 못했어요. 이 페이지를 편집할 권한이 있는지 확인해 주세요.")}
});
let delArmed=false;
$("f-del").onclick=async()=>{
  if(!editing||!db)return;
  if(!delArmed){delArmed=true;$("f-del").textContent="한 번 더 누르면 삭제";setTimeout(()=>{delArmed=false;$("f-del").textContent="삭제"},3000);return}
  delArmed=false;$("f-del").textContent="삭제";
  try{await db.collection("works").doc(editing.id).delete();closeForm()}catch(_){showErr("삭제하지 못했어요.")}
};

document.addEventListener("error",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("shot"))t.remove()},true);
render();
function closePlayer(){const v=$("pv");v.pause();v.removeAttribute("src");v.load();$("player").hidden=true}
document.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(!b)return;const w=works.find(x=>x.id===b.dataset.play);if(!w)return;$("pt").textContent=w.title;const v=$("pv");v.src="videos/"+encodeURIComponent(w.video);$("player").hidden=false;v.play().catch(()=>{})});
$("pclose").onclick=closePlayer;
$("player").addEventListener("click",e=>{if(e.target.id==="player")closePlayer()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("player").hidden)closePlayer()});
fetch("works.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{works=d;loaded=true;render()}).catch(()=>{loaded=true;$("notice").textContent="작품 목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.";$("notice").hidden=false;render()});
</script>
</body></html>
